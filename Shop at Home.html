<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; background:#F4F2EC; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }

  .mono { font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace; }
  a { color:#B48A00; text-decoration:none; } a:hover { color:#8f6d00; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button { font-family:inherit; }
  @keyframes shPing { 0%{ transform:scale(.7); opacity:.7 } 100%{ transform:scale(2.1); opacity:0 } }
  @keyframes shSlide { from{ transform:translateX(28px); opacity:0 } to{ transform:translateX(0); opacity:1 } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
</style>
