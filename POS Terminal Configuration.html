<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POS Terminal Configuration — Refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:"Inter",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:#f0eee9}
  #root{height:100%}
  a{color:#7A5A00;text-decoration:none}
  a:hover{color:#5a4300}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,120,.32);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(128,128,120,.5);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  input::placeholder{color:rgba(128,128,120,.7)}
  button{font-family:inherit}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#15140f">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#15140f"/>
    <rect x="470" y="300" width="120" height="120" rx="24" fill="#15140f" stroke="#FFD100" stroke-width="8"/>
    <rect x="610" y="300" width="120" height="120" rx="24" fill="#FFD100"/>
    <text x="600" y="560" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" letter-spacing="6" fill="#8a8a80" text-anchor="middle">POS TERMINALS</text>
  </svg>
</template>
<div id="root"></div>

<!-- The stacking scale. MUST be first: every floating layer on this page reads it,
     and the plain-JS chrome mounts before any text/babel module has run. -->
<script src="shared/hw-z.js"></script>
<script src="shared/brands.js"></script>
<script src="shared/app-nav.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- window.ScreenBoundary (CONTAIN) + window.CriticalBoundary (REFUSE).
     PLAIN JS, after React and BEFORE babel: the file is pure
     React.createElement with no JSX, and every text/babel screen below is
     transformed and executed later, so it must already be defined when the
     first screen runs -- a screen referencing an undefined boundary throws
     "type is invalid" and white-screens the page.
     Terminal config CONTAINS: see terminals/tcanvas.jsx. -->
<script src="shared/error-boundary.jsx"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="shared/app-rail.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<script type="text/babel" src="pos/data.jsx"></script>
<script type="text/babel" src="terminals/tdata.jsx"></script>
<script type="text/babel" src="terminals/tshared.jsx"></script>
<script type="text/babel" src="terminals/tdrawer.jsx"></script>
<script type="text/babel" src="terminals/v2.jsx"></script>
<script type="text/babel" src="terminals/tcanvas.jsx"></script>
<script src="shared/app-switcher.js"></script>
<script src="shared/tour-steps.js"></script>
<script src="shared/tour.js"></script>
<script src="shared/notes.js"></script>
</body>
</html>
