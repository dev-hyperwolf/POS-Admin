<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RFID — Hyperdrive</title>
<!-- Resolve every relative URL from the repo root, so this module loads the
     real shared design system (pos/*, shared/*) without copying a byte of it,
     and so the rail's cross-app links still point at the real apps. -->
<base href="../"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button, select, input { font-family:inherit; }
  .hd-2col { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:20px; align-items:start; }
  @media (max-width:1180px){ .hd-2col { grid-template-columns:minmax(0,1fr); } }
  /* The paired handheld/desktop view: device column + explanation column. */
  .rfid-pair { display:grid; grid-template-columns:440px minmax(0,1fr); gap:20px; align-items:start; }
  @media (max-width:1180px){ .rfid-pair { grid-template-columns:minmax(0,1fr); } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform:rotate(360deg); } }
  @keyframes shimmer { 0% { background-position:100% 50%; } 100% { background-position:0 50%; } }
  /* The read sweep on the handheld scan field. */
  @keyframes rfidsweep { 0% { transform:translateY(0); opacity:.25 } 50% { transform:translateY(96px); opacity:1 } 100% { transform:translateY(0); opacity:.25 } }
</style>
</head>
<body>
<div id="root"></div>

<!-- The stacking scale. MUST be first: `pos/tokens.jsx` exposes it as `P.z` and
     `shared/hd-ui.jsx`'s ToastHost reads `P.z.toast` at first paint. Without it the
     page rendered a blank #root the moment the shared layer started reading the scale.

     An earlier version of this comment claimed "every other entry page already loads
     this". That was false and never swept for: three rfid-direction-* prototypes and
     three explorations/ pages were missing it too. tokens.jsx now falls back to a
     default scale and warns, so a forgotten tag degrades instead of blanking the app.
     Sweep with an actual <script src> match -- prose mentions of tokens.jsx produce
     false positives, which is how two explorations/ pages were first miscounted. -->
<script src="shared/hw-z.js"></script>
<script src="shared/brands.js"></script>
<script src="shared/app-nav.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- window.ScreenBoundary (CONTAIN) + window.CriticalBoundary (REFUSE).
     PLAIN JS, after React and BEFORE babel: the file is pure
     React.createElement with no JSX, and every text/babel screen below is
     transformed and executed later, so it must already be defined when the
     first screen runs -- a screen referencing an undefined boundary throws
     "type is invalid" and white-screens the page.
     RFID study. CONTAINS at shell level. -->
<script src="shared/error-boundary.jsx"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="shared/app-rail.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<script type="text/babel" src="shared/hd-format.jsx"></script>
<script type="text/babel" src="shared/hd-ui.jsx"></script>

<script type="text/babel" src="rfid/data.jsx"></script>
<script type="text/babel" src="rfid/ui.jsx"></script>
<script type="text/babel" src="rfid/device.jsx"></script>
<script type="text/babel" src="rfid/handheld.jsx"></script>
<script type="text/babel" src="rfid/screen-kits.jsx"></script>
<script type="text/babel" src="rfid/screen-counts.jsx"></script>
<script type="text/babel" src="rfid/screen-tags.jsx"></script>
<script type="text/babel" src="rfid/screen-system.jsx"></script>
<script type="text/babel" src="rfid/screen-handheld.jsx"></script>
<script type="text/babel" src="rfid/app.jsx"></script>

<!-- PLATFORM CHROME. Every other console loads these; this one did not, which is why
     the note taker and the app switcher were missing from the RFID tab while they
     worked everywhere else. Order matches Hyperwolf POS.html: switcher, tour steps,
     tour, notes. Loaded last, after the app, because they attach to a mounted DOM. -->
<script src="shared/app-switcher.js"></script>
<script src="shared/tour-steps.js"></script>
<script src="shared/tour.js"></script>
<script src="shared/notes.js"></script>
</body>
</html>
