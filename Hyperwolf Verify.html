<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verify — Hyperwolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button, select, input, textarea { font-family:inherit; }
  a { color:#7A5A00; }
  a:hover { color:#0F0F0C; }
  /* Every new app HTML declares these itself (Bounty's own note: Engage's
     HTML never declares them even though shared/states.jsx's Skeleton
     depends on `shimmer`) — same three keyframes, same values. */
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- The stacking scale. MUST be first: every floating layer on this page
     reads it, and the plain-JS chrome mounts before any text/babel module
     has run. -->
<script src="shared/hw-z.js"></script>
<script src="shared/brands.js"></script>
<script src="shared/app-nav.js"></script>
<!-- shared/hw-live.js, LOADED BEFORE REACT, same as Hyperwolf Bounty.html.
     data-hw-live-lite="1" arms base resolution, get()/post(), the write
     token and the badge, and skips the /api/state catalog fetch, the
     fulfilment-board fetch and the window.HW accessor: Verify carries no
     pos/data.jsx and has no catalog for any of those to update. -->
<script src="shared/hw-live.js" data-hw-live-lite="1"></script>

<!-- Best-effort existence check for the idv/screen-*.jsx files listed in
     docs/IDV-PLAN-2026-09-08.md §5.1 — other agents build those, not this
     task, so most of them do not exist yet. This is NOT what keeps the page
     from breaking (that is app.jsx's ROUTES()/SCREEN_SOURCE + ErrorState —
     a screen tag that 404s simply never defines its window.Idv*Screen global,
     exactly like every other app in this estate). It exists only so a
     screen file can be checked directly from the console
     (`window.__idvMissing`) without opening the network tab. Plain fetch,
     not the script tag's own `onerror` — a <script type="text/babel"> is
     never fetched by the BROWSER's native script loader at all (unrecognised
     "type" aborts "prepare the script element" before any network request),
     so that attribute is inert; @babel/standalone does its own fetch after
     DOMContentLoaded. The literal onerror="" attribute is left on each babel
     tag below anyway, harmlessly, in case a future browser or Babel version
     changes that. -->
<script>
  window.__idvMissing = window.__idvMissing || {};
  (function () {
    var files = [
      'idv/screen-home.jsx', 'idv/screen-people.jsx', 'idv/screen-sessions.jsx',
      'idv/screen-session.jsx', 'idv/screen-review.jsx', 'idv/screen-workflows.jsx',
      'idv/screen-questionnaires.jsx', 'idv/screen-customization.jsx', 'idv/screen-lists.jsx',
      'idv/screen-integrate.jsx', 'idv/screen-usage.jsx', 'idv/screen-settings.jsx',
    ];
    files.forEach(function (f) {
      fetch(f, { method: 'HEAD', cache: 'no-store' }).then(function (res) {
        if (!res.ok) window.__idvMissing[f] = true;
      }).catch(function () { window.__idvMissing[f] = true; });
    });
  })();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- window.ScreenBoundary (CONTAIN) + window.CriticalBoundary (REFUSE).
     PLAIN JS, after React and BEFORE babel. -->
<script src="shared/error-boundary.jsx"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="shared/app-rail.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<script type="text/babel" src="shared/hd-format.jsx"></script>
<script type="text/babel" src="shared/hd-ui.jsx"></script>

<script type="text/babel" src="idv/idv-client.jsx"></script>
<script src="idv/terms-text.js"></script>
<script type="text/babel" src="idv/idv-shared.jsx"></script>
<script type="text/babel" src="idv/idv-terms.jsx"></script>

<!-- idv/screen-*.jsx — docs/IDV-PLAN-2026-09-08.md §5.1. Not built by this
     task (other agents own them); each registers a window.Idv*Screen global
     that idv/app.jsx resolves at render, so a missing one shows a named
     ErrorState instead of a blank route or a broken page. onerror="" is
     inert for type="text/babel" (see the note above) and is left in place
     only as a harmless, spec-tolerant no-op. -->
<script type="text/babel" src="idv/screen-home.jsx" onerror="window.__idvMissing['idv/screen-home.jsx']=true"></script>
<script type="text/babel" src="idv/screen-people.jsx" onerror="window.__idvMissing['idv/screen-people.jsx']=true"></script>
<script type="text/babel" src="idv/screen-sessions.jsx" onerror="window.__idvMissing['idv/screen-sessions.jsx']=true"></script>
<script type="text/babel" src="idv/screen-session.jsx" onerror="window.__idvMissing['idv/screen-session.jsx']=true"></script>
<script type="text/babel" src="idv/screen-review.jsx" onerror="window.__idvMissing['idv/screen-review.jsx']=true"></script>
<script type="text/babel" src="idv/screen-workflows.jsx" onerror="window.__idvMissing['idv/screen-workflows.jsx']=true"></script>
<script type="text/babel" src="idv/screen-questionnaires.jsx" onerror="window.__idvMissing['idv/screen-questionnaires.jsx']=true"></script>
<script type="text/babel" src="idv/screen-customization.jsx" onerror="window.__idvMissing['idv/screen-customization.jsx']=true"></script>
<script type="text/babel" src="idv/screen-lists.jsx" onerror="window.__idvMissing['idv/screen-lists.jsx']=true"></script>
<script type="text/babel" src="idv/screen-integrate.jsx" onerror="window.__idvMissing['idv/screen-integrate.jsx']=true"></script>
<script type="text/babel" src="idv/screen-usage.jsx" onerror="window.__idvMissing['idv/screen-usage.jsx']=true"></script>
<script type="text/babel" src="idv/screen-settings.jsx" onerror="window.__idvMissing['idv/screen-settings.jsx']=true"></script>

<script type="text/babel" src="idv/app.jsx"></script>

<script src="shared/app-switcher.js"></script>
</body>
</html>
