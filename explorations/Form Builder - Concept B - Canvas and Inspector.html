<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Form Builder — Concept B — Canvas and Inspector</title>
<style>
/* ============================================================================
   Form Builder — Concept B — Canvas + Inspector. Left: field list / palette.
   Center: the form itself, rendered with real HDForm widget shapes per
   FIELD_TYPES (proposal §7 direction "(a) builder canvas drag/drop"). Right:
   inspector for the selected field — the same properties as Concept A's
   columns, one at a time, plus a showWhen condition-row editor (proposal §7
   direction "(b) showWhen condition editor UI"). Ground truth:
   FORM-GENERATOR-PROPOSAL.md §2, §6; wm-demo/wmdemo/forms.py FIELD_TYPES /
   FORMDEF_SCHEMA / _COND_OPS. Every editable control carries
   data-binds="<FormDef/Field property or API route>" — hover to see it.
   Field order in the canvas IS FormDef.fields[] order (drag reorders that
   array; no separate "layout" concept exists). No nested showWhen trees, no
   real-time co-editing, no PDF beyond browser print. Example data only.
   No build step, no external requests.
   ========================================================================= */
:root{
  --sans:-apple-system,system-ui,"Segoe UI",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#F4F2EC; --surface:#FFFFFF; --surface2:#FAF9F5; --surface3:#F1EFE9;
  --ink:#0F0F0C; --ink2:#2A2A26; --inkDim:rgba(15,15,12,.60); --inkMute:rgba(15,15,12,.42);
  --line:rgba(15,15,12,.12); --line2:rgba(15,15,12,.20);
  --accent:#2C5BB8; --accentSoft:#E3ECFA; --accentInk:#FFFFFF; --accentBorder:#9FB6E2;
  --good:#1F8A4F; --goodSoft:#E2F2E8; --warn:#C07A12; --warnSoft:#FBEFD6;
  --bad:#C0392B; --badSoft:#F8E2DF; --neutral:#6E6E66; --neutralSoft:#ECEAE2;
  --rail:#13130F; --railInk:rgba(255,255,255,.72); --railBright:#FFFFFF;
  --railHover:rgba(255,255,255,.06); --railActive:rgba(255,209,0,.14); --accentRail:#FFD100;
  --shadowSm:0 1px 2px rgba(15,15,12,.06);
  --shadowMd:0 1px 0 rgba(15,15,12,.04), 0 6px 18px rgba(15,15,12,.07);
}
html[data-theme="dark"]{
  --bg:#0D0D0A; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
  --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40);
  --line:rgba(245,243,234,.12); --line2:rgba(245,243,234,.18);
  --accent:#6A99EC; --accentSoft:rgba(106,153,236,.16); --accentInk:#0D0D0A; --accentBorder:rgba(106,153,236,.5);
  --good:#46C07E; --goodSoft:rgba(70,192,126,.15); --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15);
  --bad:#E8675B; --badSoft:rgba(232,103,91,.16); --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08);
  --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
  --railHover:rgba(255,255,255,.05); --railActive:rgba(255,209,0,.14);
  --shadowSm:0 1px 2px rgba(0,0,0,.4);
  --shadowMd:0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0D0D0A; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
    --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40);
    --line:rgba(245,243,234,.12); --line2:rgba(245,243,234,.18);
    --accent:#6A99EC; --accentSoft:rgba(106,153,236,.16); --accentInk:#0D0D0A; --accentBorder:rgba(106,153,236,.5);
    --good:#46C07E; --goodSoft:rgba(70,192,126,.15); --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15);
    --bad:#E8675B; --badSoft:rgba(232,103,91,.16); --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08);
    --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
    --railHover:rgba(255,255,255,.05); --railActive:rgba(255,209,0,.14);
    --shadowSm:0 1px 2px rgba(0,0,0,.4);
    --shadowMd:0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans);height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:56px 1fr;height:100vh}
.rail{background:var(--rail);color:var(--railInk);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.rail-logo{width:30px;height:30px;border-radius:8px;background:var(--accentRail);color:#1A1400;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:10px}
.rail-item{width:38px;height:38px;border-radius:9px;border:0;background:transparent;color:var(--railInk);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail-item:hover{background:var(--railHover)}
.rail-item.active{background:var(--railActive);color:var(--railBright)}
.rail-spacer{flex:1}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{font-size:12.5px;color:var(--inkDim)}
.crumb b{color:var(--ink);font-weight:650}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--warnSoft);color:var(--warn);font-weight:600}
.topbar .spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.ghost{border-color:transparent}
.body3{flex:1;display:grid;grid-template-columns:220px 1fr 300px;min-height:0}
.pal{border-right:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;min-height:0}
.pal h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--inkMute);margin:0;padding:12px 12px 6px}
.paltypes{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 12px}
.paltype{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:6px 4px;text-align:center;font-size:10.5px;color:var(--ink2);cursor:grab}
.paltype:hover{background:var(--accentSoft);border-color:var(--accentBorder);color:var(--accent)}
.flist{flex:1;overflow:auto;padding:2px 6px 12px}
.fitem{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink2)}
.fitem:hover{background:var(--surface3)}
.fitem.sel{background:var(--accentSoft);color:var(--accent);font-weight:600}
.fitem .drag{color:var(--inkMute);cursor:grab;font-size:11px}
.fitem .k{font-family:var(--mono);font-size:11px}
.canvas{overflow:auto;padding:26px;display:flex;justify-content:center}
.sheet{width:560px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadowMd);padding:26px 28px 30px}
.sheet h1{font-size:18px;margin:0 0 3px}
.sheet .sub{font-size:12px;color:var(--inkMute);margin:0 0 20px}
.frow{margin-bottom:16px;border-radius:8px;padding:6px 8px;margin-left:-8px;margin-right:-8px;cursor:pointer;border:1px solid transparent}
.frow:hover{background:var(--surface3)}
.frow.sel{background:var(--accentSoft);border-color:var(--accentBorder)}
.frow label{display:block;font-size:12px;font-weight:650;color:var(--ink2);margin-bottom:5px}
.frow label .req{color:var(--bad);margin-left:2px}
.frow label .hidden-tag{margin-left:8px;font-size:10px;font-weight:600;color:var(--warn);background:var(--warnSoft);padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
.fake-input{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;background:var(--surface2);color:var(--inkDim);font-size:12.5px}
.fake-select{display:flex;justify-content:space-between;align-items:center}
.photo-drop,.sig-pad{border:1.5px dashed var(--line2);border-radius:8px;padding:18px;text-align:center;color:var(--inkMute);font-size:11.5px;background:var(--surface2)}
.sig-pad{height:64px;display:flex;align-items:center;justify-content:center;font-style:italic}
.rg{border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.rg-row{display:grid;grid-template-columns:1fr 100px 26px;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.rg-row:last-child{border-bottom:0}
.rg-row input{border:0;background:transparent;color:var(--ink2);font:inherit;padding:2px 0}
.rg-add{padding:8px 10px;color:var(--accent);font-size:12px;cursor:pointer;background:var(--surface2)}
.computed-val{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;background:var(--surface3);color:var(--ink2);font-family:var(--mono);font-size:12.5px;display:flex;justify-content:space-between}
.computed-val .fx{font-size:10px;color:var(--inkMute);font-family:var(--mono)}
.insp{border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;min-height:0;overflow:auto}
.insp .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.insp .hd .k{font-family:var(--mono);font-size:13px;font-weight:700}
.insp .hd .t{font-size:11px;color:var(--inkMute)}
.iprop{padding:12px 16px;border-bottom:1px solid var(--line)}
.iprop label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--inkMute);font-weight:700;margin-bottom:5px}
.iprop input[type=text],.iprop select,.iprop textarea{width:100%;font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--ink)}
.iprop textarea{resize:vertical;min-height:44px;font-family:var(--mono);font-size:11.5px}
.irow{display:flex;align-items:center;gap:8px}
.irow input[type=checkbox]{width:16px;height:16px}
.cond-row{display:flex;gap:5px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:5px 7px;margin-bottom:6px;font-size:11.5px}
.cond-row select,.cond-row input{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:2px 4px;background:var(--surface2)}
.addcond{font-size:11px;color:var(--accent);cursor:pointer}
.helptext{font-size:10.5px;color:var(--inkMute);line-height:1.5;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-logo">HD</div>
    <button class="rail-item" title="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg></button>
    <button class="rail-item active" title="Forms"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M9 11h6M9 15h6M9 7h3"/></svg></button>
    <button class="rail-item" title="Submissions"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/></svg></button>
    <div class="rail-spacer"></div>
    <button class="rail-item" id="themeBtn" title="Toggle theme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="crumb">Forms / <b>Incident Report</b> / Builder</span>
      <span class="pill" title="binds: FormDef.version" data-binds="FormDef.version">published v3 · editing draft</span>
      <div class="spacer"></div>
      <button class="btn ghost" title="binds: HDForm({def, mode:'fill'})" data-binds="HDForm(mode:'fill')">Open full preview</button>
      <button class="btn primary" title="binds: POST /api/forms — new version; old submissions keep formVersion" data-binds="POST /api/forms">Publish v4</button>
    </header>
    <div class="body3">
      <aside class="pal">
        <h3>Add a field</h3>
        <div class="paltypes" id="paltypes"></div>
        <h3>Fields <span style="font-weight:400;text-transform:none;letter-spacing:0">— FormDef.fields[]</span></h3>
        <div class="flist" id="flist"></div>
      </aside>

      <div class="canvas">
        <div class="sheet">
          <h1>Incident Report</h1>
          <p class="sub" title="binds: FormDef.title, FormDef.attribution">Filled by staff at the time of the incident · reviewed by a manager</p>
          <div id="sheetFields"></div>
        </div>
      </div>

      <aside class="insp" id="insp"><!-- filled by JS --></aside>
    </div>
  </div>
</div>

<script>
(function(){
  var FORM = {
    id:"incident_report", version:3, title:"Incident Report",
    fields:[
      {key:"reportedBy", type:"person", label:"Reported by", required:true},
      {key:"incidentType", type:"select", label:"Incident type", required:true,
        options:["Theft","Injury","Equipment Damage","Property Damage","Other"]},
      {key:"occurredAt", type:"datetime", label:"When it happened", required:true},
      {key:"description", type:"textarea", label:"What happened", required:true, minLength:20},
      {key:"damagePhoto", type:"photo", label:"Photo of the damage", required:true,
        showWhen:{incidentType_eq:"Property Damage"}},
      {key:"lineItems", type:"repeating_group", label:"Items affected", required:true,
        fields:[
          {key:"description", type:"text", label:"Item", required:true},
          {key:"estimatedCost", type:"money", label:"Est. cost", $ref:"Money"}
        ]},
      {key:"estimatedTotal", type:"computed", label:"Estimated total", computed:"sum(lineItems.estimatedCost)", $ref:"Money"},
      {key:"managerSignature", type:"signature", label:"Manager sign-off", showWhen:{role_gte:"manager"}}
    ]
  };
  var TYPES = ["text","textarea","number","money","date","time","datetime","select","multiselect","boolean","person","store","photo","signature","checklist","repeating_group","computed"];
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};

  var selected = 1; // start on the select field to show showWhen + options together first render? use 4 (damagePhoto) to show showWhen

  function showWhenText(f){
    if(!f.showWhen) return "";
    return Object.keys(f.showWhen).map(function(k){return k+" = "+JSON.stringify(f.showWhen[k]);}).join(" AND ");
  }

  function renderPalette(){
    document.getElementById('paltypes').innerHTML = TYPES.map(function(t){
      return '<div class="paltype" draggable="true" title="binds: Field.type = &quot;'+t+'&quot;" data-binds="Field.type">'+t+'</div>';
    }).join('');
  }

  function renderList(){
    document.getElementById('flist').innerHTML = FORM.fields.map(function(f,i){
      return '<div class="fitem'+(i===selected?' sel':'')+'" data-i="'+i+'" title="binds: FormDef.fields['+i+']">'+
        '<span class="drag">⠿</span><span class="k">'+esc(f.key)+'</span></div>';
    }).join('');
    document.querySelectorAll('.fitem').forEach(function(el){
      el.addEventListener('click', function(){ selected = +el.getAttribute('data-i'); renderAll(); });
    });
  }

  function fieldBlock(f, i){
    var reqTag = f.required ? '<span class="req">*</span>' : '';
    var hiddenTag = f.showWhen ? '<span class="hidden-tag">showWhen</span>' : '';
    var body = '';
    switch(f.type){
      case 'person': body = '<div class="fake-input">Jordan T. — Associate</div>'; break;
      case 'select': body = '<div class="fake-input fake-select"><span>Property Damage</span><span>▾</span></div>'; break;
      case 'datetime': body = '<div class="fake-input">2026-09-09 · 6:40 PM</div>'; break;
      case 'textarea': body = '<div class="fake-input" style="min-height:44px">A pallet jack clipped the end-cap display near register 2; two shelves and product on them were damaged.</div>'; break;
      case 'photo': body = '<div class="photo-drop">📷 1 photo attached — damage_01.jpg</div>'; break;
      case 'signature': body = '<div class="sig-pad">✍️ signed — M. Alvarez, Store Manager</div>'; break;
      case 'repeating_group':
        body = '<div class="rg">'+
          (f.fields||[]).map(function(){return '';}).join('') +
          '<div class="rg-row"><input value="End-cap shelf unit" readonly><input value="$140.00" readonly><span></span></div>'+
          '<div class="rg-row"><input value="Assorted vape display stock" readonly><input value="$95.00" readonly><span></span></div>'+
          '<div class="rg-add" title="binds: Field.fields[] — appends a row using the same nested Field schema" data-binds="Field.fields[]">+ Add item</div>'+
        '</div>';
        break;
      case 'computed': body = '<div class="computed-val"><span>$235.00</span><span class="fx">= '+esc(f.computed)+'</span></div>'; break;
      default: body = '<div class="fake-input">example value</div>';
    }
    return '<div class="frow'+(i===selected?' sel':'')+'" data-i="'+i+'" title="binds: FormDef.fields['+i+']">'+
      '<label>'+esc(f.label)+reqTag+hiddenTag+'</label>'+body+
    '</div>';
  }

  function renderSheet(){
    document.getElementById('sheetFields').innerHTML = FORM.fields.map(fieldBlock).join('');
    document.querySelectorAll('.frow').forEach(function(el){
      el.addEventListener('click', function(){ selected = +el.getAttribute('data-i'); renderAll(); });
    });
  }

  function inspector(){
    var f = FORM.fields[selected];
    var html = '<div class="hd"><div class="k">'+esc(f.key)+'</div><div class="t">FormDef.fields['+selected+'] · Field</div></div>';

    html += '<div class="iprop"><label title="binds: Field.key">Key</label><input type="text" value="'+esc(f.key)+'" data-binds="Field.key" title="binds: Field.key"></div>';
    html += '<div class="iprop"><label title="binds: Field.label">Label</label><input type="text" value="'+esc(f.label||'')+'" data-binds="Field.label" title="binds: Field.label"></div>';
    html += '<div class="iprop"><label title="binds: Field.type ($enum FIELD_TYPES)">Type</label><select data-binds="Field.type" title="binds: Field.type ($enum FIELD_TYPES)">'+
      TYPES.map(function(t){return '<option'+(t===f.type?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div>';
    html += '<div class="iprop"><div class="irow"><input type="checkbox"'+(f.required?' checked':'')+' id="reqbox" data-binds="Field.required" title="binds: Field.required"><label for="reqbox" style="margin:0;text-transform:none;font-weight:600;color:var(--ink2);font-size:12px">Required</label></div></div>';

    if(f.type==='select' || f.type==='multiselect'){
      html += '<div class="iprop"><label title="binds: Field.options[]">Options</label><textarea data-binds="Field.options" title="binds: Field.options[]">'+esc((f.options||[]).join("\\n"))+'</textarea></div>';
    }
    if(f.$ref){
      html += '<div class="iprop"><label title="binds: Field.$ref">$ref</label><input type="text" value="'+esc(f.$ref)+'" data-binds="Field.$ref" title="binds: Field.$ref"></div>';
    }
    if(f.type==='computed'){
      html += '<div class="iprop"><label title="binds: Field.computed — pure expr over other keys">Computed expression</label><textarea data-binds="Field.computed" title="binds: Field.computed">'+esc(f.computed)+'</textarea>'+
        '<div class="helptext">Pure expression over sibling keys, evaluated read-only at render/print time. Not user-editable in fill mode.</div></div>';
    }
    if(f.type==='repeating_group'){
      html += '<div class="iprop"><label title="binds: Field.fields[] — self-referential Field schema">Row fields</label>'+
        (f.fields||[]).map(function(sf){return '<div class="cond-row"><span class="k" style="font-family:var(--mono)">'+esc(sf.key)+'</span><span style="color:var(--inkMute)">'+sf.type+'</span></div>';}).join('')+
        '<div class="addcond" data-binds="Field.fields[]" title="binds: Field.fields[]">+ add row field</div></div>';
    }

    var cond = f.showWhen || {};
    var condKeys = Object.keys(cond);
    html += '<div class="iprop"><label title="binds: Field.showWhen — flat AND only, proposal §5">Show when</label>';
    if(!condKeys.length){
      html += '<div class="helptext">Always shown. Add a condition below.</div>';
    } else {
      condKeys.forEach(function(k){
        if(k==='role_gte'){
          html += '<div class="cond-row"><select disabled><option>actor role</option></select><span>&gt;=</span><input value="'+esc(cond[k])+'" readonly style="width:70px"></div>';
        } else {
          var m = k.match(/^(.*)_(gt|gte|lt|lte|eq|in)$/);
          html += '<div class="cond-row"><select disabled><option>'+esc(m?m[1]:k)+'</option></select><span>'+esc(m?m[2]:'?')+'</span><input value="'+esc(JSON.stringify(cond[k]))+'" readonly style="width:110px"></div>';
        }
      });
    }
    html += '<div class="addcond" data-binds="Field.showWhen" title="binds: Field.showWhen">+ add condition (AND)</div>'+
      '<div class="helptext">Conditions combine with AND only — no nested OR/branch trees in v1. An unrecognised condition key fails closed: field stays hidden, never forced required.</div></div>';

    document.getElementById('insp').innerHTML = html;
  }

  function renderAll(){ renderList(); renderSheet(); inspector(); }
  renderPalette();
  renderAll();

  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark' ? 'light' : (cur==='light' ? '' : 'dark'));
  });
})();
</script>
</body>
</html>
