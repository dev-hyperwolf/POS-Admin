<!DOCTYPE html>
<html lang="en">
<head>

<title>Verify — Concept C — The Verify Timeline</title>
<style>
/* ============================================================================
   Verify — Concept C — The Verify Timeline
   Static mockup. Tokens copied inline from pos/tokens.jsx (LIGHT/DARK); rail
   and topbar shape copied from Hyperwolf Bounty.html; kit-column timeline dot
   pattern and box-row schema (PRODUCT/SOLD/NEED/CAP/GIVE/REASON, tinted
   shortfall rows) reproduced from the Concept B (Box Cards) keeper. No build
   step, no external scripts or fonts. Every name, batch, quantity and time on
   this screen is EXAMPLE DATA — see the banner below the header.
   ========================================================================= */
:root{
  --fontSans:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --fontMono:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --f-micro:10px; --f-meta:11.5px; --f-body:12.5px; --f-strong:13.5px;
  --f-title:16px; --f-h2:18px; --f-h1:26px;
  --r8:8px; --r10:10px; --r12:12px; --r16:16px; --r999:999px;
  --bg:#F4F2EC; --bg2:#EEEBE2; --surface:#FFFFFF; --surface2:#FAF9F5; --surface3:#F1EFE9;
  --rail:#13130F; --railInk:rgba(255,255,255,.72); --railBright:#FFFFFF;
  --railHover:rgba(255,255,255,.06); --railActive:rgba(255,209,0,.14); --railHair:rgba(255,255,255,.08);
  --ink:#0F0F0C; --ink2:#2A2A26; --inkDim:rgba(15,15,12,.60); --inkMute:rgba(15,15,12,.42); --inkFaint:rgba(15,15,12,.22);
  --hairline:rgba(15,15,12,.08); --hairline2:rgba(15,15,12,.14); --hairline3:rgba(15,15,12,.24);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:#FFF4B8; --accentBorder:#F2C200;
  --accentHover:#F5C900; --accentActive:#E0B800; --accentText:#7A5A00; --highlightSoft:#F1EFE9;
  --good:#1F8A4F; --goodSoft:#E2F2E8;
  --warn:#C07A12; --warnSoft:#FBEFD6; --warnText:#8F560C;
  --bad:#C0392B; --badSoft:#F8E2DF;
  --info:#2C5BB8; --infoSoft:#E3ECFA;
  --neutral:#6E6E66; --neutralSoft:#ECEAE2;
  --field:#FFFFFF; --fieldBorder:rgba(15,15,12,.18);
  --shadowSm:0 1px 0 rgba(15,15,12,.04), 0 1px 2px rgba(15,15,12,.05);
  --shadowMd:0 1px 0 rgba(15,15,12,.04), 0 6px 18px rgba(15,15,12,.07);
  --focusRing:0 0 0 2px #FFFFFF, 0 0 0 4px #2C5BB8;
  --cat-flower:#3F9E72; --cat-preroll:#D45A3C; --cat-vape:#3F73D6; --cat-concentrate:#C2841D; --cat-edible:#E0477C;
}
html[data-theme="dark"]{
  --bg:#0D0D0A; --bg2:#0A0A07; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
  --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
  --railHover:rgba(255,255,255,.05); --railActive:rgba(255,209,0,.14); --railHair:rgba(255,255,255,.07);
  --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40); --inkFaint:rgba(245,243,234,.22);
  --hairline:rgba(245,243,234,.09); --hairline2:rgba(245,243,234,.15); --hairline3:rgba(245,243,234,.26);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:rgba(255,209,0,.15); --accentBorder:rgba(255,209,0,.40);
  --accentHover:#FFDA33; --accentActive:#E8BE00; --accentText:#FFD100; --highlightSoft:rgba(245,243,234,.06);
  --good:#46C07E; --goodSoft:rgba(70,192,126,.15);
  --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15); --warnText:#E0A53A;
  --bad:#E8675B; --badSoft:rgba(232,103,91,.16);
  --info:#6A99EC; --infoSoft:rgba(106,153,236,.16);
  --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08);
  --field:#15150F; --fieldBorder:rgba(245,243,234,.22);
  --shadowSm:0 1px 0 rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.40);
  --shadowMd:0 1px 0 rgba(0,0,0,.30), 0 8px 22px rgba(0,0,0,.45);
  --focusRing:0 0 0 2px #1A1A14, 0 0 0 4px #6A99EC;
  --cat-flower:#4FBE8A; --cat-preroll:#E27158; --cat-vape:#6B93E8; --cat-concentrate:#D69A3E; --cat-edible:#EE6E9C;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0D0D0A; --bg2:#0A0A07; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
    --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
    --railHover:rgba(255,255,255,.05); --railActive:rgba(255,209,0,.14); --railHair:rgba(255,255,255,.07);
    --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40); --inkFaint:rgba(245,243,234,.22);
    --hairline:rgba(245,243,234,.09); --hairline2:rgba(245,243,234,.15); --hairline3:rgba(245,243,234,.26);
    --accentSoft:rgba(255,209,0,.15); --accentBorder:rgba(255,209,0,.40); --accentHover:#FFDA33; --accentActive:#E8BE00; --accentText:#FFD100; --highlightSoft:rgba(245,243,234,.06);
    --good:#46C07E; --goodSoft:rgba(70,192,126,.15);
    --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15); --warnText:#E0A53A;
    --bad:#E8675B; --badSoft:rgba(232,103,91,.16);
    --info:#6A99EC; --infoSoft:rgba(106,153,236,.16);
    --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08);
    --field:#15150F; --fieldBorder:rgba(245,243,234,.22);
    --cat-flower:#4FBE8A; --cat-preroll:#E27158; --cat-vape:#6B93E8; --cat-concentrate:#D69A3E; --cat-edible:#EE6E9C;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--fontSans);-webkit-font-smoothing:antialiased;}
button,select,input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(128,128,120,.32);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible{outline:none;box-shadow:var(--focusRing);position:relative;z-index:1;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

.app{display:flex;min-height:100vh;}
.rail{width:74px;flex:0 0 74px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 8px;gap:2px;position:sticky;top:0;height:100vh;}
.rail-logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:9px;color:var(--accentInk);flex:0 0 auto;}
.rail-item{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px 6px;background:transparent;color:var(--railInk);border:none;border-radius:10px;cursor:pointer;}
.rail-item:hover{background:var(--railHover);}
.rail-item.active{background:var(--railActive);color:var(--railBright);}
.rail-item.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:99px;}
.rail-item .lbl{font-size:10px;font-weight:600;white-space:nowrap;}
.rail-spacer{flex:1;}
.rail-bottom{width:100%;padding-top:6px;border-top:1px solid var(--railHair);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--hairline2);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap;}
.titleblock{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:180px;}
.crumb{font-size:var(--f-meta);color:var(--inkMute);display:flex;align-items:center;gap:5px;}
.h1{font-size:var(--f-h1);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em;}
.clockblock{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:var(--fontMono);}
.clock-now{font-size:var(--f-strong);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.clock-sub{font-size:var(--f-micro);color:var(--inkMute);text-transform:uppercase;letter-spacing:.06em;}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r10);border:1px solid var(--hairline2);background:var(--surface);color:var(--inkDim);cursor:pointer;flex:0 0 auto;}
.iconbtn:hover{background:var(--surface3);color:var(--ink);}

.example-banner{display:flex;align-items:center;gap:10px;background:var(--accentSoft);border:1px solid var(--accentBorder);color:var(--accentText);border-radius:var(--r10);padding:9px 14px;font-size:var(--f-meta);font-weight:600;margin:14px 24px 0;}

.wrap{flex:1;display:flex;min-height:0;overflow:hidden;margin-top:14px;}
.pane-kits{width:320px;flex:0 0 320px;border-right:1px solid var(--hairline2);overflow-y:auto;background:var(--surface2);padding:10px 10px 20px;}
.pane-kits h2{font-size:var(--f-title);margin:6px 6px 8px;}
.region-lbl{font-size:var(--f-meta);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--inkMute);padding:12px 6px 4px;}
.kit-chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px;margin-bottom:7px;border-radius:var(--r12);border:1px solid var(--hairline2);background:var(--surface);cursor:pointer;}
.kit-chip:hover{border-color:var(--hairline3);}
.kit-chip.selected{border-color:var(--accentBorder);box-shadow:0 0 0 2px var(--accentSoft) inset;}
.kit-chip .kc-av{width:34px;height:34px;border-radius:9px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink2);flex:0 0 auto;font-size:var(--f-meta);}
.kit-chip .kc-mid{flex:1;min-width:0;}
.kit-chip .kc-name{font-weight:700;font-size:var(--f-body);}
.kit-chip .kc-route{font-size:var(--f-meta);color:var(--inkMute);}
.kit-chip .kc-stage{font-size:10.5px;color:var(--inkDim);margin-top:2px;}
.dot-red{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:0 0 auto;box-shadow:0 0 0 2px var(--surface);}

.pane-tl{flex:1;min-width:0;overflow-y:auto;padding:4px 26px 60px;}
.kit-banner{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--hairline2);border-radius:var(--r16);padding:14px 18px;box-shadow:var(--shadowSm);flex-wrap:wrap;margin-bottom:18px;}
.kit-banner .kb-name{font-size:var(--f-h2);font-weight:700;}
.kit-banner .kb-route{font-size:var(--f-body);color:var(--inkMute);}
.kit-banner .kb-stat{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap;}
.kb-stat .si .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--inkMute);}
.kb-stat .si .v{font-family:var(--fontMono);font-weight:700;font-size:var(--f-strong);}
.kb-stat .si .v.warn{color:var(--warnText);}

.tl{position:relative;padding-left:6px;}
.tlstep{position:relative;padding:0 0 6px 34px;}
.tlstep::before{content:"";position:absolute;left:9px;top:22px;bottom:-2px;width:2px;background:var(--hairline3);}
.tlstep:last-child::before{display:none;}
.tlstep.done::before{background:var(--good);}
.tlstep .dot{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--hairline3);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--surface);}
.tlstep.done .dot{background:var(--good);border-color:var(--good);}
.tlstep.active .dot{background:var(--accent);border-color:var(--accentBorder);}
.tlstep.discrepancy .dot{background:var(--bad);border-color:var(--bad);}
.tlhead{display:flex;align-items:center;gap:10px;padding:0 0 4px;cursor:pointer;flex-wrap:wrap;}
.tlhead .lbl{font-size:var(--f-strong);font-weight:700;}
.tlstep.pending .tlhead .lbl{color:var(--inkMute);}
.tlhead .when{font-size:var(--f-meta);color:var(--inkMute);font-family:var(--fontMono);}
.tlhead .readpill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;}
.readpill.match{background:var(--goodSoft);color:var(--good);}
.readpill.mismatch{background:var(--badSoft);color:var(--bad);}
.tlhead .chev{margin-left:auto;color:var(--inkMute);font-size:12px;}
.tlbody{padding:6px 0 18px;}
.tlbody.collapsed{display:none;}
.stagenote{font-size:var(--f-body);color:var(--inkDim);margin:0 0 8px;}

table.vtbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;background:var(--surface);border:1px solid var(--hairline2);border-radius:var(--r10);overflow:hidden;}
table.vtbl th{text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--inkMute);padding:6px 8px;border-bottom:1px solid var(--hairline);background:var(--surface2);}
table.vtbl td{padding:7px 8px;border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--ink);}
table.vtbl tr:last-child td{border-bottom:none;}
.vtbl .num{font-family:var(--fontMono);text-align:right;white-space:nowrap;}
.vtbl tr.row-missing{background:var(--badSoft);box-shadow:inset 3px 0 0 var(--bad);}
.vtbl tr.row-extra{background:var(--warnSoft);box-shadow:inset 3px 0 0 var(--warn);}
.vtbl tr.row-wrongbatch{background:var(--badSoft);box-shadow:inset 3px 0 0 var(--bad);}
.vtbl tr.row-wrongbox{background:var(--infoSoft);box-shadow:inset 3px 0 0 var(--info);}
.typetag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.typetag.bad{color:var(--bad);} .typetag.warn{color:var(--warnText);} .typetag.info{color:var(--info);}
.reasoncell{font-size:10.5px;color:var(--inkMute);}
.batchtag{font-family:var(--fontMono);font-size:10px;background:var(--surface3);border-radius:5px;padding:1px 5px;}

.mixedbatch{display:flex;gap:8px;align-items:flex-start;background:var(--badSoft);border:1.5px solid var(--bad);border-radius:var(--r10);padding:9px 11px;margin:8px 0;}
.mixedbatch .mb-icon{color:var(--bad);flex:0 0 auto;margin-top:1px;}
.mixedbatch .mb-title{font-weight:800;font-size:var(--f-meta);color:var(--bad);text-transform:uppercase;letter-spacing:.03em;}
.mixedbatch .mb-body{font-size:var(--f-body);color:var(--ink);margin-top:2px;}
.mixedbatch .mb-body b{font-family:var(--fontMono);}

.closeout{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
.closeout .cc{flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--hairline2);border-radius:var(--r12);padding:12px 14px;}
.closeout .cc h4{margin:0 0 8px;font-size:var(--f-meta);text-transform:uppercase;letter-spacing:.04em;color:var(--inkMute);}
.closeout .cc-row{display:flex;justify-content:space-between;font-size:var(--f-body);padding:3px 0;}
.closeout .cc-row b{font-family:var(--fontMono);}

.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.checklist li{display:flex;align-items:center;gap:8px;font-size:var(--f-body);}
.checklist svg{color:var(--good);flex:0 0 auto;}

.footerline{text-align:center;font-size:var(--f-meta);color:var(--inkFaint);padding:16px 0 30px;}

@media (max-width: 980px){
  .rail{width:60px;flex-basis:60px;}
  .rail-item .lbl{display:none;}
  .pane-kits{width:230px;flex-basis:230px;}
  .kb-stat{gap:14px;}
}
</style>
</head>

<div class="app">
  <aside class="rail">
    <div class="rail-logo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l8-3 8 3v9l-8 6-8-6z"/></svg></div>

<script>
(function(){
"use strict";
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

/* ---------- theme ---------- */
var root = document.documentElement;
try{ var saved = localStorage.getItem('hw-verifytl-theme'); if(saved) root.setAttribute('data-theme', saved); }catch(e){}
$('#themeToggle').addEventListener('click', function(){
  var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  var next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('hw-verifytl-theme', next); }catch(e){}
});
function tick(){
  var d=new Date(), h=d.getHours()%12; if(h===0)h=12;
  $('#clockNow').textContent = h+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()<12?'AM':'PM')+' PT';
}
tick(); setInterval(tick,30000);

/* ---------- the eight stages ---------- */
var STAGES = ['Built','Pack-verified','Dispatched','Refilled','Pack-verified','Returned','Return-verified','Closed'];

/* ---------- example data ---------- */
var KITS = [
  { id:'mr3', region:'West LA', driver:'Marcus R.', route:'Route 3', units:142, boxes:6, stageIdx:4, discrepancies:1,
    stages:[

var selectedKitId = 'mr3';
var openStage = {};

function stageStatus(kit, i){ return i < kit.stageIdx ? 'done' : (i === kit.stageIdx ? 'active' : 'pending'); }

/* ---------- render: kit list ---------- */
function renderKits(){
  var host = $('#paneKits');
  var regions = {}; KITS.forEach(function(k){ (regions[k.region]=regions[k.region]||[]).push(k); });
  var html = '<h2>Kits — today</h2>';
  Object.keys(regions).forEach(function(r){
    html += '<div class="region-lbl">'+r+'</div>';
    regions[r].forEach(function(k){
      var stageLbl = k.stageIdx>=STAGES.length ? 'Closed' : STAGES[k.stageIdx];
      html += '<button class="kit-chip'+(k.id===selectedKitId?' selected':'')+'" data-kit="'+k.id+'">'
        + '<span class="kc-av">'+k.driver.split(' ').map(function(w){return w[0];}).join('')+'</span>'
        + '<span class="kc-mid"><span class="kc-name">'+k.driver+'</span><span class="kc-route">'+k.route+'</span>'
        + '<div class="kc-stage">'+(k.stageIdx>=STAGES.length?'Closed':'At: '+stageLbl)+'</div></span>'
        + (k.discrepancies>0 ? '<span class="dot-red" title="'+k.discrepancies+' open discrepancy"></span>' : '')
        + '</button>';
    });
  });
  host.innerHTML = html;
  $$('.kit-chip', host).forEach(function(el){ el.addEventListener('click', function(){ selectedKitId = el.getAttribute('data-kit'); openStage = {}; renderKits(); renderTimeline(); }); });
}

function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'; }); }

/* ---------- render: box list (Built / Refilled) using the keeper row schema ---------- */
function renderBoxes(boxes){
  var rows = boxes.map(function(b){
    var mixedRow = b.mixed ? '<tr><td colspan="4" style="padding:0;border:none;"><div class="mixedbatch"><span class="mb-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><circle cx="12" cy="16.5" r=".6" fill="currentColor" stroke="none"/><path d="M10.3 3.9 1.8 18.5A1.6 1.6 0 003.2 21h17.6a1.6 1.6 0 001.4-2.5L13.7 3.9a1.6 1.6 0 00-2.8 0z"/></svg></span><div><div class="mb-title">Mixed batch — loud on the pick slip too</div><div class="mb-body"><b>'+b.mixed.a+'</b> · THC '+b.mixed.athc+' · packaged '+b.mixed.adate+'  vs.  <b>'+b.mixed.b+'</b> · THC '+b.mixed.bthc+' · packaged '+b.mixed.bdate+'</div></div></div></td></tr>' : '';
    return '<tr><td>'+esc(b.name)+'</td><td>'+esc(b.product)+'</td><td><span class="batchtag">'+esc(b.batch)+'</span></td><td class="num">'+b.qty+'</td></tr>'+mixedRow;
  }).join('');
  return '<table class="vtbl"><thead><tr><th>Box</th><th>Product</th><th>Batch</th><th>Qty</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ---------- render: scan / discrepancy table (Pack-verified / Returned) ---------- */
function renderScanRows(rows){
  var trs = rows.map(function(r){
    var cls = 'row-'+r.type;
    var typeLbl = {missing:'Missing',extra:'Extra',wrongbatch:'Wrong batch',wrongbox:'Wrong box'}[r.type];
    var typeCls = (r.type==='extra')?'warn':(r.type==='wrongbox'?'info':'bad');
    return '<tr class="'+cls+'"><td>'+esc(r.product)+'</td><td>'+esc(r.planned)+'</td><td>'+esc(r.read)+'</td><td><span class="typetag '+typeCls+'">'+typeLbl+'</span></td><td class="reasoncell">'+esc(r.reason)+'</td></tr>';
  }).join('');
  return '<table class="vtbl"><thead><tr><th>Product</th><th>Planned / batch</th><th>Read</th><th>Type</th><th>Reason</th></tr></thead><tbody>'+trs+'</tbody></table>';
}

/* ---------- render: return-verify block ---------- */
function renderReturnVerify(rv, closeout){
  var rowsHtml = renderScanRows(rv.rows);
  var closeoutHtml = closeout ? '<div class="closeout"><div class="cc"><h4>Return-verify math</h4>'
    + '<div class="cc-row"><span>Expected</span><b>'+esc(rv.expected)+'</b></div>'
    + '<div class="cc-row"><span>Read + sold</span><b>'+esc(rv.read)+'</b></div></div>'
    + '<div class="cc"><h4>Driver closeout</h4><div class="cc-row"><span>Cash</span><b>'+esc(closeout.cash)+'</b></div><div class="cc-row" style="display:block;"><span>'+esc(closeout.notes)+'</span></div></div></div>' : '';
  return rowsHtml + closeoutHtml;
}

/* ---------- render: one stage card ---------- */
function renderStage(kit, i, stage){
  var status = stageStatus(kit, i);
  var hasMismatch = stage && stage.read === 'mismatch';
  var cls = 'tlstep '+status+(hasMismatch?' discrepancy':'');
  var dotIcon = status==='done' ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>' : (hasMismatch ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' : '');
  var when = stage ? stage.time+' · '+stage.who : '—';
  var readpill = stage && stage.read ? '<span class="readpill '+(stage.read==='match'?'match':'mismatch')+'">'+(stage.read==='match'?'Read: matched':'Read: discrepancy')+'</span>' : '';
  var key = kit.id+'-'+i;
  var isOpen = openStage[key] !== undefined ? openStage[key] : (status !== 'pending');
  var body = '';
  if (stage){
    if (stage.note) body += '<p class="stagenote">'+esc(stage.note)+'</p>';
    if (stage.boxes) body += renderBoxes(stage.boxes);
    if (stage.rows && !stage.returnverify) body += renderScanRows(stage.rows);
    if (stage.returnverify) body += renderReturnVerify(stage.returnverify, stage.closeout);
    if (stage.closeCheck) body += '<ul class="checklist">'+stage.closeCheck.map(function(c){ return '<li><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'+esc(c)+'</li>'; }).join('')+'</ul>';
  } else if (status==='pending'){
    body = '<p class="stagenote">Not reached yet.</p>';
  }
  return '<div class="'+cls+'"><span class="dot">'+dotIcon+'</span>'
    + '<div class="tlhead" data-toggle="'+key+'"><span class="lbl">'+STAGES[i]+'</span><span class="when">'+when+'</span>'+readpill+'<span class="chev">'+(isOpen?'▾':'▸')+'</span></div>'
    + '<div class="tlbody'+(isOpen?'':' collapsed')+'" data-body="'+key+'">'+body+'</div>'
    + '</div>';
}

function renderTimeline(){
  var kit = KITS.find(function(k){ return k.id===selectedKitId; });
  var host = $('#paneTl');
  var stageLbl = kit.stageIdx>=STAGES.length ? 'Closed' : STAGES[kit.stageIdx];
  var html = '<div class="kit-banner"><div><div class="kb-name">'+esc(kit.driver)+' · '+esc(kit.route)+'</div><div class="kb-route">'+kit.region+' — '+kit.boxes+' boxes, '+kit.units+' units built</div></div>'
    + '<div class="kb-stat">'
    + '<div class="si"><div class="k">Currently at</div><div class="v">'+stageLbl+'</div></div>'
    + '<div class="si"><div class="k">Open discrepancies</div><div class="v'+(kit.discrepancies>0?' warn':'')+'">'+kit.discrepancies+'</div></div>'
    + '</div></div>'
    + '<div class="tl">' + STAGES.map(function(_,i){ return renderStage(kit, i, kit.stages[i]); }).join('') + '</div>'
    + '<div class="footerline">Verify — Concept C of 4 — The Verify Timeline</div>';
  host.innerHTML = html;
  $$('.tlhead', host).forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-toggle');
      var body = host.querySelector('[data-body="'+key+'"]');
      var nowOpen = body.classList.contains('collapsed');
      openStage[key] = nowOpen;
      body.classList.toggle('collapsed', !nowOpen);
      el.querySelector('.chev').textContent = nowOpen ? '▾' : '▸';
    });
  });
}

renderKits();
renderTimeline();
})();
</script>
