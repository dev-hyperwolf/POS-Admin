<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verify — Concept C — The Verify Timeline</title>
<style>
/* ============================================================================
   Verify — Concept C — The Verify Timeline (Round 2 revision)
   Static mockup. Tokens copied inline from pos/tokens.jsx (LIGHT/DARK); rail
   and topbar shape copied from Hyperwolf Bounty.html; kit-column timeline dot
   pattern and box-row schema reproduced from the Concept B (Box Cards) keeper.
   Round 2 rules: RFID first — every read is an RFID read vs expected per
   batch; typed steppers appear only in a flagged hand-count exception row for
   a dead tag or untagged category. Batch level everywhere — every product
   line is a batch line: name on top, monospace batch chip below (number ·
   THC · pkg · exp · days on hand · Metrc). A SKU with two batches on hand is
   two batch rows with the LOUD mixed-batch flag. No build step, no external
   scripts or fonts. Every name, batch, quantity and time is EXAMPLE DATA.
   ========================================================================= */
:root{
  --fontSans:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --fontMono:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --f-micro:10px; --f-meta:11.5px; --f-body:12.5px; --f-strong:13.5px;
  --f-title:16px; --f-h2:18px; --f-h1:26px;
  --r8:8px; --r10:10px; --r12:12px; --r16:16px; --r999:999px;
  --bg:#F4F2EC; --bg2:#EEEBE2; --surface:#FFFFFF; --surface2:#FAF9F5; --surface3:#F1EFE9;
  --rail:#13130F; --railInk:rgba(255,255,255,.72); --railBright:#FFFFFF;
  --railHover:rgba(255,255,255,.06); --railActive:rgba(255,209,0,.14); --railHair:rgba(255,255,255,.08);
  --ink:#0F0F0C; --ink2:#2A2A26; --inkDim:rgba(15,15,12,.60); --inkMute:rgba(15,15,12,.42); --inkFaint:rgba(15,15,12,.22);
  --hairline:rgba(15,15,12,.08); --hairline2:rgba(15,15,12,.14); --hairline3:rgba(15,15,12,.24);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:#FFF4B8; --accentBorder:#F2C200;
  --accentHover:#F5C900; --accentActive:#E0B800; --accentText:#7A5A00; --highlightSoft:#F1EFE9;
  --good:#1F8A4F; --goodSoft:#E2F2E8;
  --warn:#C07A12; --warnSoft:#FBEFD6; --warnText:#8F560C;
  --bad:#C0392B; --badSoft:#F8E2DF;
  --info:#2C5BB8; --infoSoft:#E3ECFA;
  --neutral:#6E6E66; --neutralSoft:#ECEAE2;
  --field:#FFFFFF; --fieldBorder:rgba(15,15,12,.18);
  --shadowSm:0 1px 0 rgba(15,15,12,.04), 0 1px 2px rgba(15,15,12,.05);
  --shadowMd:0 1px 0 rgba(15,15,12,.04), 0 6px 18px rgba(15,15,12,.07);
  --focusRing:0 0 0 2px #FFFFFF, 0 0 0 4px #2C5BB8;
  --cat-flower:#3F9E72; --cat-preroll:#D45A3C; --cat-vape:#3F73D6; --cat-concentrate:#C2841D; --cat-edible:#E0477C;
}
html[data-theme="dark"]{
  --bg:#0D0D0A; --bg2:#0A0A07; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
  --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
  --railHover:rgba(255,255,255,.05); --railActive:rgba(255,209,0,.14); --railHair:rgba(255,255,255,.07);
  --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40); --inkFaint:rgba(245,243,234,.22);
  --hairline:rgba(245,243,234,.09); --hairline2:rgba(245,243,234,.15); --hairline3:rgba(245,243,234,.26);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:rgba(255,209,0,.15); --accentBorder:rgba(255,209,0,.40);
  --accentHover:#FFDA33; --accentActive:#E8BE00; --accentText:#FFD100; --highlightSoft:rgba(245,243,234,.06);
  --good:#46C07E; --goodSoft:rgba(70,192,126,.15);
  --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15); --warnText:#E0A53A;
  --bad:#E8675B; --badSoft:rgba(232,103,91,.16);
  --info:#6A99EC; --infoSoft:rgba(106,153,236,.16);
  --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08);
  --field:#15150F; --fieldBorder:rgba(245,243,234,.22);
  --shadowSm:0 1px 0 rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.40);
  --shadowMd:0 1px 0 rgba(0,0,0,.30), 0 8px 22px rgba(0,0,0,.45);
  --focusRing:0 0 0 2px #1A1A14, 0 0 0 4px #6A99EC;
  --cat-flower:#4FBE8A; --cat-preroll:#E27158; --cat-vape:#6B93E8; --cat-concentrate:#D69A3E; --cat-edible:#EE6E9C;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0D0D0A; --bg2:#0A0A07; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
    --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
    --railHover:rgba(255,255,255,.05); --railActive:rgba(255,209,0,.14); --railHair:rgba(255,255,255,.07);
    --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40); --inkFaint:rgba(245,243,234,.22);
    --hairline:rgba(245,243,234,.09); --hairline2:rgba(245,243,234,.15); --hairline3:rgba(245,243,234,.26);
    --accentSoft:rgba(255,209,0,.15); --accentBorder:rgba(255,209,0,.40); --accentHover:#FFDA33; --accentActive:#E8BE00; --accentText:#FFD100; --highlightSoft:rgba(245,243,234,.06);
    --good:#46C07E; --goodSoft:rgba(70,192,126,.15);
    --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15); --warnText:#E0A53A;
    --bad:#E8675B; --badSoft:rgba(232,103,91,.16);
    --info:#6A99EC; --infoSoft:rgba(106,153,236,.16);
    --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08);
    --field:#15150F; --fieldBorder:rgba(245,243,234,.22);
    --cat-flower:#4FBE8A; --cat-preroll:#E27158; --cat-vape:#6B93E8; --cat-concentrate:#D69A3E; --cat-edible:#EE6E9C;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--fontSans);-webkit-font-smoothing:antialiased;}
button,select,input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(128,128,120,.32);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible{outline:none;box-shadow:var(--focusRing);position:relative;z-index:1;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

.app{display:flex;min-height:100vh;}
.rail{width:74px;flex:0 0 74px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 8px;gap:2px;position:sticky;top:0;height:100vh;}
.rail-logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:9px;color:var(--accentInk);flex:0 0 auto;}
.rail-item{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px 6px;background:transparent;color:var(--railInk);border:none;border-radius:10px;cursor:pointer;}
.rail-item:hover{background:var(--railHover);}
.rail-item.active{background:var(--railActive);color:var(--railBright);}
.rail-item.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:99px;}
.rail-item .lbl{font-size:10px;font-weight:600;white-space:nowrap;}
.rail-spacer{flex:1;}
.rail-bottom{width:100%;padding-top:6px;border-top:1px solid var(--railHair);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--hairline2);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap;}
.titleblock{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:180px;}
.crumb{font-size:var(--f-meta);color:var(--inkMute);display:flex;align-items:center;gap:5px;}
.h1{font-size:var(--f-h1);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em;}
.clockblock{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:var(--fontMono);}
.clock-now{font-size:var(--f-strong);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.clock-sub{font-size:var(--f-micro);color:var(--inkMute);text-transform:uppercase;letter-spacing:.06em;}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r10);border:1px solid var(--hairline2);background:var(--surface);color:var(--inkDim);cursor:pointer;flex:0 0 auto;}
.iconbtn:hover{background:var(--surface3);color:var(--ink);}

.example-banner{display:flex;align-items:center;gap:10px;background:var(--accentSoft);border:1px solid var(--accentBorder);color:var(--accentText);border-radius:var(--r10);padding:9px 14px;font-size:var(--f-meta);font-weight:600;margin:14px 24px 0;}

.wrap{flex:1;display:flex;min-height:0;overflow:hidden;margin-top:14px;}
.pane-kits{width:320px;flex:0 0 320px;border-right:1px solid var(--hairline2);overflow-y:auto;background:var(--surface2);padding:10px 10px 20px;}
.pane-kits h2{font-size:var(--f-title);margin:6px 6px 8px;}
.region-lbl{font-size:var(--f-meta);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--inkMute);padding:12px 6px 4px;}
.kit-chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px;margin-bottom:7px;border-radius:var(--r12);border:1px solid var(--hairline2);background:var(--surface);cursor:pointer;}
.kit-chip:hover{border-color:var(--hairline3);}
.kit-chip.selected{border-color:var(--accentBorder);box-shadow:0 0 0 2px var(--accentSoft) inset;}
.kit-chip .kc-av{width:34px;height:34px;border-radius:9px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink2);flex:0 0 auto;font-size:var(--f-meta);}
.kit-chip .kc-mid{flex:1;min-width:0;}
.kit-chip .kc-name{font-weight:700;font-size:var(--f-body);}
.kit-chip .kc-route{font-size:var(--f-meta);color:var(--inkMute);}
.kit-chip .kc-stage{font-size:10.5px;color:var(--inkDim);margin-top:2px;}
.dot-red{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:0 0 auto;box-shadow:0 0 0 2px var(--surface);}

.pane-tl{flex:1;min-width:0;overflow-y:auto;padding:4px 26px 60px;}
.kit-banner{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--hairline2);border-radius:var(--r16);padding:14px 18px;box-shadow:var(--shadowSm);flex-wrap:wrap;margin-bottom:18px;}
.kit-banner .kb-name{font-size:var(--f-h2);font-weight:700;}
.kit-banner .kb-route{font-size:var(--f-body);color:var(--inkMute);}
.kit-banner .kb-stat{margin-left:auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.kb-stat .si .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--inkMute);}
.kb-stat .si .v{font-family:var(--fontMono);font-weight:700;font-size:var(--f-strong);}
.kb-stat .si .v.warn{color:var(--warnText);}
.qrclose{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--hairline2);background:var(--surface);cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink2);}
.qrclose:hover{background:var(--surface3);}
.qrglyph{width:16px;height:16px;flex:0 0 auto;background:repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px);background-blend-mode:multiply;}

.tl{position:relative;padding-left:6px;}
.tlstep{position:relative;padding:0 0 6px 34px;}
.tlstep::before{content:"";position:absolute;left:9px;top:22px;bottom:-2px;width:2px;background:var(--hairline3);}
.tlstep:last-child::before{display:none;}
.tlstep.done::before{background:var(--good);}
.tlstep .dot{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--hairline3);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--surface);}
.tlstep.done .dot{background:var(--good);border-color:var(--good);}
.tlstep.active .dot{background:var(--accent);border-color:var(--accentBorder);}
.tlstep.discrepancy .dot{background:var(--bad);border-color:var(--bad);}
.tlhead{display:flex;align-items:center;gap:10px;padding:0 0 4px;cursor:pointer;flex-wrap:wrap;}
.tlhead .lbl{font-size:var(--f-strong);font-weight:700;}
.tlstep.pending .tlhead .lbl{color:var(--inkMute);}
.tlhead .when{font-size:var(--f-meta);color:var(--inkMute);font-family:var(--fontMono);}
.tlhead .readpill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;}
.readpill.match{background:var(--goodSoft);color:var(--good);}
.readpill.mismatch{background:var(--badSoft);color:var(--bad);}
.tlhead .chev{margin-left:auto;color:var(--inkMute);font-size:12px;}
.tlbody{padding:6px 0 18px;}
.tlbody.collapsed{display:none;}
.stagenote{font-size:var(--f-body);color:var(--inkDim);margin:0 0 8px;}

table.vtbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;background:var(--surface);border:1px solid var(--hairline2);border-radius:var(--r10);overflow:hidden;margin-bottom:8px;}
table.vtbl th{text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--inkMute);padding:6px 8px;border-bottom:1px solid var(--hairline);background:var(--surface2);}
table.vtbl td{padding:7px 8px;border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--ink);}
table.vtbl tr:last-child td{border-bottom:none;}
.vtbl .num{font-family:var(--fontMono);text-align:right;white-space:nowrap;}
.vtbl tr.row-missing{background:var(--badSoft);box-shadow:inset 3px 0 0 var(--bad);}
.vtbl tr.row-extra{background:var(--warnSoft);box-shadow:inset 3px 0 0 var(--warn);}
.vtbl tr.row-wrongbatch{background:var(--badSoft);box-shadow:inset 3px 0 0 var(--bad);}
.vtbl tr.row-wrongbox{background:var(--infoSoft);box-shadow:inset 3px 0 0 var(--info);}
.vtbl tr.row-match{background:var(--surface);}
.vtbl tr.row-hand{background:var(--warnSoft);box-shadow:inset 3px 0 0 var(--warn);}
.typetag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.typetag.bad{color:var(--bad);} .typetag.warn{color:var(--warnText);} .typetag.info{color:var(--info);} .typetag.good{color:var(--good);}
.reasoncell{font-size:10.5px;color:var(--inkMute);max-width:220px;}
.lineprod{font-weight:700;font-size:var(--f-body);color:var(--ink);}
.batchchip{font-family:var(--fontMono);font-size:9.8px;color:var(--inkMute);margin-top:2px;line-height:1.4;letter-spacing:-.01em;}
.methodtag{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.methodtag.rfid{background:var(--infoSoft);color:var(--info);}
.methodtag.hand{background:var(--warnSoft);color:var(--warnText);}
.stepper{display:inline-flex;align-items:center;gap:6px;}
.stepbtn{width:22px;height:22px;border-radius:6px;border:1px solid var(--hairline3);background:var(--surface);cursor:pointer;font-weight:800;font-size:13px;line-height:1;color:var(--ink);}
.stepbtn:hover{background:var(--surface3);}
.stepval{font-family:var(--fontMono);font-weight:700;min-width:18px;display:inline-block;text-align:center;}

.mixedbatch{display:flex;gap:8px;align-items:flex-start;background:var(--badSoft);border:1.5px solid var(--bad);border-radius:var(--r10);padding:9px 11px;margin:2px 0 8px;}
.mixedbatch .mb-icon{color:var(--bad);flex:0 0 auto;margin-top:1px;}
.mixedbatch .mb-title{font-weight:800;font-size:var(--f-meta);color:var(--bad);text-transform:uppercase;letter-spacing:.03em;}
.mixedbatch .mb-body{font-size:var(--f-body);color:var(--ink);margin-top:2px;font-family:var(--fontMono);font-size:10.5px;}

.closeout{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
.closeout .cc{flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--hairline2);border-radius:var(--r12);padding:12px 14px;}
.closeout .cc h4{margin:0 0 8px;font-size:var(--f-meta);text-transform:uppercase;letter-spacing:.04em;color:var(--inkMute);}
.closeout .cc-row{display:flex;justify-content:space-between;font-size:var(--f-body);padding:3px 0;}
.closeout .cc-row b{font-family:var(--fontMono);}

.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.checklist li{display:flex;align-items:center;gap:8px;font-size:var(--f-body);}
.checklist svg{color:var(--good);flex:0 0 auto;}

.footerline{text-align:center;font-size:var(--f-meta);color:var(--inkFaint);padding:16px 0 30px;}
.toast{position:fixed;right:18px;bottom:20px;background:var(--surface);border:1px solid var(--hairline2);border-left:3px solid var(--good);border-radius:var(--r10);box-shadow:var(--shadowMd);padding:11px 14px;font-size:var(--f-body);z-index:100;max-width:340px;}

@media (max-width: 980px){
  .rail{width:60px;flex-basis:60px;}
  .rail-item .lbl{display:none;}
  .pane-kits{width:230px;flex-basis:230px;}
  .kb-stat{gap:14px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-logo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l8-3 8 3v9l-8 6-8-6z"/></svg></div>
    <button class="rail-item" title="Home"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg><span class="lbl">Home</span></button>
    <button class="rail-item" title="Kit templates"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="14" rx="1"/></svg><span class="lbl">Templates</span></button>
    <button class="rail-item active" title="Distribution"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><span class="lbl">Distribution</span></button>
    <button class="rail-item" title="Driver kits"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="15" height="10" rx="1.5"/><path d="M16 10h3l3 3v4h-6z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></svg><span class="lbl">Driver Kits</span></button>
    <div class="rail-spacer"></div>
    <div class="rail-bottom"><button class="rail-item" title="Settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82"/></svg><span class="lbl">Settings</span></button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="titleblock">
        <div class="crumb"><span>Distribution</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span>Verify · Concept C</span></div>
        <h1 class="h1">The Verify Timeline</h1>
      </div>
      <div class="clockblock">
        <div class="clock-now" id="clockNow">2:14 PM PT</div>
        <div class="clock-sub">Business day: Thu Sep 10, 2026 · rolls at 12:00 AM PT</div>
      </div>
      <button class="iconbtn" id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6"/></svg>
      </button>
    </header>

    <div class="example-banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><circle cx="12" cy="16.5" r=".6" fill="currentColor" stroke="none"/><path d="M10.3 3.9 1.8 18.5A1.6 1.6 0 003.2 21h17.6a1.6 1.6 0 001.4-2.5L13.7 3.9a1.6 1.6 0 00-2.8 0z"/></svg>
      Design mockup — every driver, product, batch number and timestamp on this screen is example data, not a live kit.</div>

    <div class="wrap">
      <section class="pane-kits" id="paneKits"><h2>Kits — today</h2></section>
      <section class="pane-tl" id="paneTl"></section>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

/* ---------- theme ---------- */
var root = document.documentElement;
try{ var saved = localStorage.getItem('hw-verifytl-theme'); if(saved) root.setAttribute('data-theme', saved); }catch(e){}
$('#themeToggle').addEventListener('click', function(){
  var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  var next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('hw-verifytl-theme', next); }catch(e){}
});
function tick(){
  var d=new Date(), h=d.getHours()%12; if(h===0)h=12;
  $('#clockNow').textContent = h+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()<12?'AM':'PM')+' PT';
}
tick(); setInterval(tick,30000);
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3600);
}

/* ---------- the eight stages ---------- */
var STAGES = ['Built','Pack-verified','Dispatched','Refilled','Pack-verified','Returned','Return-verified','Closed'];

/* ---------- batch registry — batch is the unit, SKU is only a label ---------- */
var BX = {
  A:{num:'#HW-2405-14',thc:'22.6%',pkg:'Jul 30',exp:'Jan 26',days:64,metrc:'1A40…2E9'},
  B:{num:'#HW-2409-01',thc:'24.1%',pkg:'Aug 28',exp:'Feb 24',days:42,metrc:'1A40…7F3'},
  C:{num:'#HW-2411-07',thc:'31.6%',pkg:'Sep 6',exp:'Mar 5',days:4,metrc:'1A40…9D1'},
  D:{num:'#HW-2403-22',thc:'82.4%',pkg:'Jul 2',exp:'Jun 30',days:68,metrc:'1A40…1E5'},
  E:{num:'#HW-2404-11',thc:'19.8%',pkg:'Jul 25',exp:'Jan 21',days:70,metrc:'1A40…4B6'},
  F:{num:'#HW-2401-09',thc:'74.2%',pkg:'Jul 1',exp:'Jun 28',days:71,metrc:'1A40…5C2'},
  G:{num:'#HW-2406-03',thc:'—',pkg:'Aug 1',exp:'Jan 29',days:40,metrc:'1A40…6A7'},
  H:{num:'#HW-2410-02',thc:'27.3%',pkg:'Sep 1',exp:'Mar 1',days:9,metrc:'1A40…8B3'},
  I:{num:'#HW-2407-19',thc:'—',pkg:'Aug 12',exp:'Feb 9',days:29,metrc:'1A40…3F0'},
  J:{num:'#HW-2408-15',thc:'23.0%',pkg:'Aug 20',exp:'Feb 17',days:21,metrc:'1A40…2C4'}
};

/* ---------- example data ---------- */
var KITS = [
  { id:'mr3', region:'West LA', driver:'Marcus R.', route:'Route 3', units:142, boxes:6, stageIdx:4, discrepancies:1,
    stages:[
      { time:'5:12 AM', who:'System', lines:[
          {box:'Flower Box 1', product:'Sunset OG 3.5g', entries:[{batch:BX.A, qty:20}]},
          {box:'Flower Box 1', product:'GMO 7g', entries:[{batch:BX.B, qty:6}]},
          {box:'Vape Box 1', product:'Live Resin Cart 1g', entries:[{batch:BX.D, qty:16}]}
        ]},
      { time:'5:34 AM', who:'Warehouse — RFID handheld #2', read:'match', note:'RFID scan read 142 of 142 planned units. Every tag matched its box and batch — read vs expected shown per batch below.', rows:[
          {product:'Sunset OG 3.5g', batch:BX.A, expected:20, read:20, type:'match', method:'rfid', reason:'—'},
          {product:'GMO 7g', batch:BX.B, expected:6, read:6, type:'match', method:'rfid', reason:'—'},
          {product:'Live Resin Cart 1g', batch:BX.D, expected:16, read:16, type:'match', method:'rfid', reason:'—'}
        ]},
      { time:'6:05 AM', who:'System' },
      { time:'11:40 AM', who:'System', lines:[
          {box:'Flower Box 1', product:'GMO 7g', entries:[{batch:BX.B, qty:3},{batch:BX.C, qty:4}]}
        ], note:'New arrival pushed in: 4 × GMO 7g on batch #HW-2411-07 — the older #HW-2409-01 line still has 3 on hand, so this box line now spans two batches (oldest first, always).' },
      { time:'11:52 AM', who:'Warehouse — RFID handheld #1', read:'mismatch', rows:[
          {product:'GMO 7g', batch:BX.B, expected:3, read:2, type:'wrongbatch', method:'rfid', reason:'1 of 3 units on the older batch actually read from the newer batch — see mixed-batch flag above.'},
          {product:'GMO 7g', batch:BX.C, expected:4, read:5, type:'wrongbatch', method:'rfid', reason:'Newer batch overrepresented by 1 unit vs plan. Both batches present and LOUD — nothing missing overall, 7 read / 7 expected.'}
        ] }
    ]},
  { id:'dk1', region:'West LA', driver:'Dana K.', route:'Route 1', units:96, boxes:5, stageIdx:7, discrepancies:1,
    stages:[
      { time:'5:09 AM', who:'System', lines:[
          {box:'Flower Box 1', product:'Pineapple Express 3.5g', entries:[{batch:BX.E, qty:14}]},
          {box:'Concentrate Bin 1', product:'Rosin 1g', entries:[{batch:BX.F, qty:6}]},
          {box:'Pre-Roll Box 1', product:'Indica 5-pack', entries:[{batch:BX.G, qty:8}]}
        ]},
      { time:'5:31 AM', who:'Warehouse — RFID handheld #2', read:'match', note:'RFID scan read the Flower and Concentrate lines clean. The Pre-Roll batch carries a dead tag on this case — hand-counted and flagged, not skipped.', rows:[
          {product:'Pineapple Express 3.5g', batch:BX.E, expected:14, read:14, type:'match', method:'rfid', reason:'—'},
          {product:'Rosin 1g', batch:BX.F, expected:6, read:6, type:'match', method:'rfid', reason:'—'},
          {product:'Indica 5-pack', batch:BX.G, expected:8, read:8, type:'match', method:'hand', reason:'Dead tag on this case — RFID unreadable, hand-counted and flagged for review.', id:'dk1-pv1-preroll'}
        ]},
      { time:'6:02 AM', who:'System' },
      { time:'12:15 PM', who:'System', note:'No new arrivals or shortfalls this refill — need fully covered from existing stock. Nothing to read.' },
      { time:'12:24 PM', who:'Warehouse — RFID handheld #1', read:'match', note:'No refill units this cycle — no batch reads recorded.' },
      { time:'4:48 PM', who:'Dana K.', read:'mismatch', rows:[
          {product:'Rosin 1g', batch:BX.F, expected:6, read:5, type:'missing', method:'rfid', reason:'1 tag not read at the door — 2 ASAP + 1 scheduled sale logged in Blaze; reconciled at return-verify below.'}
        ], note:'93 of 96 dispatched tags read back at the door. The Pineapple Express and Indica lines both matched — only the Rosin batch below carries a gap.' },
      { time:'4:55 PM', who:'LP — Priya S.', read:'mismatch', returnverify:{expected:'96 − 3 sold + 4 refilled = 97', read:'96 read + 3 sold = 99 accounted, 1 gap', rows:[
          {product:'Rosin 1g', batch:BX.F, expected:1, read:0, type:'missing', method:'rfid', reason:'Not returned, not in Blaze sales — held as a discrepancy pending Dana confirmation. Nothing adjusts stock until a manager approves.'}
        ]}, closeout:{cash:'$1,284.00 — matches manifest', notes:'Driver reports no known loss; discrepancy opened for LP.'} },
      { time:'5:20 PM', who:'Manager — J. Ferris', closeCheck:['95 of 96 tags sold or returned, all read by RFID except one dead-tagged case that was hand-counted and flagged','1 tag open as a discrepancy — case DK1-0910-A, not blocking close','Day close approved with 1 open case carried to tomorrow'] }
    ]},
  { id:'ps5', region:'West LA', driver:'Priya S.', route:'Route 5', units:0, boxes:4, stageIdx:0, discrepancies:0,
    stages:[
      { time:'5:52 AM', who:'System', lines:[
          {box:'Flower Box 1', product:'Ice Cream Cake 3.5g', entries:[{batch:BX.H, qty:12}]},
          {box:'Pre-Roll Box 1', product:'Sativa PR 5-pack', entries:[{batch:BX.I, qty:10}]}
        ]}
    ]},
  { id:'tg2', region:'Inland Empire', driver:'Tomás G.', route:'Route 2', units:64, boxes:3, stageIdx:5, discrepancies:0,
    stages:[
      { time:'5:02 AM', who:'System', lines:[{box:'Flower Box 1', product:'GMO 3.5g', entries:[{batch:BX.J, qty:16}]}]},
      { time:'5:20 AM', who:'Warehouse — RFID handheld #1', read:'match', rows:[
          {product:'GMO 3.5g', batch:BX.J, expected:16, read:16, type:'match', method:'rfid', reason:'—'}
        ]},
      { time:'5:41 AM', who:'System' },
      { time:'8:15 AM', who:'Tomás G.', note:'No refill requested — kit ran full through the morning route. Nothing to read.' },
      { time:'8:16 AM', who:'System', note:'No pack-verify needed — no refill units to check.' },
      { time:'1:48 PM', who:'Tomás G.', read:'match', rows:[
          {product:'GMO 3.5g', batch:BX.J, expected:58, read:58, type:'match', method:'rfid', reason:'—'}
        ], note:'RFID read at return matches dispatched minus sold exactly.' }
    ]}
];

var selectedKitId = 'mr3';
var openStage = {};
var handCounts = {};

function stageStatus(kit, i){ return i < kit.stageIdx ? 'done' : (i === kit.stageIdx ? 'active' : 'pending'); }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'; }); }
function chipHTML(b){
  return '<div class="batchchip">'+esc(b.num)+' · THC '+esc(b.thc)+' · pkg '+esc(b.pkg)+' · exp '+esc(b.exp)+' · '+b.days+' d on hand · Metrc '+esc(b.metrc)+'</div>';
}

/* ---------- render: kit list ---------- */
function renderKits(){
  var host = $('#paneKits');
  var regions = {}; KITS.forEach(function(k){ (regions[k.region]=regions[k.region]||[]).push(k); });
  var html = '<h2>Kits — today</h2>';
  Object.keys(regions).forEach(function(r){
    html += '<div class="region-lbl">'+r+'</div>';
    regions[r].forEach(function(k){
      var stageLbl = k.stageIdx>=STAGES.length ? 'Closed' : STAGES[k.stageIdx];
      html += '<button class="kit-chip'+(k.id===selectedKitId?' selected':'')+'" data-kit="'+k.id+'">'
        + '<span class="kc-av">'+k.driver.split(' ').map(function(w){return w[0];}).join('')+'</span>'
        + '<span class="kc-mid"><span class="kc-name">'+k.driver+'</span><span class="kc-route">'+k.route+'</span>'
        + '<div class="kc-stage">'+(k.stageIdx>=STAGES.length?'Closed':'At: '+stageLbl)+'</div></span>'
        + (k.discrepancies>0 ? '<span class="dot-red" title="'+k.discrepancies+' open discrepancy"></span>' : '')
        + '</button>';
    });
  });
  host.innerHTML = html;
  $$('.kit-chip', host).forEach(function(el){ el.addEventListener('click', function(){ selectedKitId = el.getAttribute('data-kit'); openStage = {}; renderKits(); renderTimeline(); }); });
}

/* ---------- render: batch lines (Built / Refilled) — one row per batch, LOUD if mixed ---------- */
function mixedBanner(entries){
  var a=entries[0].batch, b=entries[1].batch;
  return '<div class="mixedbatch"><span class="mb-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><circle cx="12" cy="16.5" r=".6" fill="currentColor" stroke="none"/><path d="M10.3 3.9 1.8 18.5A1.6 1.6 0 003.2 21h17.6a1.6 1.6 0 001.4-2.5L13.7 3.9a1.6 1.6 0 00-2.8 0z"/></svg></span><div><div class="mb-title">Mixed batch — loud here and on the pick slip, oldest batch first</div><div class="mb-body">'+esc(a.num)+' · THC '+esc(a.thc)+' · pkg '+esc(a.pkg)+'  vs.  '+esc(b.num)+' · THC '+esc(b.thc)+' · pkg '+esc(b.pkg)+'</div></div></div>';
}
function renderLines(lines){
  var rows = lines.map(function(line){
    var isMixed = line.entries.length>1;
    var entryRows = line.entries.map(function(en,i){
      return '<tr'+(isMixed?' class="row-wrongbox"':'')+'>'
        + (i===0 ? '<td rowspan="'+line.entries.length+'">'+esc(line.box)+'</td>' : '')
        + '<td><div class="lineprod">'+esc(line.product)+'</div>'+chipHTML(en.batch)+'</td>'
        + '<td class="num">'+en.qty+'</td></tr>';
    }).join('');
    var loud = isMixed ? '<tr><td colspan="3" style="padding:0;border:none;">'+mixedBanner(line.entries)+'</td></tr>' : '';
    return entryRows + loud;
  }).join('');
  return '<table class="vtbl"><thead><tr><th>Box</th><th>Product / batch</th><th>Qty</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ---------- render: RFID read rows, per batch, with a flagged hand-count exception ---------- */
function stepperHTML(r){
  var val = (handCounts[r.id] !== undefined) ? handCounts[r.id] : r.read;
  return '<span class="stepper" data-id="'+r.id+'"><button type="button" class="stepbtn" data-d="-1">−</button><span class="stepval">'+val+'</span><button type="button" class="stepbtn" data-d="1">+</button></span>';
}
function renderScanRows(rows){
  var typeLbl = {match:'Match', missing:'Missing', extra:'Extra', wrongbatch:'Wrong batch', wrongbox:'Wrong box'};
  var trs = rows.map(function(r){
    var cls = 'row-'+r.type;
    var typeCls = r.type==='match' ? 'good' : (r.type==='extra' ? 'warn' : (r.type==='wrongbox' ? 'info' : 'bad'));
    var method = r.method==='hand' ? '<span class="methodtag hand">HAND COUNT</span>' : '<span class="methodtag rfid">RFID</span>';
    var readCell = r.method==='hand' ? stepperHTML(r) : ('<span class="num">'+r.read+'</span>');
    return '<tr class="'+cls+(r.method==='hand'?' row-hand':'')+'"><td><div class="lineprod">'+esc(r.product)+'</div>'+chipHTML(r.batch)+'</td><td class="num">'+r.expected+'</td><td class="num">'+readCell+'</td><td>'+method+'</td><td><span class="typetag '+typeCls+'">'+typeLbl[r.type]+'</span></td><td class="reasoncell">'+esc(r.reason||'')+'</td></tr>';
  }).join('');
  return '<table class="vtbl"><thead><tr><th>Product / batch</th><th>Expected</th><th>Read</th><th>Method</th><th>Type</th><th>Reason</th></tr></thead><tbody>'+trs+'</tbody></table>';
}

/* ---------- render: return-verify block ---------- */
function renderReturnVerify(rv, closeout){
  var rowsHtml = renderScanRows(rv.rows);
  var closeoutHtml = closeout ? '<div class="closeout"><div class="cc"><h4>Return-verify math</h4>'
    + '<div class="cc-row"><span>Expected</span><b>'+esc(rv.expected)+'</b></div>'
    + '<div class="cc-row"><span>Read + sold</span><b>'+esc(rv.read)+'</b></div></div>'
    + '<div class="cc"><h4>Driver closeout</h4><div class="cc-row"><span>Cash</span><b>'+esc(closeout.cash)+'</b></div><div class="cc-row" style="display:block;"><span>'+esc(closeout.notes)+'</span></div></div></div>' : '';
  return rowsHtml + closeoutHtml;
}

/* ---------- render: one stage card ---------- */
function renderStage(kit, i, stage){
  var status = stageStatus(kit, i);
  var hasMismatch = stage && stage.read === 'mismatch';
  var cls = 'tlstep '+status+(hasMismatch?' discrepancy':'');
  var dotIcon = status==='done' ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>' : (hasMismatch ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' : '');
  var when = stage ? stage.time+' · '+stage.who : '—';
  var readpill = stage && stage.read ? '<span class="readpill '+(stage.read==='match'?'match':'mismatch')+'">'+(stage.read==='match'?'RFID read: matched':'RFID read: discrepancy')+'</span>' : '';
  var key = kit.id+'-'+i;
  var isOpen = openStage[key] !== undefined ? openStage[key] : (status !== 'pending');
  var body = '';
  if (stage){
    if (stage.note) body += '<p class="stagenote">'+esc(stage.note)+'</p>';
    if (stage.lines) body += renderLines(stage.lines);
    if (stage.rows && !stage.returnverify) body += renderScanRows(stage.rows);
    if (stage.returnverify) body += renderReturnVerify(stage.returnverify, stage.closeout);
    if (stage.closeCheck) body += '<ul class="checklist">'+stage.closeCheck.map(function(c){ return '<li><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'+esc(c)+'</li>'; }).join('')+'</ul>';
  } else if (status==='pending'){
    body = '<p class="stagenote">Not reached yet.</p>';
  }
  return '<div class="'+cls+'"><span class="dot">'+dotIcon+'</span>'
    + '<div class="tlhead" data-toggle="'+key+'"><span class="lbl">'+STAGES[i]+'</span><span class="when">'+when+'</span>'+readpill+'<span class="chev">'+(isOpen?'▾':'▸')+'</span></div>'
    + '<div class="tlbody'+(isOpen?'':' collapsed')+'" data-body="'+key+'">'+body+'</div>'
    + '</div>';
}

function renderTimeline(){
  var kit = KITS.find(function(k){ return k.id===selectedKitId; });
  var host = $('#paneTl');
  var stageLbl = kit.stageIdx>=STAGES.length ? 'Closed' : STAGES[kit.stageIdx];
  var html = '<div class="kit-banner"><div><div class="kb-name">'+esc(kit.driver)+' · '+esc(kit.route)+'</div><div class="kb-route">'+kit.region+' — '+kit.boxes+' boxes, '+kit.units+' units built</div></div>'
    + '<div class="kb-stat">'
    + '<div class="si"><div class="k">Currently at</div><div class="v">'+stageLbl+'</div></div>'
    + '<div class="si"><div class="k">Open discrepancies</div><div class="v'+(kit.discrepancies>0?' warn':'')+'">'+kit.discrepancies+'</div></div>'
    + '<button class="qrclose" id="qrCloseBtn" title="Scan to close this kit"><span class="qrglyph"></span>Close by QR</button>'
    + '</div></div>'
    + '<div class="tl">' + STAGES.map(function(_,i){ return renderStage(kit, i, kit.stages[i]); }).join('') + '</div>'
    + '<div class="footerline">Verify — Concept C of 4 — The Verify Timeline</div>';
  host.innerHTML = html;
  $$('.tlhead', host).forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-toggle');
      var body = host.querySelector('[data-body="'+key+'"]');
      var nowOpen = body.classList.contains('collapsed');
      openStage[key] = nowOpen;
      body.classList.toggle('collapsed', !nowOpen);
      el.querySelector('.chev').textContent = nowOpen ? '▾' : '▸';
    });
  });
  $$('.stepbtn', host).forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var wrap = btn.closest('.stepper'); var id = wrap.getAttribute('data-id');
      var d = parseInt(btn.getAttribute('data-d'),10);
      var cur = handCounts[id] !== undefined ? handCounts[id] : parseInt(wrap.querySelector('.stepval').textContent,10);
      handCounts[id] = Math.max(0, cur+d);
      wrap.querySelector('.stepval').textContent = handCounts[id];
    });
  });
  var qrBtn = $('#qrCloseBtn', host);
  if (qrBtn) qrBtn.addEventListener('click', function(){ toast('Kit '+kit.driver+' · '+kit.route+' closed by QR scan (mock).'); });
}

renderKits();
renderTimeline();
})();
</script>
</body>
</html>
