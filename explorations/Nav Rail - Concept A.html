<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav Rail — Concept A: Drawer + Accordion Rail</title>
<style>
/* Tokens: pos/tokens.jsx house palette (LIGHT + DARK), copied verbatim — Hyperwolf yellow is the only accent. */
:root{
  --bg:#F4F2EC; --bg2:#EEEBE2; --surface:#FFFFFF; --surface2:#FAF9F5; --surface3:#F1EFE9;
  --ink:#0F0F0C; --ink2:#2A2A26; --inkDim:rgba(15,15,12,.60); --inkMute:rgba(15,15,12,.42); --inkFaint:rgba(15,15,12,.22);
  --hairline:rgba(15,15,12,.08); --hairline2:rgba(15,15,12,.14); --hairline3:rgba(15,15,12,.24);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:#FFF4B8; --accentBorder:#F2C200; --accentText:#7A5A00;
  --good:#1F8A4F; --goodSoft:#E2F2E8; --warn:#C07A12; --warnSoft:#FBEFD6; --warnText:#8F560C;
  --bad:#C0392B; --badSoft:#F8E2DF; --info:#2C5BB8; --infoSoft:#E3ECFA; --neutral:#6E6E66; --neutralSoft:#ECEAE2;
  --pack:#C24EA8;
  --rail:#13130F; --railInk:rgba(255,255,255,.72); --railBright:#FFFFFF;
  --railActive:rgba(255,209,0,.14); --railHair:rgba(255,255,255,.08); --railHover:rgba(255,255,255,.06);
  --disabledBg:#F1EFE9; --disabledInk:rgba(15,15,12,.42); --disabledBorder:rgba(15,15,12,.14);
  --r8:8px; --r10:10px; --r12:12px; --r14:14px; --r16:16px; --r999:999px;
  --shadowSm:0 1px 0 rgba(15,15,12,.04), 0 1px 2px rgba(15,15,12,.05);
  --shadowMd:0 1px 0 rgba(15,15,12,.04), 0 6px 18px rgba(15,15,12,.07);
  --shadowLg:0 1px 0 rgba(15,15,12,.04), 0 18px 44px rgba(15,15,12,.14);
  --fontSans:"Inter", -apple-system, system-ui, sans-serif;
  --fontMono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
  --scrim:rgba(20,18,12,.42);
  --focusRing:0 0 0 2px var(--surface), 0 0 0 4px var(--info);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0D0A; --bg2:#0A0A07; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
  --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40); --inkFaint:rgba(245,243,234,.22);
  --hairline:rgba(245,243,234,.09); --hairline2:rgba(245,243,234,.15); --hairline3:rgba(245,243,234,.26);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:rgba(255,209,0,.15); --accentBorder:rgba(255,209,0,.40); --accentText:#FFD100;
  --good:#46C07E; --goodSoft:rgba(70,192,126,.15); --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15); --warnText:#E0A53A;
  --bad:#E8675B; --badSoft:rgba(232,103,91,.16); --info:#6A99EC; --infoSoft:rgba(106,153,236,.16);
  --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08); --pack:#D877C4;
  --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
  --disabledBg:#28261D; --disabledInk:rgba(245,243,234,.40); --disabledBorder:rgba(245,243,234,.15);
  --shadowSm:0 1px 0 rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.40);
  --shadowMd:0 1px 0 rgba(0,0,0,.30), 0 8px 22px rgba(0,0,0,.45);
  --shadowLg:0 1px 0 rgba(0,0,0,.30), 0 22px 50px rgba(0,0,0,.62);
  --scrim:rgba(0,0,0,.62); --focusRing:0 0 0 2px #0D0D0A, 0 0 0 4px var(--info);
}}
:root[data-theme="dark"]{
  --bg:#0D0D0A; --bg2:#0A0A07; --surface:#1A1A14; --surface2:#211F18; --surface3:#28261D;
  --ink:#F5F3EA; --ink2:#D9D6CA; --inkDim:rgba(245,243,234,.60); --inkMute:rgba(245,243,234,.40); --inkFaint:rgba(245,243,234,.22);
  --hairline:rgba(245,243,234,.09); --hairline2:rgba(245,243,234,.15); --hairline3:rgba(245,243,234,.26);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:rgba(255,209,0,.15); --accentBorder:rgba(255,209,0,.40); --accentText:#FFD100;
  --good:#46C07E; --goodSoft:rgba(70,192,126,.15); --warn:#E0A53A; --warnSoft:rgba(224,165,58,.15); --warnText:#E0A53A;
  --bad:#E8675B; --badSoft:rgba(232,103,91,.16); --info:#6A99EC; --infoSoft:rgba(106,153,236,.16);
  --neutral:#9A968B; --neutralSoft:rgba(245,243,234,.08); --pack:#D877C4;
  --rail:#070705; --railInk:rgba(245,243,236,.66); --railBright:#FBFAF4;
  --disabledBg:#28261D; --disabledInk:rgba(245,243,234,.40); --disabledBorder:rgba(245,243,234,.15);
  --shadowSm:0 1px 0 rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.40);
  --shadowMd:0 1px 0 rgba(0,0,0,.30), 0 8px 22px rgba(0,0,0,.45);
  --shadowLg:0 1px 0 rgba(0,0,0,.30), 0 22px 50px rgba(0,0,0,.62);
  --scrim:rgba(0,0,0,.62); --focusRing:0 0 0 2px #0D0D0A, 0 0 0 4px var(--info);
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--fontSans);color:var(--ink);background:var(--bg2);-webkit-font-smoothing:antialiased;font-size:13px;}
button,input,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focusRing);border-radius:8px;}
[hidden]{display:none !important;}
svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

/* ---- demo harness (not part of the shipped design) ---- */
.demo-bar{position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--hairline2);box-shadow:var(--shadowSm);}
.demo-bar strong{font-size:13px;}
.demo-bar .note{font-size:11.5px;color:var(--inkMute);max-width:640px;}
.demo-controls{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--hairline2);border-radius:var(--r999);padding:3px;gap:2px;}
.seg button{appearance:none;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--inkDim);padding:6px 12px;border-radius:var(--r999);}
.seg button.on{background:var(--ink);color:var(--surface);}
.btn-ghost{appearance:none;border:1px solid var(--hairline3);background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;height:30px;padding:0 12px;border-radius:var(--r8);}
.btn-ghost:hover{background:var(--surface2);}
.stage{padding:22px;display:flex;justify-content:center;align-items:flex-start;}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;
  padding:10px 14px;border-radius:var(--r10);box-shadow:var(--shadowLg);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:400;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---- shared chrome: store switcher, profile chip, bell, badges, Soon ---- */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r999);
  background:var(--accent);color:var(--accentInk);font-family:var(--fontMono);font-size:10.5px;font-weight:700;line-height:1;}
.badge.dark{background:var(--ink);color:var(--surface);}
.soon-pill{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px dashed currentColor;opacity:.75;
  border-radius:var(--r999);padding:2px 6px;line-height:1;}
.iconbtn{position:relative;width:44px;height:44px;border-radius:var(--r10);border:none;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.iconbtn:hover{background:var(--surface3);}
.iconbtn .dot{position:absolute;top:7px;right:6px;}
.sw{position:relative;}
.sw-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 10px 0 9px;border-radius:var(--r10);border:1px solid var(--hairline2);background:var(--surface);color:var(--ink);font-weight:700;font-size:12.5px;white-space:nowrap;}
.sw-btn:hover{background:var(--surface2);}
.sw-btn .ic{width:15px;height:15px;}
.sw-btn .chev{width:12px;height:12px;opacity:.6;}
.sw-btn small{font-weight:500;color:var(--inkDim);font-size:11px;}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--hairline2);border-radius:var(--r12);box-shadow:var(--shadowLg);padding:6px;z-index:60;display:none;}
.menu.open{display:block;}
.menu .mh{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--inkMute);padding:6px 10px 4px;font-weight:700;}
.menu button{width:100%;display:flex;align-items:center;gap:9px;min-height:40px;padding:0 10px;border:none;background:transparent;border-radius:var(--r8);text-align:left;font-size:12.5px;font-weight:600;color:var(--ink);}
.menu button:hover{background:var(--surface2);}
.menu button .sub{margin-left:auto;font-family:var(--fontMono);font-size:10.5px;color:var(--inkMute);font-weight:500;}
.menu button .chk{width:14px;height:14px;color:var(--good);visibility:hidden;}
.menu button[aria-selected="true"] .chk{visibility:visible;}
.who{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 10px 0 4px;border-radius:var(--r999);border:1px solid var(--hairline2);background:var(--surface);}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;font-family:var(--fontMono);}
.who .t{display:flex;flex-direction:column;line-height:1.15;}
.who .t b{font-size:12px;}
.who .t small{font-size:10.5px;color:var(--inkDim);}
.role-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r999);padding:2px 8px;font-size:10.5px;font-weight:700;background:var(--neutralSoft);color:var(--ink2);}

/* ---- desktop shell ---- */
.app{display:flex;width:100%;max-width:1400px;height:840px;border-radius:var(--r16);overflow:hidden;box-shadow:var(--shadowLg);border:1px solid var(--hairline2);background:var(--bg);position:relative;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
.topbar{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--hairline2);background:var(--surface);}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);}
.crumb .sep{color:var(--inkFaint);}
.crumb .cat{color:var(--inkDim);font-weight:600;}
.topbar .grow{flex:1;}
.content{flex:1;min-height:0;overflow:auto;}

/* ---- Orders board (desktop kanban) ---- */
.ob{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;min-height:100%;}
.ob-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ob-title{font-size:20px;font-weight:800;letter-spacing:-.01em;}
.ob-sub{font-size:12px;color:var(--inkDim);font-family:var(--fontMono);}
.segc{display:inline-flex;background:var(--surface2);border:1px solid var(--hairline2);border-radius:var(--r999);padding:3px;gap:2px;}
.segc button{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--inkDim);height:30px;padding:0 12px;border-radius:var(--r999);display:inline-flex;gap:6px;align-items:center;}
.segc button.on{background:var(--ink);color:var(--surface);}
.segc .n{font-family:var(--fontMono);font-size:10.5px;opacity:.8;}
.btn-primary{background:var(--accent);color:var(--accentInk);border:1px solid var(--accentBorder);border-radius:var(--r10);height:36px;padding:0 14px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;}
.btn-primary:hover{filter:brightness(.97);}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--hairline3);border-radius:var(--r10);height:36px;padding:0 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;}
.btn-secondary:hover{background:var(--surface2);}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:12px;flex:1;min-height:0;overflow-x:auto;padding-bottom:4px;}
.lane{background:var(--bg2);border:1px solid var(--hairline);border-radius:var(--r14);border-top:3px solid var(--laneC);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:340px;}
.lane-h{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;padding:0 2px;}
.lane-h .n{font-family:var(--fontMono);color:var(--inkDim);font-weight:500;}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r12);padding:10px 12px;box-shadow:var(--shadowSm);display:flex;flex-direction:column;gap:6px;}
.card .r1{display:flex;justify-content:space-between;align-items:center;}
.card .num{font-family:var(--fontMono);font-size:11px;color:var(--inkDim);}
.card .tot{font-family:var(--fontMono);font-weight:700;font-size:13px;}
.card .name{font-weight:700;font-size:13px;}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--inkDim);align-items:center;}
.card .age{margin-left:auto;font-family:var(--fontMono);font-size:10.5px;color:var(--inkMute);}
.pill{display:inline-flex;align-items:center;border-radius:var(--r999);padding:2px 7px;font-size:10.5px;font-weight:700;background:var(--neutralSoft);color:var(--ink2);line-height:1.3;}
.pill.wm{background:var(--infoSoft);color:var(--info);}
.pill.member{background:var(--accentSoft);color:var(--accentText);}
.pill.warn{background:var(--warnSoft);color:var(--warnText);}
.pill.stage{color:var(--surface);background:var(--laneC);}
.empty-lane{border:1.5px dashed var(--hairline3);border-radius:var(--r12);padding:16px;text-align:center;color:var(--inkMute);font-size:11.5px;}

/* ---- Orders list (phone) ---- */
.ol{display:flex;flex-direction:column;gap:8px;padding:10px 16px 110px;}
.ol-h{display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px;}
.ol-h .t{font-size:17px;font-weight:800;letter-spacing:-.01em;}
.ol-h .s{font-size:11px;color:var(--inkDim);font-family:var(--fontMono);}
.ol-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r12);
  padding:9px 12px 9px 10px;min-height:60px;border-left:4px solid var(--laneC);box-shadow:var(--shadowSm);text-align:left;width:100%;}
.ol-row .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.ol-row .name{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:baseline;}
.ol-row .num{font-family:var(--fontMono);font-size:10.5px;color:var(--inkDim);font-weight:500;}
.ol-row .meta{font-size:11px;color:var(--inkDim);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ol-row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.ol-row .tot{font-family:var(--fontMono);font-weight:700;font-size:13px;}

/* ---- phone frame ---- */
.phone{width:390px;height:844px;border-radius:44px;background:var(--bg);border:1px solid var(--hairline3);box-shadow:var(--shadowLg);overflow:hidden;position:relative;display:flex;flex-direction:column;}
.statusbar{height:47px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 8px;font-size:14px;font-weight:700;background:var(--surface);}
.statusbar .sig{display:flex;gap:5px;align-items:center;font-size:11px;font-family:var(--fontMono);}
.p-screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden;}
.p-body{flex:1;min-height:0;overflow:auto;}
.home-ind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.35;z-index:120;pointer-events:none;}
.p-top{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--hairline2);}
.p-top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:4px;}
.p-top .ttl b{font-size:15px;}
.p-top .ttl small{font-size:11px;color:var(--inkDim);}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .18s;z-index:80;}
.scrim.on{opacity:1;pointer-events:auto;}
.p-search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:var(--r12);background:var(--surface3);border:1px solid var(--hairline2);flex:1;min-width:0;}
.p-search input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:var(--ink);}
.p-search input::placeholder{color:var(--inkMute);}
.p-search input:focus-visible{box-shadow:none;}
.p-search:focus-within{box-shadow:var(--focusRing);border-color:transparent;}
.p-search .ic{width:17px;height:17px;color:var(--inkDim);}
/* generic phone list rows used by nav surfaces */
.nrow{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:none;background:transparent;border-radius:var(--r10);text-align:left;font-size:14px;font-weight:600;color:var(--ink);position:relative;}
.nrow:hover{background:var(--surface3);}
.nrow[aria-current="page"]{background:var(--accentSoft);color:var(--ink);}
.nrow[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:3px;background:var(--accent);}
.nrow .ic{width:19px;height:19px;color:var(--inkDim);}
.nrow[aria-current="page"] .ic{color:var(--accentText);}
.nrow .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nrow .sub{font-size:11px;color:var(--inkDim);font-weight:500;}
.nrow[aria-disabled="true"]{color:var(--disabledInk);cursor:default;}
.nrow[aria-disabled="true"] .ic{color:var(--disabledInk);}
.nrow[aria-disabled="true"]:hover{background:transparent;}
.nrow .star{width:16px;height:16px;color:var(--accentText);}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--r999);border:1px solid var(--hairline2);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
.chip:hover{background:var(--surface2);}
.chip .ic{width:14px;height:14px;color:var(--inkDim);}
.chip[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.chip[aria-current="page"] .ic{color:var(--surface);}
.chip[aria-disabled="true"]{border-style:dashed;color:var(--disabledInk);cursor:default;}
.sec-h{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--inkMute);font-weight:700;padding:12px 12px 6px;}

/* ===== A · desktop: collapsible accordion rail ===== */
.rail{width:272px;flex:0 0 272px;background:var(--rail);color:var(--railInk);display:flex;flex-direction:column;min-height:0;transition:width .16s ease,flex-basis .16s ease;position:relative;z-index:20;}
.rail.collapsed{width:72px;flex-basis:72px;}
.rail-head{display:flex;align-items:center;gap:9px;padding:14px 14px;border-bottom:1px solid var(--railHair);flex:0 0 auto;min-height:60px;}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;font-family:var(--fontMono);flex:0 0 auto;}
.rail-head .word{font-weight:700;font-size:14px;color:var(--railBright);white-space:nowrap;overflow:hidden;}
.railToggle{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--railHair);background:transparent;color:var(--railInk);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.railToggle:hover{background:var(--railHover);}
.railToggle .ic{width:14px;height:14px;}
.rail.collapsed .rail-head{justify-content:center;padding:14px 0;}
.rail.collapsed .railToggle{margin-left:0;}
.rail.collapsed .word,.rail.collapsed .rsearch,.rail.collapsed .rfavs,.rail.collapsed .cat-label,.rail.collapsed .cat-count,.rail.collapsed .cat-chev,
.rail.collapsed .item-label,.rail.collapsed .item-badge,.rail.collapsed .rfoot .t,.rail.collapsed .rfoot .sw,.rail.collapsed .mark-word{display:none;}
.rsearch{padding:12px 12px 6px;}
.rbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--railHair);border-radius:var(--r10);height:36px;padding:0 10px;}
.rbox input{background:transparent;border:none;color:var(--railBright);font-size:12.5px;width:100%;}
.rbox input::placeholder{color:var(--railInk);}
.rbox kbd{font-family:var(--fontMono);font-size:10px;color:var(--railInk);border:1px solid var(--railHair);border-radius:4px;padding:1px 5px;}
.rbox .ic{width:15px;height:15px;}
.rsearch-icon{display:none;width:44px;height:44px;margin:8px auto 0;border-radius:10px;border:1px solid var(--railHair);background:transparent;color:var(--railInk);align-items:center;justify-content:center;}
.rail.collapsed .rsearch-icon{display:flex;}
.rfavs{padding:4px 12px 8px;}
.rfavs .h{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--railInk);opacity:.7;font-weight:700;padding:4px 2px;}
.rfavs .row{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.rfavs .row::-webkit-scrollbar{display:none;}
.rchip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid var(--railHair);border-radius:var(--r999);height:28px;padding:0 10px 0 7px;font-size:11.5px;color:var(--railInk);white-space:nowrap;}
.rchip:hover{background:var(--railHover);color:var(--railBright);}
.rchip .ic{width:12px;height:12px;color:var(--accent);}
.rchip[aria-current="page"]{color:var(--railBright);border-color:var(--accent);}
.rail-scroll{flex:1;overflow-y:auto;min-height:0;padding:2px 8px 8px;}
.rail-scroll::-webkit-scrollbar{width:8px;}
.rail-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
.cat{margin-bottom:2px;position:relative;}
.cat-btn{width:100%;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 8px;border:none;background:transparent;border-radius:var(--r10);color:var(--railInk);text-align:left;}
.cat-btn:hover{background:var(--railHover);}
.cat-btn .ic{width:18px;height:18px;}
.cat-label{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.01em;color:var(--railBright);white-space:nowrap;}
.cat-count{font-size:10px;font-family:var(--fontMono);color:var(--railInk);background:rgba(255,255,255,.08);border-radius:99px;padding:1px 6px;}
.cat-badge{position:absolute;top:6px;left:28px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none;}
.rail.collapsed .cat.has-badge .cat-badge{display:block;}
.cat-chev{width:14px;height:14px;transition:transform .14s ease;}
.cat.open .cat-chev{transform:rotate(90deg);}
.cat.is-ancestor .cat-btn{background:var(--railActive);}
.cat.is-ancestor .cat-label{color:var(--accent);}
.rail.collapsed .cat-btn{justify-content:center;padding:0;min-height:44px;}
.cat-items{overflow:hidden;max-height:0;transition:max-height .16s ease;}
.cat.open .cat-items{max-height:520px;}
.rail.collapsed .cat-items{max-height:0 !important;}
.item-btn{width:100%;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px 0 36px;border:none;background:transparent;border-radius:var(--r10);color:var(--railInk);text-align:left;font-size:12.5px;position:relative;}
.item-btn:hover{background:var(--railHover);color:var(--railBright);}
.item-btn[aria-current="page"]{background:var(--railActive);color:var(--railBright);font-weight:700;}
.item-btn[aria-current="page"]::before{content:"";position:absolute;left:14px;top:50%;transform:translateY(-50%);width:4px;height:16px;border-radius:3px;background:var(--accent);}
.item-btn .ic{width:15px;height:15px;opacity:.9;}
.item-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-btn .note{font-size:10px;color:var(--railInk);opacity:.7;font-weight:500;}
.item-btn[aria-disabled="true"]{opacity:.5;cursor:default;}
.item-btn[aria-disabled="true"]:hover{background:transparent;}
.item-badge{display:inline-flex;}
.fly{position:absolute;left:100%;top:0;min-width:230px;background:var(--rail);border:1px solid var(--railHair);border-radius:var(--r12);box-shadow:var(--shadowLg);padding:8px;display:none;z-index:30;}

.fly .item-btn{padding-left:10px;}
.fly .item-btn[aria-current="page"]::before{display:none;}
.rfoot{border-top:1px solid var(--railHair);padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.rfoot .sw-btn{width:100%;background:rgba(255,255,255,.05);border-color:var(--railHair);color:var(--railBright);justify-content:flex-start;}
.rfoot .sw-btn small{color:var(--railInk);}
.rfoot .sw-btn:hover{background:var(--railHover);}
.rfoot .who{background:transparent;border-color:var(--railHair);color:var(--railBright);width:100%;}
.rfoot .who .t small{color:var(--railInk);}
.rail.collapsed .rfoot{padding:10px 0;align-items:center;}
.rail.collapsed .rfoot .who{border:none;padding:0;justify-content:center;width:44px;}

/* ===== A · phone: drawer ===== */
.drawer{position:absolute;top:0;left:0;bottom:0;width:86%;max-width:340px;background:var(--surface);z-index:90;display:flex;flex-direction:column;

.drawer.open{transform:translateX(0);}

.dr-head .who .t b{font-size:13.5px;}

.dr-store .sw-btn{width:100%;justify-content:flex-start;height:44px;}
.dr-store .menu{left:0;right:0;}
.dr-pinned{padding:8px 12px 6px;border-bottom:1px solid var(--hairline);}
.dr-pinned .h{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--inkMute);font-weight:700;padding:4px 0;}
.dr-pinned .row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;}
.dr-pinned .row::-webkit-scrollbar{display:none;}
.dr-scroll{flex:1;overflow-y:auto;min-height:0;padding:6px 8px 20px;}
.acc{border-bottom:1px solid var(--hairline);}
.acc:last-child{border-bottom:none;}
.acc-btn{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 10px;border:none;background:transparent;border-radius:var(--r10);text-align:left;color:var(--ink);}
.acc-btn:hover{background:var(--surface3);}
.acc-btn .ic{width:20px;height:20px;color:var(--inkDim);}
.acc-btn .lbl{flex:1;font-size:15px;font-weight:700;}
.acc-btn .cnt{font-family:var(--fontMono);font-size:11px;color:var(--inkMute);}
.acc-btn .chev{width:16px;height:16px;color:var(--inkMute);transition:transform .14s;}
.acc.open .acc-btn .chev{transform:rotate(90deg);}
.acc.is-ancestor .acc-btn .ic,.acc.is-ancestor .acc-btn .lbl{color:var(--accentText);}
.acc-items{overflow:hidden;max-height:0;transition:max-height .18s ease;}
.acc.open .acc-items{max-height:560px;padding-bottom:6px;}
.acc-items .nrow{padding-left:44px;min-height:46px;}
.acc-items .nrow[aria-current="page"]::before{left:8px;}
.dr-edge{position:absolute;top:0;bottom:0;left:0;width:18px;z-index:85;}

/* ---- keyboard: ArrowUp/Down (and Left/Right in horizontal groups) move
   between .kbd-item buttons inside the nearest [data-kbd]; Enter/Space are
   native button activation; Escape closes whatever nav surface is open;
   "/" or ⌘K focuses the search box. Tab order is DOM order, ring via :focus-visible. ---- */
document.addEventListener('keydown', function(e){
  var inInput = e.target.tagName === 'INPUT';
  if (e.key === 'Escape'){ closeMenus(); if (typeof onEscape === 'function') onEscape(); return; }
  if ((e.key === '/' && !inInput) || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){ e.preventDefault(); if (typeof focusSearch === 'function') focusSearch(); return; }
  var horiz = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && !horiz) return;
  var scope = e.target.closest('[data-kbd]');
  if (!scope) return;
  if (horiz && scope.getAttribute('data-kbd') !== 'h') return;
  if (!horiz && scope.getAttribute('data-kbd') === 'h') return;
  var list = Array.prototype.slice.call(scope.querySelectorAll('.kbd-item')).filter(function(el){ return el.offsetParent !== null && el.getAttribute('aria-disabled')!=='true'; });
  var idx = list.indexOf(e.target);
  if (idx < 0 && inInput){ idx = -1; } else if (idx < 0) return;
  e.preventDefault();
  var fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';
  var next = fwd ? Math.min(idx+1, list.length-1) : Math.max(idx-1, 0);
  if (next < 0) return;
  list[next].focus();
});

  var isDark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

}

  var pin = document.getElementById('drPinned');

    '<div class="h">Recent</div><div class="row">'+state.recent.slice(0,3).map(function(id){ var x=findItem(id); return '<button class="chip" type="button" data-nav="'+id+'">'+ic('clock')+esc(x.item.label)+'</button>'; }).join('')+'</div>';
  bindNav(pin);
  var sc = document.getElementById('drScroll');
  sc.innerHTML = CATS.map(function(c){
    var anc = c.items.some(function(it){ return it.id===state.active; }); var open = !!openAcc[c.id];
    return '<div class="acc'+(open?' open':'')+(anc?' is-ancestor':'')+'">'+
      '<button class="acc-btn kbd-item" type="button" data-acc="'+c.id+'" aria-expanded="'+open+'">'+ic(c.icon)+'<span class="lbl">'+esc(c.label)+'</span>'+(catBadge(c)?'<span class="badge">'+catBadge(c)+'</span>':'')+'<span class="cnt">'+c.items.length+'</span>'+ic('chev','ic chev')+'</button>'+
      '<div class="acc-items">'+c.items.map(function(it){ return '<button class="nrow kbd-item" type="button" data-nav="'+it.id+'" '+(it.id===state.active?'aria-current="page"':'')+(it.soon?' aria-disabled="true"':'')+'>'+ic(it.icon)+'<span class="lbl">'+esc(it.label)+(it.note?' <span class="sub">'+esc(it.note)+'</span>':'')+'</span>'+itemBadgeHTML(it)+'</button>'; }).join('')+'</div></div>'; }).join('');
  sc.querySelectorAll('[data-acc]').forEach(function(b){ b.addEventListener('click', function(){ var id=b.getAttribute('data-acc'); openAcc[id]=!openAcc[id]; renderPhone(); }); });
  bindNav(sc);
}
function render(){ if (state.device==='desktop') renderDesktop(); else renderPhone(); }

document.getElementById('railSearch').addEventListener('input', function(e){ state.q = e.target.value; renderRail(); });
document.getElementById('railToggle').addEventListener('click', function(){ setNavOpen(!state.open); render(); });
document.getElementById('railSearchIcon').addEventListener('click', function(){ setNavOpen(true); setTimeout(function(){ document.getElementById('railSearch').focus(); }, 180); });
document.getElementById('pMenu').addEventListener('click', function(){ setNavOpen(true, true); });
document.getElementById('pScrim').addEventListener('click', function(){ setNavOpen(false); });

/* swipe: drag the drawer left to close (pointer events so a mouse works in the preview too);
   drag from the left edge to open. */
(function(){
  var d = document.getElementById('drawer'), edge = document.getElementById('drEdge');
  var startX = null, dx = 0, w = 0;
  function down(e){ startX = e.clientX; dx = 0; w = d.offsetWidth; d.classList.add('dragging'); d.setPointerCapture && d.setPointerCapture(e.pointerId); }
  function move(e){ if (startX==null) return; dx = Math.min(0, e.clientX - startX); d.style.transform = 'translateX('+dx+'px)'; }
  function up(){ if (startX==null) return; d.classList.remove('dragging'); d.style.transform = ''; if (-dx > w*0.28) setNavOpen(false); startX = null; }
  d.addEventListener('pointerdown', function(e){ if (e.target.closest('button,input')) return; down(e); });
  d.addEventListener('pointermove', move); d.addEventListener('pointerup', up); d.addEventListener('pointercancel', up);
  edge.addEventListener('pointerdown', function(){ setNavOpen(true); });
})();


setNavOpen(state.open);
render();
})();
</script>
</body>
