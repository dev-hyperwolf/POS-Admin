<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hyperwolf Shop — Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%; background:#F4F2EC; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { min-height:100%; }
  .mono { font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder, textarea::placeholder { color:rgba(128,128,120,.7); }
  button { font-family:inherit; }
  a { color:inherit; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0D0D0A">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0D0D0A"/>
    <rect x="180" y="150" width="840" height="86" rx="16" fill="#1A1A14"/>
    <circle cx="238" cy="193" r="17" fill="#FFD100"/>
    <rect x="276" y="182" width="190" height="22" rx="11" fill="#F5F3EA" opacity="0.85"/>
    <rect x="180" y="280" width="400" height="240" rx="18" fill="#1A1A14"/>
    <rect x="212" y="316" width="150" height="16" rx="8" fill="#FFD100"/>
    <rect x="212" y="352" width="300" height="28" rx="10" fill="#F5F3EA" opacity="0.8"/>
    <rect x="620" y="280" width="400" height="240" rx="18" fill="#1A1A14"/>
    <rect x="652" y="316" width="150" height="16" rx="8" fill="#FFD100"/>
    <rect x="652" y="352" width="300" height="28" rx="10" fill="#F5F3EA" opacity="0.8"/>
    <text x="600" y="640" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700" letter-spacing="6" fill="#8a8a80" text-anchor="middle">SHOP</text>
  </svg>
</template>
<div id="root"></div>

<!-- The stacking scale. MUST be first: every floating layer on this page reads it,
     and the plain-JS chrome mounts before any text/babel module has run. -->
<script src="shared/hw-z.js"></script>
<script src="shared/brands.js"></script>
<!-- The swap/upsell + pricing engine, and the ONE adapter from this estate's
     product shape to it. Plain JS, loads before React. commerce-engine.js is a
     BUILT artefact from dev-hyperwolf/hyperwolf-commerce-logic — regenerate it
     there, never hand-edit. Every money figure in the cart comes from
     HWCommerce.computeCartTotals via SHOP.totals(). -->
<script src="shared/commerce-engine.js"></script>
<script src="shared/commerce-adapter.js"></script>
<script src="shared/merch-store.js"></script>
<script src="shared/app-nav.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- window.ScreenBoundary (CONTAIN) + window.CriticalBoundary (REFUSE).
     PLAIN JS, after React and BEFORE babel: the file is pure
     React.createElement with no JSX, and every text/babel screen below is
     transformed and executed later, so it must already be defined when the
     first screen runs. Storefront note: shop/chrome.jsx REFUSES on the cart and
     on checkout. A cart or a total that renders wrong is money. -->
<script src="shared/error-boundary.jsx"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<!-- The one catalogue. The storefront never mirrors a second one. -->
<script type="text/babel" src="pos/data.jsx"></script>
<!-- The van kit table. This is what makes the per-product ⚡ EXPRESS badge a
     fact about today's stock rather than a decoration: express is the driver
     kit pool, and REGION_STOCK is this estate's driver kit. -->
<script type="text/babel" src="delivery/ddata.jsx"></script>
<script type="text/babel" src="shop/data.jsx"></script>
<script type="text/babel" src="shop/chrome.jsx"></script>
<script type="text/babel" src="shop/screen-home.jsx"></script>
<script type="text/babel" src="shop/screen-shop.jsx"></script>
<!-- Cart + checkout. The shell resolves these through SHOPDATA.screenFor and
     renders an honest "not loaded" state if either is absent. -->
<script type="text/babel" src="shop/screen-cart.jsx"></script>
<script type="text/babel" src="shop/screen-checkout.jsx"></script>
<script type="text/babel" data-presets="react">
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.ShopApp));
</script>
<script src="shared/app-switcher.js"></script>
<script src="shared/tour-steps.js"></script>
<script src="shared/tour.js"></script>
<script src="shared/notes.js"></script>
</body>
</html>
