<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forms — Hyperwolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button, select, input, textarea { font-family:inherit; }
  a { color:#7A5A00; }
  a:hover { color:#0F0F0C; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  /* Print mode: chrome (rail, header controls, toasts) never prints — only the
     form sheet FormView renders for mode:'print' should reach paper. */
  @media print {
    [data-hw-chrome], .hdform-no-print { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- The stacking scale. MUST be first: every floating layer on this page reads
     it, and the plain-JS chrome mounts before any text/babel module has run. -->
<script src="shared/hw-z.js"></script>
<script src="shared/brands.js"></script>
<script src="shared/app-nav.js"></script>
<!-- shared/hw-live.js, LITE mode — same reasoning as Hyperwolf Bounty.html: this
     app carries no pos/data.jsx catalogue for the full /api/state fetch to
     update, only base resolution / write token / connectivity badge. -->
<script src="shared/hw-live.js" data-hw-live-lite="1"></script>
<!-- @hyper-tech/contracts: the estate's enums, ids, money, time, error and event rules as
     window.HWContracts. Plain JS, IIFE, one global. HDForm's compile()/validate()
     build on this walker directly — see docs/BUILD-AGAINST-THE-SOURCE.md. -->
<script src="contracts/index.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- window.ScreenBoundary (CONTAIN) + window.CriticalBoundary (REFUSE).
     PLAIN JS, after React and BEFORE babel — see shared/error-boundary.jsx. -->
<script src="shared/error-boundary.jsx"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="pos/dev-note.jsx"></script>
<script type="text/babel" src="shared/app-rail.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<script type="text/babel" src="shared/hd-format.jsx"></script>
<script type="text/babel" src="shared/hd-ui.jsx"></script>
<!-- The form generator's one renderer. docs/migration/FORM-GENERATOR-PROPOSAL.md.
     Depends on contracts/index.js (compile/validate) and, only once render()
     is called, the atoms above. -->
<script type="text/babel" src="shared/hd-form.jsx"></script>
<script type="text/babel" src="forms-app/app.jsx"></script>

<script src="shared/app-switcher.js"></script>
</body>
</html>
