<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Sign — Hyperwolf</title>
<!--
  The employee-facing signing page (write-up e-signatures + onboarding
  document acknowledgements). URL form: /sign.html#<token> -- see
  docs/migration/SIGNED-LINKS-URL-FORM-NOTE-2026-09-17.md for why this is a
  hash fragment and not the /l/<token> path wm-demo's docs/SIGNED-LINKS.md
  names (that path is served by a DIFFERENT module in wm-demo, Engage's
  short-link click tracker, not wmdemo/signed_links.py).

  NO CONSOLE CHROME. No app-rail, no nav, no shared/hw-live.js (that seam
  manages a WRITE-TOKEN session; this page authenticates with one signed
  link token only, per shared/hw-link-client.js). Nothing here is loaded
  from an external origin beyond the same CDN pins every other page in this
  estate already uses for React/ReactDOM/Babel.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#fff; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { min-height:100%; }
  input, textarea, button { font-family:inherit; }
  input::placeholder { color:rgba(128,128,120,.7); }
</style>
</head>
<body>
<div id="root"></div>

<!-- @hyper-tech/contracts: enums/validation hd-form.jsx's validate() delegates
     to when present. Plain JS, IIFE, one global. -->
<script src="contracts/index.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- The link-token fetch seam (no storage, no session -- see its own header
     comment) and the form renderer it hands the signature/checkbox fields
     to. Plain JS first, then the JSX page that composes them. -->
<script src="shared/hw-link-client.js"></script>
<script type="text/babel" src="shared/hd-form.jsx"></script>
<script type="text/babel" src="shared/hw-sign-page.jsx"></script>

<script type="text/babel">
  window.HWSignPage.mount(document.getElementById('root'));
</script>
</body>
</html>
