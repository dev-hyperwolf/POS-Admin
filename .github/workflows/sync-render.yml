# Keep Render in step with GitHub Pages.
#
# WHY THIS EXISTS: Render is connected to dev-hyperwolf/wm-integration, not to this
# repo. It pulls this repo at BUILD time (see wm-integration/render.yaml), so it has no
# visibility into commits here and will never rebuild on its own. Pages updates the
# instant you push; Render keeps serving whatever it last cloned.
#
# That is how the two hosts drifted for six days in August 2026 -- silently, because
# nothing on either page said which build it was showing. This closes the loop.
#
# IT DOES NOT JUST FIRE AND HOPE. Firing a webhook and reporting success would be a
# check that looks like it covers something and does not. After triggering, this polls
# Render's own build-info.json until it reports THIS commit, and fails if it never does.

name: Sync Render to main

on:
  push:
    branches: [main]
  workflow_dispatch:        # so you can re-sync by hand without an empty commit

concurrency:
  group: render-sync        # a burst of pushes should produce one final correct deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require the deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set. Render will NOT be updated"
            echo "::error::and this repo's two hosts will drift. Add it under"
            echo "::error::Settings > Secrets and variables > Actions. Get the URL from"
            echo "::error::the Render dashboard: service > Settings > Deploy Hook."
            exit 1
          fi

      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          code=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -X POST "$HOOK")
          echo "hook responded $code"
          cat /tmp/hook.out || true
          # 2xx only. A 401/404 means the hook was rotated or the service was replaced.
          case "$code" in 2*) ;; *) echo "::error::deploy hook returned $code"; exit 1;; esac

      - name: Wait until Render actually serves this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          # Render stops the old instance before starting the new one (the service has a
          # disk), so a 502 window here is expected, not a failure.
          for i in $(seq 1 60); do
            live=$(curl -sS -m 15 https://hyperwolf-wm-demo.onrender.com/build-info.json 2>/dev/null \
                   | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')
            if [ "$live" = "$SHA" ]; then
              echo "Render is serving $SHA"
              exit 0
            fi
            echo "attempt $i: render at ${live:-unreachable}, want $SHA"
            sleep 15
          done
          echo "::error::Render did not reach $SHA within 15 minutes."
          echo "::error::Check the Render dashboard for a failed build. The hosts are OUT OF SYNC."
          exit 1

      - name: Confirm the two hosts agree
        run: |
          # ⚠️ THIS NO LONGER COMPARES BYTES, AND THAT IS DELIBERATE.
          #
          # It used to shasum this page on both hosts and require equality. That
          # stopped being the right question when Render started PRECOMPILING the
          # JSX at deploy time (wm-integration/render.yaml): Render now serves
          # plain <script src="build/pos/x.<hash>.js"> where Pages, which has no
          # build step and serves main verbatim, still serves
          # <script type="text/babel" src="pos/x.jsx">. The two hosts SHOULD
          # differ in those bytes now, and a check that fails on every single
          # deploy is a check everybody turns off.
          #
          # THE DRIFT QUESTION IS STILL ASKED, in two parts:
          #   1. STRUCTURE — both hosts must load the same app sources, in the
          #      same order. Render names each one in data-hw-src, Pages in the
          #      src of its babel tag, so one extraction reads both. This catches
          #      a stale clone that is missing a screen, which is the shape the
          #      six-day drift in August actually had.
          #   2. CONTENT — Render publishes build/precompiled-sources.txt, the
          #      sha256 of every .jsx it compiled. We hash one of those files as
          #      Pages serves it and require the sha to appear. That is a
          #      STRONGER statement than the old byte compare: it says Render's
          #      compiled output was built from the exact source Pages is serving.
          #
          # Still a poll, for the reason the old comment gave: Pages publishes on
          # its own schedule and is often still building when Render finishes.
          PAGES=https://dev-hyperwolf.github.io/POS-Admin
          RENDER=https://hyperwolf-wm-demo.onrender.com
          # The extractor lives in a quoted heredoc, not inline in a shell function.
          # The inline version needed five levels of escaping to get a regex through
          # YAML -> shell -> python, and produced a SyntaxError that made this step
          # fail for a reason with nothing to do with drift. A red check that lies
          # about WHY is barely better than a green one that lies about whether.
          #
          # EVERY LINE OF THE HEREDOC CARRIES THIS BLOCK'S INDENT ON PURPOSE. A `run:`
          # block scalar strips exactly this much; a heredoc body written at column 0
          # leaves the block and YAML reads `import re, sys` as a new top-level key,
          # breaking the whole workflow file rather than just this step.
          cat > /tmp/srclist.py <<'SRCLIST'
          import re, sys
          h = sys.stdin.read()
          # Render, precompiled: the source path rides along on the compiled tag.
          r = re.findall(r'data-hw-src="([^"]+)"', h)
          # Pages -- and a Render build that could not precompile -- carry the real thing.
          if not r:
              r = re.findall(r'<script[^>]*type="text/babel"[^>]*src="([^"]+)"', h)
          print(chr(10).join(r))
          SRCLIST
          extract() { python3 /tmp/srclist.py; }
          for i in $(seq 1 40); do
            curl -sS -m 20 "$PAGES/Hyperwolf%20POS.html"  > /tmp/pages.html  || true
            curl -sS -m 20 "$RENDER/Hyperwolf%20POS.html" > /tmp/render.html || true
            extract < /tmp/pages.html  > /tmp/pages.list
            extract < /tmp/render.html > /tmp/render.list
            if [ -s /tmp/pages.list ] && cmp -s /tmp/pages.list /tmp/render.list; then
              echo "Both hosts load the same $(wc -l < /tmp/pages.list) app sources, in the same order."
              break
            fi
            echo "attempt $i: pages=$(wc -l < /tmp/pages.list) sources, render=$(wc -l < /tmp/render.list) -- waiting for Pages to publish"
            sleep 15
            if [ "$i" = "40" ]; then
              echo "::error::the two hosts do not load the same app sources after 10 minutes."
              diff /tmp/pages.list /tmp/render.list || true
              exit 1
            fi
          done

          # Content spot-check. Absent only when Render could not precompile --
          # render.yaml says so out loud in that case and stamps it onto the page,
          # so this reports rather than fails.
          if curl -sSf -m 20 "$RENDER/build/precompiled-sources.txt" -o /tmp/sources.txt; then
            want=$(curl -sS -m 20 "$PAGES/pos/data.jsx" | shasum -a 256 | cut -d" " -f1)
            if grep -q "^$want  pos/data.jsx$" /tmp/sources.txt; then
              echo "Render compiled pos/data.jsx from exactly the bytes Pages serves ($want)."
            else
              echo "::error::Render's build of pos/data.jsx does not match the copy Pages serves."
              echo "::error::pages sha=$want"
              grep " pos/data.jsx$" /tmp/sources.txt || echo "::error::render has no record of pos/data.jsx at all"
              exit 1
            fi
          else
            echo "::warning::Render is serving a NON-PRECOMPILED build (no build/precompiled-sources.txt)."
            echo "::warning::The pages still transform their JSX in the browser. See the Render build log."
          fi
