<!DOCTYPE html>

<meta charset="UTF-8"/>

<title>Hyperwolf Driver + POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; background:#050505; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:0; height:0; }
  input::placeholder, textarea::placeholder { color:rgba(128,128,120,.7); }
  button { font-family:inherit; }
  a { color:inherit; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform: rotate(360deg); } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes hwscan { 0%,100% { transform: translateY(-92px); } 50% { transform: translateY(92px); } }
  @keyframes hwfloat { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,26px) scale(1.12); } }
  @keyframes hwtap { 0%,100% { transform: scale(1); } 50% { transform: scale(1.28); } }
  @keyframes hwring { 0%,100% { box-shadow: 0 0 0 3px var(--hw-accent,#FFD100), 0 0 0 4000px rgba(0,0,0,.34); } 50% { box-shadow: 0 0 0 6px var(--hw-accent,#FFD100), 0 0 0 4000px rgba(0,0,0,.34); } }
</style>
</head>
