<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hyperwolf POS — UI Refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button { font-family:inherit; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (min-width:1180px){ .tb-search { display:flex !important; } }
  /* The register's TENDER column owns the bottom-right corner, so the two floating
     dev widgets (app switcher + tour launcher) step left of the cart pane while the
     register is open — they sit in the gutter instead of on top of the primary CTA. */
  body[data-hw-float="clear-cart"] div[data-hw-switcher], body[data-hw-float="clear-cart"] #hwt-launch { right:428px !important; }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#15140f">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#15140f"/>
    <rect x="500" y="300" width="200" height="200" rx="44" fill="#FFD100"/>
    <text x="600" y="470" font-family="Inter, system-ui, sans-serif" font-size="150" font-weight="800" fill="#15140f" text-anchor="middle">W</text>
    <text x="600" y="585" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" letter-spacing="8" fill="#8a8a80" text-anchor="middle">HYPERWOLF POS</text>
  </svg>
</template>
<div id="root"></div>

<!-- The live-data seam. FIRST on purpose: it kicks off GET /api/state before the
     ~5MB of React + Babel below start downloading, so on the live path the payload
     has landed long before pos/data.jsx runs and no re-render is ever needed.
     Inert unless the page is served from a loopback origin — the GitHub Pages
     demo never fetches anything. See shared/hw-live.README.md. -->
<!-- The ONE bottom-left chrome column. Must load BEFORE hw-live.js and the six
     seam files: each of them still carries the old inline dock() as a fallback
     and the first loader wins, so loading this first is what makes the tray
     shape single-sourced. shared/hw-seam-dock.js explains the rest. -->
<!-- The stacking scale. MUST be first: every floating layer on this page reads it,
     and the plain-JS chrome mounts before any text/babel module has run. -->
<script src="shared/hw-z.js"></script>
<!-- The ONE wait format. Plain JS, no dependencies, and it must load before
     the check-in seam and the two screens that render a queue timer: they
     call window.HW_WAIT.shortWait and hold no copy of their own. -->
<script src="shared/hw-wait.js"></script>
<script src="shared/hw-seam-dock.js"></script>
<script src="shared/hw-live.js"></script>
<!-- The sub-category -> Weedmaps node mapping board, live from /api/taxonomy.
     Same loopback gate as hw-live.js, so the GitHub Pages demo never fetches. -->
<script src="shared/hw-live-taxonomy.js"></script>
<!-- The identity ledger: which Weedmaps customer ids map to which of our people,
     the per-order match with its tier and evidence, and verification in four
     states that must never render the same. Same arming rule as its siblings —
     inert wherever /api does not answer, so GitHub Pages is untouched. -->
<script src="shared/hw-live-identity.js"></script>
<!-- The counter check-in strip and the arrival matcher, including the LOSING
     candidates and their scores: an associate who cannot see why the runner-up
     lost cannot disagree with the machine. -->
<script src="shared/hw-live-checkin.js"></script>
<!-- Real order line items, from the raw Weedmaps payload the estate already
     retains. The sheet previously synthesised a cart from a hash of the order
     id, so its TOTAL contradicted the queue card on the same screen. -->
<script src="shared/hw-live-lines.js"></script>
<!-- Our product -> their product. The mapping engine has always been able to
     answer "is this SKU verified on Weedmaps"; nothing on a screen asked it, so
     the answer was a curl command. Shows the losing candidates with their
     scores, and keeps three different reasons a SKU is unmapped apart: no
     confident match, a human said no, and Weedmaps genuinely does not carry it
     -- the operator's next move differs for each. -->
<script src="shared/hw-live-mapping.js"></script>
<!-- Our regions -> their listings. This mapping was already live and correct
     and simply invisible. MODE is the point: `full` is the pickup storefront
     selling store on-hand stock; `kits` is delivery, selling the union of
     on-shift driver kits. Publishing them the same way is the classic mistake. -->
<script src="shared/hw-live-regions.js"></script>
<!-- What this customer has actually BOUGHT, across every Weedmaps account bound
     to them. pos/data.jsx models an order's contents as an integer (`items: 3`),
     so a "Suggested" button had no genuine input. This renders the real thing --
     and, more to the point, keeps three facts apart that an empty product table
     collapses into one: history / bought-nothing / we-have-no-line-data. A
     first-time visitor and a customer whose lines we never captured are not the
     same person to whoever is deciding what to suggest. -->
<script src="shared/hw-live-history.js"></script>
<!-- The RANKING on top of that history: repeat purchase, then category
     affinity, then brand affinity (GET /api/customer/suggestions). Loads AFTER
     hw-live-history.js on purpose -- it WRAPS HW.purchaseHistory rather than
     publishing a second one, so the two never race for the property. -->
<script src="shared/hw-live-suggest.js"></script>
<!-- THE OTHER RECO LANE: `for_guest` (own purchases, then look-alike cohort)
     over GET /api/reco/for-guest, for the "For this guest" card in the cart.
     Depends on HW.purchaseHistory above for identity resolution only -- see
     the file header for why it does not re-derive the merge rule itself. -->
<script src="shared/hw-live-guest-reco.js"></script>
<script src="shared/brands.js"></script>
<!-- The swap/upsell engine + the one adapter from this estate's product shape to it.
     Plain JS, loads before React. commerce-engine.js is a BUILT artefact from
     dev-hyperwolf/hyperwolf-commerce-logic — regenerate, never hand-edit. -->
<script src="shared/commerce-engine.js"></script>
<script src="shared/commerce-adapter.js"></script>
<script src="shared/merch-store.js"></script>
<script src="shared/commerce-governance.js"></script>
<script src="shared/app-nav.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="pos/dev-note.jsx"></script>
<script type="text/babel" src="shared/app-rail.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<!-- window.ScreenBoundary (contain) + window.CriticalBoundary (refuse). Must load
     AFTER the react UMD tag above and BEFORE any screen that wraps itself, which
     is every file below. There is no default behaviour: containing a failure is
     a decision the caller has to type. See the header of the file. -->
<script type="text/babel" src="shared/error-boundary.jsx"></script>
<!-- window.IdPhotoCapture + window.HWIdPhotos - the one ID/passport photo control.
     Every scan/create modal adopts it; nobody forks it. -->
<script type="text/babel" src="shared/id-photos.jsx"></script>
<script type="text/babel" src="pos/data.jsx"></script>
<!-- Demo data seeder: HWSeed.weedmapsOrder() / .product() / .customer() -->
<script src="shared/demo-seed.js" defer></script>
<!-- region table: supplies the per-van kit for governed substitution -->
<script type="text/babel" src="delivery/ddata.jsx"></script>
<script type="text/babel" src="pos/store.jsx"></script>
<script type="text/babel" src="pos/shell.jsx"></script>
<script type="text/babel" src="pos/verification.jsx"></script>
<script type="text/babel" src="pos/customer-extras.jsx"></script>
<script type="text/babel" src="pos/sales-panel.jsx"></script>
<script type="text/babel" src="pos/shell-store.jsx"></script>
<script type="text/babel" src="pos/shell-form.jsx"></script>
<script type="text/babel" src="pos/shells.jsx"></script>
<script type="text/babel" src="pos/product-shell.jsx"></script>
<script type="text/babel" src="pos/product-sheet.jsx"></script>
<script type="text/babel" src="pos/checkin.jsx"></script>
<script src="pos/image-slot.js"></script>
<script type="text/babel" src="pos/screen-catalog.jsx"></script>
<script type="text/babel" src="pos/screen-categories.jsx"></script>
<script type="text/babel" src="pos/screen-categories-edit.jsx"></script>
<script type="text/babel" src="pos/screen-orders.jsx"></script>
<script type="text/babel" src="pos/screen-cart.jsx"></script>
<script type="text/babel" src="pos/payment.jsx"></script>
<script type="text/babel" src="pos/drawer.jsx"></script>
<script type="text/babel" src="pos/screen-register.jsx"></script>
<script type="text/babel" src="pos/screen-stubs.jsx"></script>
<script type="text/babel" src="pos/screen-merch.jsx"></script>
<script type="text/babel" src="pos/screen-home.jsx"></script>
<script type="text/babel" src="pos/screen-aov.jsx"></script>
<!-- Brands: our brand DB <-> Weedmaps' brand DB. Upstream of product mapping,
     because Weedmaps serves products per brand. -->
<script type="text/babel" src="pos/screen-brands.jsx"></script>
<script type="text/babel" src="pos/screen-publish-gate.jsx"></script>
<!-- Cities: our regions -> ONE Weedmaps listing per city, two rooms behind it.
     Loads after pos/atoms.jsx and pos/dev-note.jsx because it renders with the
     shared atoms and the DevNote atoms — never a per-screen Mono, which threw
     "Mono is not defined" and blanked a screen. -->
<script type="text/babel" src="pos/screen-city-listing.jsx"></script>
<!-- Category map: our nine TOP-LEVEL categories -> Weedmaps' nodes, with ids.
     A different question from pos/screen-categories.jsx, which is the
     SUB-CATEGORY board. This one is the name lookup engine.py:862 actually
     performs at publish time, and the reason a SKU can go live on Weedmaps
     carrying no category at all.
     Loads after pos/atoms.jsx and pos/dev-note.jsx because it renders with the
     shared atoms and the DevNote atoms - never a per-screen Mono, which threw
     "Mono is not defined" and blanked a screen. -->
<script type="text/babel" src="pos/screen-category-map.jsx"></script>
<!-- Identity & binding: which customer a Weedmaps account resolves to, its
     audit trail, and the one real undo wmdemo/wm_binding.py offers (unbind).
     No bind control -- that is a deliberate backend decision, not a gap. -->
<script type="text/babel" src="pos/screen-identity-binding.jsx"></script>
<script type="text/babel" src="pos/app.jsx"></script>
<script src="shared/app-switcher.js"></script>
<script src="shared/tour-steps.js"></script>
<script src="shared/tour.js"></script>
<script src="shared/notes.js"></script>
<script src="build-stamp.js" defer></script>
</body>
</html>
