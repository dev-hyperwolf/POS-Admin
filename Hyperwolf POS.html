<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hyperwolf POS — UI Refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button { font-family:inherit; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (min-width:1180px){ .tb-search { display:flex !important; } }
  /* The register's TENDER column owns the bottom-right corner, so the two floating
     dev widgets (app switcher + tour launcher) step left of the cart pane while the
     register is open — they sit in the gutter instead of on top of the primary CTA. */
  body[data-hw-float="clear-cart"] div[data-hw-switcher], body[data-hw-float="clear-cart"] #hwt-launch { right:428px !important; }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#15140f">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#15140f"/>
    <rect x="500" y="300" width="200" height="200" rx="44" fill="#FFD100"/>
    <text x="600" y="470" font-family="Inter, system-ui, sans-serif" font-size="150" font-weight="800" fill="#15140f" text-anchor="middle">W</text>
    <text x="600" y="585" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" letter-spacing="8" fill="#8a8a80" text-anchor="middle">HYPERWOLF POS</text>
  </svg>
</template>
<div id="root"></div>

<!-- The live-data seam. FIRST on purpose: it kicks off GET /api/state before the
     ~5MB of React + Babel below start downloading, so on the live path the payload
     has landed long before pos/data.jsx runs and no re-render is ever needed.
     Inert unless the page is served from a loopback origin — the GitHub Pages
     demo never fetches anything. See shared/hw-live.README.md. -->
<script src="shared/hw-live.js"></script>
<!-- The sub-category -> Weedmaps node mapping board, live from /api/taxonomy.
     Same loopback gate as hw-live.js, so the GitHub Pages demo never fetches. -->
<script src="shared/hw-live-taxonomy.js"></script>
<!-- The identity ledger: which Weedmaps customer ids map to which of our people,
     the per-order match with its tier and evidence, and verification in four
     states that must never render the same. Same arming rule as its siblings —
     inert wherever /api does not answer, so GitHub Pages is untouched. -->
<script src="shared/hw-live-identity.js"></script>
<!-- The counter check-in strip and the arrival matcher, including the LOSING
     candidates and their scores: an associate who cannot see why the runner-up
     lost cannot disagree with the machine. -->
<script src="shared/hw-live-checkin.js"></script>
<script src="shared/brands.js"></script>
<!-- The swap/upsell engine + the one adapter from this estate's product shape to it.
     Plain JS, loads before React. commerce-engine.js is a BUILT artefact from
     dev-hyperwolf/hyperwolf-commerce-logic — regenerate, never hand-edit. -->
<script src="shared/commerce-engine.js"></script>
<script src="shared/commerce-adapter.js"></script>
<script src="shared/app-nav.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>

</html>
