<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RFID Scanning — Direction C (Operator-first)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:0; height:0; }
  button { font-family:inherit; }
  a { color:inherit; }
  h1, h2, h3, ul { margin:0; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform: rotate(360deg); } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  /* the read sweep on the handheld scan field */
  @keyframes rfidsweep { 0% { transform: translateY(0); opacity:.25 } 50% { transform: translateY(96px); opacity:1 } 100% { transform: translateY(0); opacity:.25 } }
  /* Designed for >=1280px. Both two-column layouts collapse to one below 1180. */
  @media (max-width: 1180px) {
    .rfid-2col { grid-template-columns: minmax(0,1fr) !important; }
    .rfid-pair { grid-template-columns: minmax(0,1fr) !important; }
  }
  /* Inside the paired study the supervisor pane is ~460px narrower, so its own
     two-column split collapses — the tables keep their real density instead of
     being squeezed into a column that would never exist on a real desk. */
  @media (max-width: 1760px) {
    .rfid-pair .rfid-2col { grid-template-columns: minmax(0,1fr) !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- plain JS, before React -->
<script src="../shared/brands.js"></script>
<script src="../shared/app-nav.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- the shared design system, unmodified -->
<script type="text/babel" src="../pos/tokens.jsx"></script>
<script type="text/babel" src="../pos/icons.jsx"></script>
<script type="text/babel" src="../pos/atoms.jsx"></script>
<script type="text/babel" src="../shared/app-rail.jsx"></script>
<script type="text/babel" src="../shared/states.jsx"></script>
<script type="text/babel" src="../shared/hd-format.jsx"></script>
<script type="text/babel" src="../shared/hd-ui.jsx"></script>

<!-- this direction -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="device.jsx"></script>
<script type="text/babel" src="handheld.jsx"></script>
<script type="text/babel" src="supervisor.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
