<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperdrive Logistics — layout directions</title>
<!-- Body background is painted by ThemeProvider (pos/tokens.jsx) from the live
     `bg` token, so it follows the operator's mode. It used to be pinned to a
     dark literal here, which showed through as a near-black gutter in light
     mode. The `a` rules were a cool blue and were dead anyway — the only
     anchor on this page is the rail's icon tile, which colors itself. -->
<style>html,body{margin:0}</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0D0D0A">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0D0D0A"/>
    <g transform="translate(600,400)">
      <circle r="150" fill="none" stroke="#FFD100" stroke-width="10" stroke-dasharray="22 16"/>
      <circle cx="-46" cy="-30" r="16" fill="#E8675B"/><circle cx="40" cy="10" r="16" fill="#E0A53A"/><circle cx="-10" cy="55" r="16" fill="#46C07E"/>
    </g>
    <text x="600" y="660" text-anchor="middle" font-family="Inter,sans-serif" font-size="52" font-weight="800" fill="#fff">Logistics</text>
  </svg>
</template>
<div id="root"></div>

<!-- The stacking scale. MUST be first: every floating layer on this page reads it,
     and the plain-JS chrome mounts before any text/babel module has run. -->
<script src="shared/hw-z.js"></script>
<script src="shared/brands.js"></script>
<script src="shared/app-nav.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- window.ScreenBoundary (CONTAIN) + window.CriticalBoundary (REFUSE).
     PLAIN JS, after React and BEFORE babel: the file is pure
     React.createElement with no JSX, and every text/babel screen below is
     transformed and executed later, so it must already be defined when the
     first screen runs -- a screen referencing an undefined boundary throws
     "type is invalid" and white-screens the page.
     Logistics CONTAINS per unit: see logistics/lviews.jsx. -->
<script src="shared/error-boundary.jsx"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="shared/app-rail.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<script type="text/babel" src="pos/data.jsx"></script>
<script type="text/babel" src="delivery/ddata.jsx"></script>
<script type="text/babel" src="delivery/dmap.jsx"></script>
<script type="text/babel" src="logistics/ldata.jsx"></script>
<script type="text/babel" src="logistics/lparts.jsx"></script>
<script type="text/babel" src="logistics/lparts2.jsx"></script>
<script type="text/babel" src="logistics/lorder.jsx"></script>
<script type="text/babel" src="logistics/lviews.jsx"></script>

<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<window.LogisticsApp />);
</script>
<script src="shared/app-switcher.js"></script>
<script src="shared/tour-steps.js"></script>
<script src="shared/tour.js"></script>
<script src="shared/notes.js"></script>
</body>
</html>
