<link rel="preconnect" href="https://fonts.googleapis.com"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button, select, input { font-family:inherit; }
  a { color:#7A5A00; }
  a:hover { color:#0F0F0C; }
  .hd-2col { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:20px; }
  @media (max-width:1180px){ .hd-2col { grid-template-columns:minmax(0,1fr); } }
  .hd-prod { display:grid; grid-template-columns:minmax(280px,380px) minmax(0,1fr); gap:20px; }
  @media (max-width:1100px){ .hd-prod { grid-template-columns:minmax(0,1fr); } }
  .hd-split { display:grid; grid-template-columns:minmax(0,1fr) 520px; }
  @media (max-width:1200px){ .hd-split { grid-template-columns:minmax(0,1fr); } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
</style>
</head>
