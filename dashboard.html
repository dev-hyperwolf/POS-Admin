<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperwolf × Weedmaps — Integration Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
/* ── Theme ──────────────────────────────────────────────────────────────────
   `hw-pos-theme` in localStorage is the platform-wide key that pos/tokens.jsx
   reads and writes for every other console. This page is plain HTML, so it
   mirrors that contract by hand: seed from the key before first paint (no
   flash of the wrong mode), write back on toggle, and follow the key when
   another tab changes it. The palette itself lives in the :root blocks below.
   ──────────────────────────────────────────────────────────────────────── */
(function(){
  var SUN = '<path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="3.6"/>';
  var MOON = '<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z"/>';
  function read(){ try { return localStorage.getItem("hw-pos-theme")==="dark"?"dark":"light"; } catch(e){ return "light"; } }
  function paint(m){
    document.documentElement.setAttribute("data-hw-theme", m);
    var b = document.getElementById("themeIcon");
    if (b) b.innerHTML = (m==="dark") ? SUN : MOON;
    var l = document.getElementById("themeLbl");
    if (l) l.textContent = (m==="dark") ? "Light" : "Dark";
  }
  window.hwTheme = read;
  window.hwSetTheme = function(m){ m = (m==="dark")?"dark":"light"; try { localStorage.setItem("hw-pos-theme", m); } catch(e){} paint(m); };
  window.hwToggleTheme = function(){ window.hwSetTheme(read()==="dark"?"light":"dark"); };
  paint(read());
  document.addEventListener("DOMContentLoaded", function(){ paint(read()); });
  window.addEventListener("storage", function(ev){ if (ev.key==="hw-pos-theme") paint(read()); });
})();
</script>
<style>
/* ── Palette ────────────────────────────────────────────────────────────────
   Every value below is copied from pos/tokens.jsx. The token it comes from is
   named in the comment. Nothing in this file may introduce a colour that is not
   here — the one sanctioned exception is the rgba(128,128,120,…) scrollbar /
   placeholder chrome that every entry page in this repo carries verbatim.
   Local var names are kept so no rule below had to be rewritten to be re-sourced.
   ──────────────────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  /* grounds */
  --bg:#F4F2EC;                       /* bg      */
  --paper:#FAF9F5;                    /* surface2 — nested card / row hover */
  --surface:#FFFFFF;                  /* surface */
  --well:#F1EFE9;                     /* surface3 — chips, wells, plates    */
  /* the nav chrome is near-black in BOTH modes, so it takes the rail tokens */
  --rail:#13130F;                     /* rail        */
  --railBright:#FFFFFF;               /* railBright  */
  --railInk:rgba(255,255,255,.72);    /* railInk     */
  --railHover:rgba(255,255,255,.06);  /* railHover   */
  --railActive:rgba(255,209,0,.14);   /* railActive  */
  --hairD:rgba(255,255,255,.08);      /* railHair    */
  /* two derived rail tiers: the rail token set has no dim/wash step of its own */
  --railDim:color-mix(in srgb, var(--railBright) 46%, transparent);
  --railWash:color-mix(in srgb, var(--railBright) 12%, transparent);
  /* the rail is dark in both modes, so its signals are the DARK signal pair */
  --railGood:#46C07E; --railWarn:#E0A53A; --railBad:#E8675B; --railInfo:#6A99EC;
  /* ink */
  --ink:#0F0F0C;                      /* ink      */
  --ink2:#2A2A26;                     /* ink2     */
  --ink3:rgba(15,15,12,.60);          /* inkDim   */
  --ink4:rgba(15,15,12,.42);          /* inkMute  */
  --onInk:var(--surface);             /* text on an ink plate (HANDOFF item 0) */
  --onInkDim:color-mix(in srgb, var(--surface) 62%, transparent);
  /* hairlines */
  --hair:rgba(15,15,12,.08);          /* hairline  */
  --hair2:rgba(15,15,12,.14);         /* hairline2 */
  /* accent */
  --accent:#FFD100;                   /* accent      */
  --accentInk:#1A1400;                /* accentInk   */
  --accentSoft:#FFF4B8;               /* accentSoft  */
  --accentText:#7A5A00;               /* accentText — the ONLY accent-coloured text */
  /* signals */
  --good:#1F8A4F;  --goodSoft:#E2F2E8;
  --warn:#C07A12;  --warnSoft:#FBEFD6;
  --bad:#C0392B;   --badSoft:#F8E2DF;
  --info:#2C5BB8;  --infoSoft:#E3ECFA;
  /* the system has ONE red. `alert` was a second, hotter red; it now aliases bad. */
  --alert:#C0392B; --alertSoft:#F8E2DF;
  --violet:#6D4AC8;                   /* hue.violet — API-domain wayfinding */
  /* fields, scrim */
  --field:#FFFFFF; --fieldBorder:rgba(15,15,12,.18);
  --scrim:rgba(20,18,12,.42);         /* scrim */
  /* type */
  --sans:"Inter", -apple-system, system-ui, sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
  /* shadows */
  --sh1:0 1px 0 rgba(15,15,12,.04), 0 1px 2px rgba(15,15,12,.05);   /* shadowSm */
  --sh2:0 1px 0 rgba(15,15,12,.04), 0 6px 18px rgba(15,15,12,.07);  /* shadowMd */
  --sh3:0 1px 0 rgba(15,15,12,.04), 0 18px 44px rgba(15,15,12,.14); /* shadowLg */
}
:root[data-hw-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0D0A; --paper:#211F18; --surface:#1A1A14; --well:#28261D;
  --rail:#070705; --railBright:#FBFAF4; --railInk:rgba(245,243,236,.66);
  --railHover:rgba(255,255,255,.05); --railActive:rgba(255,209,0,.14);
  --hairD:rgba(255,255,255,.07);
  --ink:#F5F3EA; --ink2:#D9D6CA;
  --ink3:rgba(245,243,234,.60); --ink4:rgba(245,243,234,.40);
  --hair:rgba(245,243,234,.09); --hair2:rgba(245,243,234,.15);
  --accent:#FFD100; --accentInk:#1A1400; --accentSoft:rgba(255,209,0,.15);
  --accentText:#FFD100;
  --good:#46C07E;  --goodSoft:rgba(70,192,126,.15);
  --warn:#E0A53A;  --warnSoft:rgba(224,165,58,.15);
  --bad:#E8675B;   --badSoft:rgba(232,103,91,.16);
  --info:#6A99EC;  --infoSoft:rgba(106,153,236,.16);
  --alert:#E8675B; --alertSoft:rgba(232,103,91,.16);
  --violet:#B79CFF;
  --field:#15150F; --fieldBorder:rgba(245,243,234,.22);
  --scrim:rgba(0,0,0,.62);
  --sh1:0 1px 0 rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.40);
  --sh2:0 1px 0 rgba(0,0,0,.30), 0 8px 22px rgba(0,0,0,.45);
  --sh3:0 1px 0 rgba(0,0,0,.30), 0 22px 50px rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,128,120,.32);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,120,.5);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
input::placeholder,textarea::placeholder{color:rgba(128,128,120,.7)}

/* ── Shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-columns:200px 1fr var(--dockw,352px);grid-template-rows:52px auto 1fr;height:100vh;transition:grid-template-columns .18s ease}
.app.dock-collapsed{--dockw:44px}
.topbar{grid-column:1/-1;background:var(--rail);color:var(--railBright);display:flex;align-items:center;gap:14px;padding:0 14px 0 0;z-index:40;border-bottom:1px solid var(--hairD)}
.brand{display:flex;align-items:center;gap:10px;width:200px;padding:0 14px;height:100%;flex:0 0 auto}
.logo{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 auto}
.brand b{font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--railBright);line-height:1.05}
.brand span{font-size:9.5px;color:var(--railDim);letter-spacing:.06em;text-transform:uppercase}
.tb-stats{display:flex;align-items:stretch;gap:0;height:100%;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tb-stats::-webkit-scrollbar{display:none}
.tstat{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px;border-left:1px solid var(--hairD);white-space:nowrap;flex:0 0 auto}
.tstat .k{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--railDim);display:flex;align-items:center;gap:5px}
.tstat .v{font-size:13px;font-weight:600;color:var(--railBright);font-family:var(--mono);font-variant-numeric:tabular-nums}
.tstat .v.g{color:var(--railGood)}.tstat .v.a{color:var(--accent)}.tstat .v.r{color:var(--railBad)}
.tb-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tbtn{height:32px;padding:0 11px;display:inline-flex;align-items:center;gap:7px;background:var(--railHover);border:1px solid var(--hairD);border-radius:8px;color:var(--railBright);font-size:12px;font-weight:600}
.tbtn:hover{background:var(--railWash)}
.tbtn.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.tbtn kbd{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10px;background:var(--railWash);padding:1px 5px;border-radius:4px;color:var(--railInk)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.live{background:var(--railGood);--pulse:var(--railGood);box-shadow:0 0 0 0 color-mix(in srgb, var(--railGood) 70%, transparent);animation:pulseDot 2.2s infinite}
/* --pulse lets one keyframe serve both the green live dot and the red spine beat. */
@keyframes pulseDot{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--pulse) 60%, transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pollpip{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.25}
.pollpip.on{opacity:1;transition:opacity .1s}
/* status spine */
.spine{grid-column:1/-1;display:flex;align-items:center;gap:0;height:36px;background:var(--paper);border-bottom:1px solid var(--hair);padding:0 6px 0 14px;overflow-x:auto;scrollbar-width:none;z-index:20}
.spine::-webkit-scrollbar{display:none}
.spine.sev-warn{background:var(--warnSoft)}.spine.sev-alert{background:var(--alertSoft)}
.spine .seg{display:inline-flex;align-items:center;gap:7px;padding:0 14px;height:100%;border:none;background:transparent;font-size:12px;color:var(--ink2);white-space:nowrap;border-right:1px solid var(--hair);font-weight:600}
.spine .seg:first-child{padding-left:0}
.spine .seg b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.spine .seg.click{cursor:pointer}.spine .seg.click:hover{color:var(--ink)}
.spine .seg.a{color:var(--alert)}.spine .seg.a b{color:var(--alert)}
.spine .seg.w{color:var(--warn)}.spine .seg.w b{color:var(--warn)}
.spine .seg.g b{color:var(--good)}
.spine .hb{width:9px;height:9px;border-radius:50%;background:var(--good);flex:0 0 auto}
.spine .hb.warn{background:var(--warn)}.spine .hb.alert{background:var(--alert);--pulse:var(--alert);animation:pulseDot 1.6s infinite}
.spine .sp{flex:1;border:none;min-width:12px}

/* ── Rail ─────────────────────────────────────────── */
.rail{background:var(--rail);color:var(--railInk);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;z-index:30}
.rail::-webkit-scrollbar-thumb{background:rgba(128,128,120,.32)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:transparent;border:none;color:var(--railInk);font-size:12.5px;font-weight:500;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--railHover);color:var(--railBright)}
.nav-item.on{background:var(--railActive);color:var(--railBright);font-weight:600}
.nav-item.on::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:99px}
.nav-item svg{flex:0 0 auto}
.nav-item .cnt{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--railWash);color:var(--railInk)}
.nav-item .cnt.alert{background:var(--alert);color:var(--onInk)}
.rail .rl-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--railDim);padding:12px 10px 5px;font-weight:700}
.rail .spring{flex:1}
.rail .foot{border-top:1px solid var(--hairD);padding-top:8px;margin-top:6px}

/* ── Main ─────────────────────────────────────────── */
.main{overflow-y:auto;overflow-x:hidden;padding:14px;background:var(--bg);position:relative}
.ws{display:none}
.ws.on{display:block}
.ws-hd{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.ws-hd h1{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
.ws-hd .sub{font-size:11.5px;color:var(--ink3)}
.ws-hd .sp{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.span-all{grid-column:1/-1}
@media(max-width:1200px){.g3{grid-template-columns:1fr 1fr}.g-2-1,.g-1-2{grid-template-columns:1fr}}

/* ── Panel ─────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--sh1);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--hair);flex:0 0 auto}
.panel-hd{flex-wrap:nowrap}
.panel-hd .pt{font-size:12px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;min-width:0}
.panel-hd .pt>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-hd .badge{flex:0 0 auto;white-space:nowrap}
.panel-hd .pt .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:9.5px;font-weight:700;color:var(--ink4);background:var(--well);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;flex:0 0 auto}
.panel-hd .sp{flex:1}
.panel-hd .badge{font-size:10px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:20px;background:var(--well);color:var(--ink2);border:1px solid var(--hair)}
.pinfo{width:22px;height:22px;border-radius:6px;border:1px solid var(--hair);background:var(--paper);color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.pinfo:hover{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.panel-bd{padding:11px 12px;overflow:auto;min-height:0}
.panel-bd.tight{padding:0}
.panel-bd.scroll{max-height:var(--ph,300px)}

/* ── Generic content styling for injected innerHTML ── */
.panel-bd table{width:100%;border-collapse:collapse;font-size:11.5px}
.panel-bd th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--surface);z-index:2}
.panel-bd td{padding:6px 8px;border-bottom:1px solid var(--hair);vertical-align:middle}
.panel-bd tr:last-child td{border-bottom:none}
.panel-bd tbody tr:hover{background:var(--paper)}
.panel-bd td.num,.panel-bd th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel-bd .muted{color:var(--ink3)}
.panel-bd h4{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;line-height:1.5;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.ok{background:var(--goodSoft);color:var(--good)}.pill.ok .d{background:var(--good)}
.pill.warn{background:var(--warnSoft);color:var(--warn)}.pill.warn .d{background:var(--warn)}
.pill.bad{background:var(--badSoft);color:var(--bad)}.pill.bad .d{background:var(--bad)}
.pill.info{background:var(--infoSoft);color:var(--info)}.pill.info .d{background:var(--info)}
.pill.alert{background:var(--alertSoft);color:var(--alert)}.pill.alert .d{background:var(--alert)}
.pill.ghost{background:var(--well);color:var(--ink3);border:1px solid var(--hair)}.pill.ghost .d{background:var(--ink4)}
.pill.live{background:var(--accentSoft);color:var(--accentText)}.pill.live .d{background:var(--accent)}

.krow{display:flex;gap:8px;flex-wrap:wrap}
.kpi{flex:1;min-width:76px;background:var(--paper);border:1px solid var(--hair);border-radius:9px;padding:8px 10px}
.kpi .kl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv{font-size:19px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .kv small{font-size:11px;color:var(--ink3);font-weight:600}
.kpi.acc{border-color:var(--accent);background:var(--accentSoft)}
.kpi.alert{border-color:var(--alert);background:var(--alertSoft)}.kpi.alert .kv{color:var(--alert)}

.row-alert{position:relative;background:var(--alertSoft)!important;box-shadow:inset 3px 0 0 var(--alert)}
.row-warn{position:relative;background:var(--warnSoft)!important;box-shadow:inset 3px 0 0 var(--warn)}

.btn{height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;border-radius:8px;border:1px solid var(--hair2);background:var(--surface);color:var(--ink);font-size:12px;font-weight:600}
.btn:hover{border-color:var(--ink3);background:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--onInk)}.btn.dark:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.sm{height:26px;padding:0 9px;font-size:11px}
.btn.xs{height:22px;padding:0 8px;font-size:10.5px;gap:4px}
.btn.gd{color:var(--good);border-color:var(--good)}.btn.gd:hover{background:var(--goodSoft)}
.btn.rd{color:var(--bad);border-color:var(--bad)}.btn.rd:hover{background:var(--badSoft)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.busy{pointer-events:none;position:relative;color:transparent!important}
.btn.busy::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;color:var(--ink)}
.btn.primary.busy::after{color:var(--accentInk)}
@keyframes spin{to{transform:rotate(360deg)}}
.fld{width:100%;height:30px;padding:0 10px;border:1px solid var(--fieldBorder);border-radius:8px;background:var(--field);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink)}
.fld:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft);background:var(--field)}
textarea.fld{height:auto;padding:8px 10px;line-height:1.5;resize:vertical}
.row{display:flex;align-items:center;gap:8px}
.lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;margin-bottom:4px;display:block}

/* empty states */
.empty{padding:20px 16px;text-align:center;color:var(--ink3);border:1.5px dashed var(--hair2);border-radius:10px;background:var(--paper)}
.empty .ei{color:var(--ink4);margin-bottom:6px}
.empty b{color:var(--ink2);font-size:12.5px;display:block;margin-bottom:3px}
.empty p{margin:0 0 10px;font-size:11.5px;line-height:1.5}

/* ── Call feed dock ─────────────────────────────────── */
.dock{background:var(--rail);color:var(--railInk);display:flex;flex-direction:column;z-index:30;overflow:hidden}
.dock-hd{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--hairD);flex:0 0 auto}
.dock-hd .t{font-size:11.5px;font-weight:700;color:var(--railBright);display:flex;align-items:center;gap:7px}
.app.dock-collapsed .dock-hd{padding:9px 6px;justify-content:center}
.app.dock-collapsed .dock-body,.app.dock-collapsed .dock-sum,.app.dock-collapsed .dock-filt,.app.dock-collapsed .dock-hd .t span,.app.dock-collapsed .dock-hd .pausebtn{display:none}
.collapse-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--hairD);background:var(--railHover);color:var(--railInk);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

.dock-filt{display:flex;gap:4px;padding:7px 9px;flex-wrap:wrap;border-bottom:1px solid var(--hairD);flex:0 0 auto}
.fchip{font-size:9.5px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:20px;background:var(--railHover);border:1px solid var(--hairD);color:var(--railInk)}
.fchip.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.pausebtn{margin-left:auto;font-size:10px;font-weight:700;padding:3px 9px;border-radius:7px;border:1px solid var(--hairD);background:var(--railHover);color:var(--railInk);display:inline-flex;align-items:center;gap:5px}
.pausebtn.paused{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.dock-body{flex:1;overflow-y:auto;padding:5px 7px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px}
.dock-body::-webkit-scrollbar-thumb{background:rgba(128,128,120,.32)}
.call{display:grid;grid-template-columns:14px 42px 1fr auto;gap:7px;align-items:center;padding:4px 6px;border-radius:6px;border-left:2px solid transparent}
.call:hover{background:var(--railHover)}
.call.new{animation:callIn .5s ease}
@keyframes callIn{0%{background:color-mix(in srgb, var(--accent) 28%, transparent);transform:translateX(6px)}100%{background:transparent;transform:none}}
.call .arw{font-size:11px;font-weight:800}
.call.out{border-left-color:var(--railInfo)}.call.out .arw{color:var(--railInfo)}
.call.in{border-left-color:var(--railWarn)}.call.in .arw{color:var(--railWarn)}
.call .meth{font-size:9.5px;font-weight:800;color:var(--railInk)}
.call .pth{color:var(--railBright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.call .pth .k{font-size:8.5px;color:var(--railDim)}
.call .meta{display:flex;align-items:center;gap:6px;justify-self:end;white-space:nowrap}
.call .st{font-size:9.5px;font-weight:800}
.call .st.ok{color:var(--railGood)}.call .st.err{color:var(--railBad)}.call .st.pend{color:var(--accent)}
.call .ms{font-size:9.5px;color:var(--railDim)}

/* ── Popover / drawer / modal ───────────────────────── */
.pop{position:fixed;z-index:1200;width:340px;background:var(--surface);border:1px solid var(--hair2);border-radius:12px;box-shadow:var(--sh3);overflow:hidden}

let fieldTab='products';
const SYNC_ENTITIES=[['products','Products'],['regions','Regions'],['customers','Customers'],['promos','Promotions'],['taxonomy','Brands & Categories']];
// [ourField, wmField, mode, direction, note]  mode: auto|semi|manual|computed  dir: out|in|both
const PARAM_MAP={
 products:{our:'Hyperwolf product (Blaze SKU)',wm:'WM Menu Item',rows:[
  ['sku','external_id','auto','out','Load-bearing key — WM recognises us by it. Never changes.'],
  ['name','name','auto','out','Verbatim.'],
  ['price','price','auto','out','Cents → dollars; card fee / rounding applied.'],
  ['weight {value,unit}','weight','auto','out','Normalised to WM units.'],
  ['thc','potency_thc','auto','out','From batches — a real min–max range, not a guess.'],
  ['category','wm_category','manual','out','Mapped to WM taxonomy (see Brands & Categories).'],
  ['subcategory','discovery_tags[]','semi','out','Auto-suggested, human-confirmed.'],
  ['brand','brand_id','manual','out','Curated by a human — never auto-overwritten.'],
  ['inventory (store)','availability','auto','out','Drives the Pickup listing.'],
  ['kit membership','integratorMetadata.driver_ok','auto','out','Drives Delivery eligibility.'],
  ['wm_product_id','product link','semi','both','Matcher suggests → human approves in Catalog Mapping.'],
 ]},
 regions:{our:'Delivery region',wm:'WM service area / listing',rows:[
  ['region name','service_area label','manual','out','Set once per region.'],
  ['zips[]','zip_codes[]','auto','out','Draft webhook routes on these live.'],
  ['drivers[]','integratorMetadata.driver_pool','auto','out','Who can fulfil in this region.'],
  ['on_shift status','availability gate','auto','out','Off-shift → its kit drops from Delivery in <1s.'],
  ['listing binding','wmid','manual','out','Which listing (Pickup/Delivery) this region feeds.'],
 ]},
 customers:{our:'Identity (customer ledger)',wm:'WM order customer',rows:[
  ['device fingerprint','—','auto','in','Primary merge signal; never leaves us.'],
  ['phone','customer.phone','auto','in','Verified match → merge.'],
  ['email','customer.email','auto','in','Verified match → merge.'],
  ['order history / LTV','—','auto','in','Built from Create webhooks.'],
  ['tier','—','computed','in','first-timer / returning / blocked — drives promo + fraud rules.'],
  ['fraud verdict','order status (CANCELED_SELLER)','auto','out','Auto-cancel; ambiguous cases → manual review.'],
 ]},
 promos:{our:'Internal promo (Promotions module)',wm:'WM promotion',rows:[
  ['promo link','wm_promotion_id','manual','both','Link WM promo ↔ our internal promo so redemptions reconcile.'],
  ['name','name','auto','both','Mirrored from WM on a 60s pull.'],
  ['reward / amount','discount','auto','in','Read from WM.'],
  ['trigger / kind','type','semi','in','Mapped to our rule vocabulary.'],
  ['code','code','auto','in','For code-gated promos.'],
  ['target (products/category)','applies_to','manual','both','Confirm the WM promo hits the right SKUs.'],
  ['schedule','start / end','auto','in','Read from WM.'],
 ]},
};
function modePill(m){const map={auto:['ok','Auto'],semi:['live','1-click'],manual:['info','Manual'],computed:['ghost','Computed']};const c=map[m]||map.manual;return pill(c[0],c[1],false);}
function dirArrow(d){return d==='both'?'<span title="two-way" class="mono" style="color:var(--info)">⇄ WM</span>':d==='in'?'<span title="WM → us" class="mono" style="color:var(--warn)">← WM</span>':'<span title="us → WM" class="mono" style="color:var(--good)">→ WM</span>';}
function wsFields(){
 return `<div class="maptabs" id="fieldTabs">${SYNC_ENTITIES.map(e=>`<button class="maptab ${e[0]===fieldTab?'on':''}" onclick="setFieldTab('${e[0]}')"><b>${e[1]}</b><span>${e[0]==='taxonomy'?'WM catalog taxonomy':'parameter ↔ Weedmaps'}</span></button>`).join('')}</div>
  <div class="grid" style="grid-template-columns:1fr;margin-top:12px"><div id="fieldsBody"></div></div>`;
}
function setFieldTab(t){fieldTab=t;document.querySelectorAll('#fieldTabs .maptab').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick').includes("'"+t+"'")));renderFields();}
function renderFields(){
 const host=$('fieldsBody');if(!host)return;
 if(fieldTab==='taxonomy'){host.innerHTML=taxonomyPanels();return;}
 const m=PARAM_MAP[fieldTab];
 const counts={auto:0,semi:0,manual:0,computed:0};m.rows.forEach(r=>counts[r[2]]++);
 host.innerHTML=panelHTML({title:m.our+'  →  '+m.wm,n:'fields',ex:'ladders',hdextra:`<span class="hint">${m.rows.length} parameters · <b style="color:var(--good)">${counts.auto} auto</b> · <b style="color:var(--accentText)">${counts.semi} 1-click</b> · <b style="color:var(--info)">${counts.manual} manual</b></span>`,body:`
   <table><thead><tr><th>Our parameter</th><th>Sync</th><th>Weedmaps parameter</th><th>How it maps</th><th>Notes</th></tr></thead><tbody>
   ${m.rows.map(r=>`<tr><td class="mono" style="font-weight:600">${r[0]}</td><td>${dirArrow(r[3])}</td><td class="mono" style="color:var(--ink2)">${r[1]}</td><td>${modePill(r[2])}</td><td class="muted" style="font-size:10.5px">${r[4]}</td></tr>`).join('')}
   </tbody></table>
   <div class="hint" style="margin-top:9px"><b>Auto</b> = synced with no human. <b>1-click</b> = matcher proposes, you confirm. <b>Manual</b> = a person sets/curates it (WM discards curation if we overwrite it). <b>Computed</b> = we derive it, never sent to WM.</div>`});
}
function taxRows(list){return list.map(t=>`<tr class="${t[1]?'':'row-warn'}"><td style="font-weight:600">${t[0]}</td><td>${dirArrow('out')}</td><td class="mono muted">${t[1]||'— unmapped —'}</td><td>${modePill(t[2])}</td><td>${t[1]?pill('ok','mapped',false):pill('warn','needs link',false)}</td></tr>`).join('');}
function taxonomyPanels(){
 const brandUn=TAXONOMY.brands.filter(b=>!b[1]).length;
 return `<div class="grid g3">
  ${panelHTML({title:'Categories → WM',n:'tax',body:`<table><thead><tr><th>Ours</th><th>Sync</th><th>WM category</th><th>Mode</th><th></th></tr></thead><tbody>${taxRows(TAXONOMY.categories)}</tbody></table>`})}
  ${panelHTML({title:'Sub-categories → WM tags',n:'tax',body:`<table><thead><tr><th>Ours</th><th>Sync</th><th>WM discovery tag</th><th>Mode</th><th></th></tr></thead><tbody>${taxRows(TAXONOMY.subcategories)}</tbody></table>`})}
  ${panelHTML({title:'Brands → WM catalog',n:'tax',badge:brandUn?brandUn+' unlinked':'',body:`<table><thead><tr><th>Ours</th><th>Sync</th><th>WM brand</th><th>Mode</th><th></th></tr></thead><tbody>${taxRows(TAXONOMY.brands)}</tbody></table><div class="hint" style="margin-top:8px">Brand links are human-curated in WM\u2019s Brand Catalog. Unlinked brands still sell, but lose brand-page placement & ML matches.</div>`})}
 </div>`;
}

.tstep-n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10px;font-weight:800;color:var(--ink4)}
.tstep-t{font-size:12px;font-weight:700;line-height:1.25;margin-bottom:2px}
.tstep-d{font-size:10.5px;color:var(--ink3);line-height:1.35}
.tconn{width:26px;display:flex;align-items:center;justify-content:center;position:relative}
.tconn::before{content:"";height:2px;width:100%;background:var(--hair2)}
.tconn .tpulse{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0;left:0}
.tconn.flow .tpulse{opacity:1;animation:pulseTravel .4s ease forwards}
@keyframes pulseTravel{from{left:0}to{left:calc(100% - 8px)}}
.tconn.flow::before{background:var(--accent)}
/* automation ladders */
.ladblock{padding:9px 0;border-bottom:1px solid var(--hair)}
.ladblock:last-of-type{border-bottom:none}
.ladbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--well);gap:2px}
.ladseg{transition:flex .3s}
.ladseg.auto,.sw.auto{background:var(--good)}
.ladseg.ai,.sw.ai{background:var(--accent)}
.ladseg.manual,.sw.manual{background:var(--info)}
.ladseg.unmapped,.sw.unmapped{background:var(--bad)}
.ladleg{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:10.5px;color:var(--ink3)}
.ladleg .li{display:flex;align-items:center;gap:5px}
.ladleg b{color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
/* inbox */
.inbox-item{padding:10px 12px;border-radius:10px;margin-bottom:8px}
.modref{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--infoSoft);background:var(--infoSoft);border-radius:9px;color:var(--ink2);font-size:11.5px;line-height:1.5}
.modref svg{color:var(--info);flex:0 0 auto;margin-top:1px}
.modref u{text-decoration-color:var(--info)}
.pband{display:flex;background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.pband .s{flex:1;padding:10px 15px;border-left:1px solid var(--hair);min-width:0}
.pband .s:first-child{border-left:none}
.pband .s .l{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pband .s .v{font-size:19px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:3px;line-height:1}
.pband .s .v small{font-size:11px;color:var(--ink3)}
.echip{flex:0 0 auto}
.echip .ei{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
/* territory map */
.terr{position:absolute;border-radius:16px;border:2px solid var(--ink);background:var(--surface);box-shadow:var(--sh2);padding:9px 11px;cursor:pointer;transition:box-shadow .12s,transform .12s}
.terr:hover{transform:translateY(-1px);box-shadow:var(--sh3)}
.terr .tn{font-size:12.5px;font-weight:800}
.terr .tz{font-size:9px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink3);margin-top:1px}
.terr .tpins{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.terr .tpin{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:1px 5px;border-radius:20px;background:var(--well)}
.terr .tpin .pd{width:6px;height:6px;border-radius:50%}
.terr.store{border-color:var(--warn);border-style:dashed}
.terr-listing{position:absolute;border-radius:12px;border:1.5px solid var(--hair2);background:var(--ink);color:var(--onInk);padding:10px 12px;width:150px;box-shadow:var(--sh2)}
.terr-listing .ll{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--onInkDim);font-weight:800}
.terr-listing .lv{font-size:14px;font-weight:800;margin-top:2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.terr-listing .ld{font-size:10px;color:var(--onInkDim);margin-top:2px}
.terr-ocean{position:absolute;left:0;bottom:0;font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.1em;text-transform:uppercase;transform:rotate(-32deg);transform-origin:left bottom}
</style>
<script>
/* ══════════════════════════════════════════════════════════════════
   RENDERERS  — populate slot ids (replaceable by verified renderers)
   ══════════════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
const money=n=>'$'+Number(n).toFixed(2);
const ago=t=>{const s=Math.floor((Date.now()-t)/1000);if(s<60)return s+'s ago';const m=Math.floor(s/60);if(m<60)return m+'m ago';return Math.floor(m/60)+'h ago';};
const set=(id,html)=>{const el=$(id);if(el)el.innerHTML=html;};
function pill(kind,txt,dot=true){return `<span class="pill ${kind}">${dot?'<span class="d"></span>':''}${txt}</span>`;}

function renderAll(){
 renderTopbar();renderDock();
 // overview
 if(curWs==='overview'){renderOverview();}
 if(curWs==='orderpath'){renderFlow();renderOrders();}
 if(curWs==='listings'){renderListings();renderZip(true);}
 if(curWs==='mapping'){renderMapping();}
 if(curWs==='inventory'){renderStock();renderKits();renderBatches();renderReservations();}
 if(curWs==='trust'){renderIdentity();renderPromos();renderRegistry();}
 if(curWs==='observ'){renderLog();renderSync('syncStatus');}
 if(curWs==='dev'){renderInspector();renderSync('syncStatus2');}
 if(curWs==='map'){renderMap();}
 if(curWs==='fields'){renderFields();}
 renderSpine();
}

/* ── Fulfillment-aware availability (Pickup ≠ Delivery) ── */
function sellDelivery(sku){const c=CATALOG.find(x=>x.sku===sku);return !!(c&&c.wm_product_id&&STATE.union.includes(sku));}
function sellPickup(sku){const c=CATALOG.find(x=>x.sku===sku);return !!(c&&c.wm_product_id&&c.inventory>0);}
function pickupCount(){return CATALOG.filter(c=>sellPickup(c.sku)).length;}
function deliveryCount(){return CATALOG.filter(c=>sellDelivery(c.sku)).length;}

/* ── Attention model — decisions needing a human, by severity ── */
function collectAttention(){
 const a=[];
 STATE.mapping.wm_missing.forEach(m=>a.push({sev:'alert',tag:'Unmapped SKU',title:m.name+' can’t sell',why:m.reason,ws:'mapping',action:{label:'Find WM match',fn:`searchWMFor('${m.sku}')`}}));
 STATE.identity.reviews.filter(r=>r.action==='needs review').forEach(r=>a.push({sev:'alert',tag:'Fraud review',title:r.customer+' — hold',why:r.reason,ws:'trust',action:{label:'Open ledger',fn:`switchWs('trust')`}}));
 STATE.mapping.queue.forEach(q=>a.push({sev:'warn',tag:'Confirm match',title:q.name,why:`AI suggests “${q.suggestion}” · ${Math.round(q.confidence*100)}% confident`,ws:'mapping',action:{label:'Approve',fn:`approveMap('${q.sku}')`},action2:{label:'Reject',fn:`rejectMap('${q.sku}')`}}));
 STATE.promos.promos.filter(p=>p.wm.state==='overlap'||p.wm.overlap).forEach(p=>a.push({sev:'warn',tag:'Promo overlap',title:p.name,why:'May stack with another auto-apply promo — double-discount risk',ws:'trust',action:{label:'Open promotions',fn:`switchWs('trust')`}}));
 STATE.promos.promos.filter(p=>p.wm.state==='wm_only').forEach(p=>a.push({sev:'alert',tag:'WM-only promo',title:p.name,why:'Live on Weedmaps with no internal promo controlling it',ws:'trust',action:{label:'Link it',fn:`linkPromoRow('${p.id}')`}}));
 STATE.promos.promos.filter(p=>p.wm.state==='not_pushed').forEach(p=>a.push({sev:'warn',tag:'Not on Weedmaps',title:p.name,why:'Internal promo not pushed to Weedmaps yet',ws:'trust',action:{label:'Push',fn:`linkPromoRow('${p.id}')`}}));
 STATE.promos.promos.filter(p=>p.wm.state==='disappeared').forEach(p=>a.push({sev:'warn',tag:'Promo vanished',title:p.name,why:'Gone on WM but may still fire locally',ws:'trust',action:{label:'Review',fn:`switchWs('trust')`}}));
 const order=['alert','warn'];return a.sort((x,y)=>order.indexOf(x.sev)-order.indexOf(y.sev));
}
function attnCount(){return collectAttention().length;}

/* ── The living status spine (§1) ── */
function renderSpine(){
 const el=$('spine');if(!el)return;
 const attn=collectAttention();
 const alerts=attn.filter(a=>a.sev==='alert').length, warns=attn.filter(a=>a.sev==='warn').length;
 const sum=callSummary();
 const sev=alerts?'alert':(warns||sum.errors)?'warn':'ok';
 el.className='spine'+(sev==='alert'?' sev-alert':sev==='warn'?' sev-warn':'');
 const seg=(cls,html,fn)=>`<button class="seg ${cls} ${fn?'click':''}" ${fn?`onclick="${fn}"`:''}>${html}</button>`;
 el.innerHTML=
  seg('',`<span class="hb ${sev==='ok'?'':sev}"></span><b>Weedmaps live</b>`,`switchWs('map')`)
  +seg('g',`Pickup <b>${pickupCount()}</b> · Delivery <b>${deliveryCount()}</b> sellable`,`switchWs('listings')`)
  +(alerts?seg('a',`<b>${alerts}</b> need${alerts>1?'':'s'} you now`,`switchWs('overview')`):'')
  +(warns?seg('w',`<b>${warns}</b> to review`,`switchWs('overview')`):'')
  +(!alerts&&!warns?seg('g',`<b>All clear</b> — nothing needs you`):'')
  +seg('',`On shift <b>${DRIVERS.filter(d=>STATE.on_shift[d]).length}/${DRIVERS.length}</b>`,`switchWs('inventory')`)
  +seg(sum.errors?'a':'g',`Sync errors <b>${sum.errors}</b>`,`switchWs('observ')`)
  +`<div class="sp"></div>`
  +seg('',`<span style="color:var(--ink3)">updated just now</span>`);
}

function renderTopbar(){
 const tokDays=((STATE.token.expires_at-Date.now())/864e5);
 const sum=callSummary();
 const rt=REALTIME;
 set('tbStats',`
  <div class="tstat"><div class="k"><span class="dot live"></span>WM connection</div><div class="v g">Live · Pickup + Delivery</div></div>
  <div class="tstat"><div class="k">Token</div><div class="v ${tokDays<3?'r':'a'}">${tokDays.toFixed(1)}d</div></div>
  <div class="tstat"><div class="k">Sync bus</div><div class="v">${rt.in_flight} in-flt · ${rt.coalesced} coal</div></div>
  <div class="tstat"><div class="k">Latency 60s</div><div class="v">${sum.p50}<span style="color:var(--railDim)">/</span>${sum.p95}<span style="color:var(--railDim)">ms</span></div></div>
  <div class="tstat"><div class="k">Errors 60s</div><div class="v ${sum.errors?'r':'g'}">${sum.errors}</div></div>
  <div class="tstat"><div class="k"><span class="pollpip" id="pollpip"></span>Poll</div><div class="v">3s</div></div>
 `);
}

/* ── Home: order trace + attention inbox + automation ladders ── */
let traceMode='delivery', traceTimer=null;
function traceToggle(){return `<div class="row" style="gap:8px"><div class="seg2"><button class="s2 ${traceMode==='delivery'?'on':''}" onclick="setTrace('delivery')">Delivery</button><button class="s2 ${traceMode==='pickup'?'on':''}" onclick="setTrace('pickup')">Pickup</button></div><button class="btn xs primary" onclick="playTrace()"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Play</button></div>`;}
function setTrace(m){traceMode=m;document.querySelectorAll('.s2').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===m));renderTrace();}
const TRACE={
 delivery:[
  ['Cart on Weedmaps','customer builds a cart','wm'],
  ['Draft webhook','WM waits ~5s for us','us'],
  ['Narrow to on-shift kits','drop what no driver carries','us','key'],
  ['Reprice + soft-hold','lock stock in the region','us'],
  ['Create → bind ONE driver','zip → region → driver','us','key'],
  ['En route → status push','IN_PROGRESS → COMPLETE','driver'],
 ],
 pickup:[
  ['Cart on Weedmaps','customer chooses Pickup','wm'],
  ['Draft webhook','WM waits ~5s for us','us'],
  ['Check STORE stock','store on-hand, not kits','us','key'],
  ['Reprice + soft-hold','lock stock at the store','us'],
  ['Create → reserve @ store','no driver — store location','us','key'],
  ['Ready for pickup','READY_FOR_PICKUP → COMPLETE','store'],
 ],
};
function renderTrace(){
 const steps=TRACE[traceMode];
 const actor={wm:['WM','var(--info)'],us:['Hyperwolf','var(--ink)'],driver:['Driver','var(--good)'],store:['Store','var(--warn)']};
 set('trace',`<div class="tracewrap"><div class="tracerow" id="tracerow">
  ${steps.map((s,i)=>`<div class="tstep" data-i="${i}"><div class="tstep-in ${s[3]==='key'?'key':''}"><div class="tstep-top"><span class="tactor" style="background:${actor[s[2]][1]}">${actor[s[2]][0]}</span><span class="tstep-n">${i+1}</span></div><div class="tstep-t">${s[0]}</div><div class="tstep-d">${s[1]}</div></div>${i<steps.length-1?`<div class="tconn"><span class="tpulse"></span></div>`:''}</div>`).join('')}
 </div>
 <div class="hint" style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap"><span><span class="sw" style="background:var(--accent);display:inline-block;vertical-align:-1px"></span> highlighted steps are where <b>${traceMode==='delivery'?'Delivery':'Pickup'}</b> differs</span><span>Delivery is kit-gated + driver-routed · Pickup draws from store stock, no driver.</span></div></div>`);
}
function playTrace(){
 const row=$('tracerow');if(!row)return;const steps=row.querySelectorAll('.tstep');const conns=row.querySelectorAll('.tconn');
 steps.forEach(s=>s.classList.remove('lit'));conns.forEach(c=>c.classList.remove('flow'));
 let i=0;clearInterval(traceTimer);
 traceTimer=setInterval(()=>{if(i>0&&conns[i-1])conns[i-1].classList.add('flow');if(steps[i])steps[i].classList.add('lit');i++;if(i>=steps.length){clearInterval(traceTimer);}},420);
}
function ladder(title,segs,note,jump){
 return `<div class="ladblock" ${jump?`onclick="switchWs('${jump}')" style="cursor:pointer"`:''}><div class="row" style="justify-content:space-between;margin-bottom:5px"><span style="font-size:12px;font-weight:700">${title}</span><span class="hint">${note}</span></div>
  <div class="ladbar">${segs.map(s=>s.count?`<div class="ladseg ${s.cls}" style="flex:${s.count}"></div>`:'').join('')}</div>
  <div class="ladleg">${segs.map(s=>`<span class="li"><span class="sw ${s.cls}"></span>${s.label} <b>${s.count}</b></span>`).join('')}</div></div>`;
}
function renderLadders(){
 if(!$('ladders'))return;
 const mc=STATE.mapping.counters;
 const prod=[{label:'Auto-linked',count:mc.auto,cls:'auto'},{label:'AI — confirm',count:mc.ai,cls:'ai'},{label:'Manual',count:Math.max(0,mc.mapped_total-mc.auto-mc.ai),cls:'manual'},{label:'Unmapped',count:mc.unmapped,cls:'unmapped'}];
 const P=STATE.promos.promos;const pAuto=P.filter(pSynced).length,pFlag=P.filter(p=>p.wm.state==='overlap'||p.wm.state==='disappeared').length,pUn=P.filter(pNeedsLink).length;
 const prom=[{label:'Auto-linked',count:pAuto,cls:'auto'},{label:'Flagged',count:pFlag,cls:'ai'},{label:'Unlinked',count:pUn,cls:'unmapped'}];
 const ic=STATE.identity.counters;
 const ident=[{label:'Auto-merged',count:ic.merged,cls:'auto'},{label:'Needs review',count:ic.review_open,cls:'ai'},{label:'Fraud-blocked',count:ic.auto_cancels,cls:'unmapped'}];
 const need=mc.ai+mc.unmapped+pFlag+pUn+ic.review_open;
 set('ladders',`<div class="hint" style="margin-bottom:11px">Mapping is <b>semi-automated</b> — automation does the bulk, you handle the tail. <b style="color:${need?'var(--warn)':'var(--good)'}">${need}</b> item${need===1?'':'s'} need a human right now.</div>
  ${ladder('Products → WM',prod,mc.mapped_total+'/'+CATALOG.length+' mapped','mapping')}
  ${ladder('Promotions → WM',prom,P.length+' WM promos','trust')}
  ${ladder('Customers (identity)',ident,ic.identities+' identities','trust')}
  <div class="hint" style="margin-top:4px"><span class="sw auto" style="display:inline-block;vertical-align:-1px"></span> automatic &nbsp; <span class="sw ai" style="display:inline-block;vertical-align:-1px"></span> one-click confirm &nbsp; <span class="sw unmapped" style="display:inline-block;vertical-align:-1px"></span> needs you</div>`);
}
function renderInbox(){
 if(!$('inbox'))return;
 const items=collectAttention();
 if(!items.length){set('inbox',emptyState('shield','All clear','Nothing needs a human. New unmapped SKUs, fraud holds, and promo conflicts will surface here first.',''));return;}
 set('inbox',items.map(it=>`<div class="inbox-item ${it.sev==='alert'?'row-alert':'row-warn'}">
  <div class="row" style="gap:8px;margin-bottom:3px">${pill(it.sev==='alert'?'alert':'warn',it.tag)}<span style="font-weight:700;font-size:12.5px">${it.title}</span></div>
  <div class="hint" style="margin-bottom:8px">${it.why}</div>
  <div class="row" style="gap:6px">${it.action?`<button class="btn xs ${it.sev==='alert'?'primary':'dark'}" onclick="${it.action.fn}">${it.action.label}</button>`:''}${it.action2?`<button class="btn xs rd" onclick="${it.action2.fn}">${it.action2.label}</button>`:''}<button class="btn xs" onclick="switchWs('${it.ws}')">Open →</button></div>
 </div>`).join(''));
}
function renderOverview(){
 renderTrace();renderInbox();renderLadders();
 const onShift=DRIVERS.filter(d=>STATE.on_shift[d]).length;
 set('ovKpis',[
  ['Pickup sellable',pickupCount()+'<small>/'+CATALOG.length+'</small>',''],
  ['Delivery sellable',deliveryCount()+'<small>/'+CATALOG.length+'</small>',''],
  ['On-shift drivers',onShift+'<small>/'+DRIVERS.length+'</small>',''],
  ['Live orders',STATE.orders.filter(o=>['PENDING','IN_PROGRESS','READY_FOR_ATTAINMENT','READY_FOR_PICKUP'].includes(o.status)).length,''],
  ['Unmapped',STATE.mapping.wm_missing.length,STATE.mapping.wm_missing.length?'alert':''],
  ['Open fraud',STATE.identity.counters.review_open,STATE.identity.counters.review_open?'alert':''],
  ['Redemptions',promoRedeemTotal(),''],
  ['Held units',STATE.reservations.filter(r=>r.state!=='released').reduce((a,r)=>a+r.qty,0),''],
 ].map(k=>`<div class="kpi ${k[2]}"><div class="kl">${k[0]}</div><div class="kv">${k[1]}</div></div>`).join(''));
}
function collectAlerts(){return collectAttention().map(a=>({level:a.sev,tag:a.tag,msg:a.why,ws:a.ws,wsLabel:a.ws}));}

/* ── Order path ───────────────────────────────────── */
function renderFlow(){
 const ld=STATE.last_draft;
 if(!ld){set('flow',emptyState('route','No Draft yet','Fire the Order simulator to see a live round-trip.','<button class="btn sm primary" onclick="switchWs(\'orderpath\');document.getElementById(\'simBtn\')&&document.getElementById(\'simBtn\').focus()">Open simulator</button>'));set('flow2','');return;}
 set('flow',`<table><tbody>${ld.sent.map(r=>`<tr><td>${r.name}<div class="muted mono" style="font-size:9px">${r.external_id}</div></td><td class="num">×${r.qty}</td><td class="num">${money(r.price)}</td></tr>`).join('')}</tbody></table><div class="hint" style="margin-top:6px">${ld.sent.length} lines · zip ${ld.zip}</div>`);
 set('flow2',`<table><tbody>${ld.returned.map(r=>`<tr class="${r.kept?'':'row-warn'}"><td>${r.name} ${r.kept?'':`<div class="muted" style="font-size:10px">${r.reason}</div>`}</td><td class="num">${r.kept?'×'+r.qty:'—'}</td><td>${r.kept?pill('ok','kept',false):pill('warn','dropped',false)}</td></tr>`).join('')}</tbody></table><div class="hint" style="margin-top:6px">Answered in ${ld.ms}ms → became the customer's cart</div>`);
}
const STATUS_ORDER=['PENDING','IN_PROGRESS','READY_FOR_ATTAINMENT','COMPLETE'];
const STATUS_ORDER_PICKUP=['PENDING','IN_PROGRESS','READY_FOR_PICKUP','COMPLETE'];
function statusPill(s){
 if(s==='COMPLETE')return pill('ok',s);
 if(s.startsWith('CANCELED')||s==='FAILED')return pill('alert',s);
 if(s==='READY_FOR_ATTAINMENT'||s==='READY_FOR_PICKUP')return pill('info',s);
 if(s==='IN_PROGRESS')return pill('live',s);
 return pill('ghost',s);
}
function fulfilChip(f){return f==='pickup'?`<span class="tag" style="background:var(--warnSoft);color:var(--warn);border-color:transparent">PICKUP</span>`:`<span class="tag" style="background:var(--infoSoft);color:var(--info);border-color:transparent">DELIVERY</span>`;}
function renderOrders(){
 if(!STATE.orders.length){set('orders',emptyState('route','No orders yet','Simulated Create webhooks land here — delivery orders bind a driver, pickup orders bind the store.',''));return;}
 set('orders',`<table><thead><tr><th>Order</th><th>Type</th><th>Customer</th><th>Routing / fulfilment</th><th>Bound to</th><th class="num">Total</th><th>Status</th><th>Push</th></tr></thead><tbody>
 ${STATE.orders.map(o=>`<tr class="${o.alert?'row-alert':''}"><td class="mono">${o.wm_order_id}</td><td>${fulfilChip(o.fulfillment||'delivery')}</td><td>${o.customer_name}</td><td class="muted" style="font-size:10.5px">${o.routing}</td><td>${o.fulfillment==='pickup'?'<span class="dotlbl"><span class="dot" style="background:var(--warn)"></span>WeHo store</span>':o.driver_id?driverChip(o.driver_id):'<span class="muted">—</span>'}</td><td class="num">${money(o.grand_total)}</td><td>${statusPill(o.status)}</td>
 <td>${o.status==='COMPLETE'||o.status.startsWith('CANCELED')?'<span class="muted">—</span>':`<button class="btn xs" onclick="pushStatus('${o.wm_order_id}')">Advance</button>`}</td></tr>`).join('')}
 </tbody></table>`);
}
function driverChip(d){const on=STATE.on_shift[d];return `<span class="dotlbl"><span class="dot" style="background:${on?'var(--good)':'var(--ink4)'}"></span>${d}</span>`;}

/* ── Listings ─────────────────────────────────────── */
function renderListings(){
 set('pipeline',`<div class="loop" style="gap:8px"><div class="step" style="min-width:0;flex:1"><div class="s-t" style="font-size:11px">Catalog</div><div class="s-d">${CATALOG.length} SKUs</div></div><div class="arrow">${chev()}</div><div class="step" style="min-width:0;flex:1"><div class="s-t" style="font-size:11px">Mapped</div><div class="s-d">${STATE.mapping.counters.mapped_total} linked</div></div><div class="arrow">${chev()}</div><div class="step" style="min-width:0;flex:1"><div class="s-t" style="font-size:11px">On WM</div><div class="s-d">${STATE.union.length} buyable now</div></div></div>`);
 const heads=[

function renderZip(quiet){

 const el=$('map');if(!el)return;
 const matches=Object.entries(REGIONS).filter(([r,v])=>v.zips.includes(zip)).map(([r,v])=>({r,v,on:v.drivers.filter(d=>STATE.on_shift[d])}));
 if(!matches.length){el.innerHTML=`<div class="row-warn" style="padding:10px;border-radius:8px">${pill('warn','NO COVERAGE')}<div style="margin-top:5px">Zip <b>${zip}</b> maps to no region — WM must not sell here.</div></div>`;$('zip-hint')&&($('zip-hint').textContent='');return;}
 // tiebreaker when a zip is shared by 2+ regions: on-shift availability → region priority → most on-shift drivers
 const ranked=[...matches].sort((a,b)=>(b.on.length>0)-(a.on.length>0)||(a.v.priority||9)-(b.v.priority||9)||b.on.length-a.on.length);
 const win=ranked[0];const shared=matches.length>1;const drivers=win.v.drivers;const onShift=win.on;
 const others=ranked.slice(1);
 const sharedBanner=shared?`<div class="row-warn" style="padding:9px 11px;border-radius:8px;margin-bottom:10px">${pill('warn','SHARED ZIP')}<div style="font-size:12px;margin-top:4px"><b>${zip}</b> falls in <b>${matches.length} regions</b> — ${matches.map(m=>m.r).join(', ')}. We route to <b>${win.r}</b> ${win.on.length?`because it’s the primary area (priority ${win.v.priority}) with an on-shift driver`:`by priority — but it has no on-shift driver`}.</div><div class="hint" style="margin-top:5px">Tiebreaker: on-shift coverage → region priority → driver load. ${others.map(o=>`<span class="tag" style="margin-right:4px">${o.r} · ${o.on.length?o.on.length+' on-shift (fallback)':'no driver'}</span>`).join('')}</div></div>`:'';

}

const ENTITY_TONE={user:'var(--info)',product:'var(--violet)',cart:'var(--good)',bogo:'var(--warn)'};

function promoStatusPill(s){return {active:pill('ok','Active',false),scheduled:pill('info','Scheduled',false),paused:pill('warn','Paused',false),ended:pill('ghost','Ended',false)}[s]||pill('ghost',s,false);}
function wmSyncPill(p){const w=p.wm.state;
 if(w==='synced')return pill('ok','On Weedmaps',false);
 if(w==='overlap')return pill('warn','Overlap',false);
 if(w==='not_pushed')return pill('warn','Not pushed',false);
 if(w==='disappeared')return pill('alert','Vanished',false);

 return pill('ghost','—',false);}
function spark(series,color){const w=62,h=22;const max=Math.max(...series,1),min=Math.min(...series),rng=(max-min)||1;const pts=series.map((v,i)=>[i/(series.length-1)*w,h-((v-min)/rng)*(h-5)-2.5]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<svg width="${w}" height="${h}" style="display:block"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;}

function callSummary(){

 const ms=win.map(c=>c.ms).filter(m=>m>0).sort((a,b)=>a-b);
 const pct=p=>ms.length?ms[Math.min(ms.length-1,Math.floor(p*ms.length))]:0;
 return{total:win.length,outbound:win.filter(c=>c.dir==='out').length,inbound:win.filter(c=>c.dir==='in').length,errors:win.filter(c=>!c.ok).length,p50:pct(.5),p95:pct(.95)};

 return `<div class="call ${c.dir} ${c.pending?'pending':''}" data-cid="${c.id}"><span class="arw">${c.dir==='out'?'↑':'↓'}</span><span class="meth">${c.method}</span><span class="pth" title="${c.path}">${shortPath}${c.note?` <span class="k">${c.note}</span>`:''}</span><span class="meta"><span class="tag ${c.kind}" style="font-size:8px;padding:0 4px">${c.kind}</span>${st}<span class="ms">${c.pending?'':c.ms+'ms'}</span></span></div>`;
}
function rebuildFeed(){
 const feed=$('callfeed');const atBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<40;
 const visible=CALLS.filter(c=>callFilter.has(c.kind));
 feed.innerHTML=visible.slice(-120).map(callRow).join('');
 renderedCallIds=new Set(visible.map(c=>c.id));
 if(!paused&&atBottom)feed.scrollTop=feed.scrollHeight;
}
function appendNewCalls(){
 if(paused)return;
 const feed=$('callfeed');const atBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<50;
 CALLS.filter(c=>callFilter.has(c.kind)&&!renderedCallIds.has(c.id)).forEach(c=>{
  const div=document.createElement('div');div.innerHTML=callRow(c).trim();const node=div.firstChild;node.classList.add('new');feed.appendChild(node);renderedCallIds.add(c.id);
 });
 // update pending → resolved rows in place
 CALLS.forEach(c=>{const ex=feed.querySelector(`[data-cid="${c.id}"]`);if(ex&&!c.pending&&ex.classList.contains('pending')){ex.outerHTML=callRow(c);}});
 if(!paused&&atBottom)feed.scrollTop=feed.scrollHeight;
 if(CALLS.length>250)CALLS=CALLS.slice(-200);
}
function addCall(c,cb){
 const id=++CALL_SEQ;const row={id,ts:Date.now()/1000,ok:true,status:0,ms:0,note:null,...c};CALLS.push(row);
 if(row.pending){REALTIME.in_flight++;renderTopbar();}
 appendNewCalls();
 if(cb)cb(id);
 return id;
}
function resolveCall(id,status,ms,ok=true){
 const c=CALLS.find(x=>x.id===id);if(!c)return;
 if(c.pending){REALTIME.in_flight=Math.max(0,REALTIME.in_flight-1);REALTIME.ran++;}
 c.pending=false;c.status=status;c.ms=ms;c.ok=ok;if(!ok)REALTIME.failed++;
 appendNewCalls();renderDock();renderTopbar();
}

let learnOn=false;
function toggleLearn(){learnOn=!learnOn;$('learnBtn').classList.toggle('on',learnOn);document.querySelectorAll('.pinfo').forEach(b=>{b.style.background=learnOn?'var(--accent)':'';b.style.color=learnOn?'var(--accentInk)':'';b.style.borderColor=learnOn?'var(--accent)':'';});}
function openExplain(btn,key,title,n){
 closePop();
 const ex=EX[key];if(!ex)return;
 const r=btn.getBoundingClientRect();
 const pop=document.createElement('div');pop.className='pop';pop.id='pop';
 pop.innerHTML=`<div class="ph"><div class="t">${n?`<span class="n">${n}</span>`:''}${title}</div></div><div class="pb">
  <div class="qa"><div class="q">What is this?</div><p>${ex[0]}</p></div>
  <div class="qa"><div class="q how">How does it work?</div><p>${ex[1]}</p></div>
  <div class="qa"><div class="q why">Why does it exist?</div><p>${ex[2]}</p></div></div>`;
 document.getElementById('overlays').appendChild(pop);
 const pw=340;let left=r.right-pw;if(left<8)left=8;if(left+pw>innerWidth-8)left=innerWidth-8-pw;
 let top=r.bottom+8;if(top+pop.offsetHeight>innerHeight-8)top=Math.max(8,r.top-pop.offsetHeight-8);
 pop.style.left=left+'px';pop.style.top=top+'px';
 setTimeout(()=>document.addEventListener('mousedown',popAway),0);
}
function popAway(e){const p=$('pop');if(p&&!p.contains(e.target)){closePop();}}
function closePop(){const p=$('pop');if(p)p.remove();document.removeEventListener('mousedown',popAway);}

function openGlossary(){
 closeOverlay();
 const o=document.getElementById('overlays');
 o.innerHTML=`<div class="scrim" onclick="closeOverlay()"></div><div class="modal"><div class="mh"><h3>Glossary</h3><span class="hint">${GLOSSARY.length} domain terms</span><button class="x" onclick="closeOverlay()">✕</button></div><div class="mb"><input class="gl-search" id="glq" placeholder="Filter terms…" oninput="filterGlossary()"><dl id="gldl">${glossaryHTML(GLOSSARY)}</dl></div></div>`;
 setTimeout(()=>$('glq')&&$('glq').focus(),30);
}
function glossaryHTML(list){return list.map(g=>`<div class="gl-item"><dt>${g[0]}</dt><dd>${g[1]}</dd></div>`).join('');}
function filterGlossary(){const q=$('glq').value.toLowerCase();$('gldl').innerHTML=glossaryHTML(GLOSSARY.filter(g=>g[0].toLowerCase().includes(q)||g[1].toLowerCase().includes(q)));}
function closeOverlay(){const o=document.getElementById('overlays');if(o&&o.querySelector('.modal,.scrim,.cmdk'))o.innerHTML='';}

/* command palette */
let cmdItems=[],cmdSel=0;
function openCmd(){
 closeOverlay();
 cmdItems=[
  ...WS.map(w=>({t:'Go to '+w.label,kind:'workspace',fn:()=>switchWs(w.id)})),
  {t:'Fire order simulator',kind:'action',fn:()=>{switchWs('orderpath');setTimeout(simulate,200);}},
  {t:'Push both listings to WM',kind:'action',fn:sync},
  {t:'Run reconcile sweep',kind:'action',fn:reconcile},
  {t:'Run nightly matcher',kind:'action',fn:runNightly},
  {t:'Open glossary',kind:'action',fn:openGlossary},
  ...GLOSSARY.map(g=>({t:g[0],kind:'term',fn:()=>{openGlossary();setTimeout(()=>{$('glq').value=g[0];filterGlossary();},60);}})),
 ];
 cmdSel=0;
 const o=document.getElementById('overlays');
 o.innerHTML=`<div class="scrim" onclick="closeOverlay()"></div><div class="cmdk"><input id="cmdi" placeholder="Search workspaces, actions, terms…" oninput="cmdFilter()" onkeydown="cmdKey(event)"><div class="res" id="cmdres"></div></div>`;
 renderCmd(cmdItems);setTimeout(()=>$('cmdi').focus(),30);
}
function renderCmd(list){cmdItems=list;set('cmdres',list.map((it,i)=>`<div class="ci ${i===cmdSel?'sel':''}" onmouseenter="cmdSel=${i};hlCmd()" onclick="cmdRun(${i})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>${it.t}<span class="kind">${it.kind}</span></div>`).join(''));}
function cmdFilter(){const q=$('cmdi').value.toLowerCase();const all=[...WS.map(w=>({t:'Go to '+w.label,kind:'workspace',fn:()=>switchWs(w.id)})),{t:'Fire order simulator',kind:'action',fn:()=>{switchWs('orderpath');setTimeout(simulate,200);}},{t:'Push both listings to WM',kind:'action',fn:sync},{t:'Run reconcile sweep',kind:'action',fn:reconcile},{t:'Run nightly matcher',kind:'action',fn:runNightly},{t:'Open glossary',kind:'action',fn:openGlossary},...GLOSSARY.map(g=>({t:g[0],kind:'term',fn:()=>{openGlossary();setTimeout(()=>{$('glq').value=g[0];filterGlossary();},60);}}))];cmdSel=0;renderCmd(all.filter(it=>it.t.toLowerCase().includes(q)));}
function hlCmd(){document.querySelectorAll('#cmdres .ci').forEach((c,i)=>c.classList.toggle('sel',i===cmdSel));}
function cmdKey(e){if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);hlCmd();}else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);hlCmd();}else if(e.key==='Enter'){cmdRun(cmdSel);}else if(e.key==='Escape')closeOverlay();}
function cmdRun(i){const it=cmdItems[i];closeOverlay();if(it&&it.fn)it.fn();}

/* ══════════════════════════════════════════════════════════════════
   NAV + BOOT + POLL
   ══════════════════════════════════════════════════════════════════ */
let curWs='overview';
function buildRail(){
 $('rail').innerHTML=`<div class="rl-lbl">Workspaces</div>`+WS.map(w=>{const b=w.badge?w.badge():0;return `<button class="nav-item ${w.id===curWs?'on':''}" data-ws="${w.id}" onclick="switchWs('${w.id}')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">${ICONS[w.icon]}</svg><span>${w.label}</span>${b?`<span class="cnt ${w.id==='trust'||w.id==='mapping'&&STATE.mapping.wm_missing.length?'alert':''}">${b}</span>`:''}</button>`;}).join('')
 +`<div class="spring"></div><div class="foot"><button class="nav-item" onclick="reconcile()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg><span>Reconcile now</span></button></div>`;
}
function rebuildRailBadges(){buildRail();}
const WS_BODY={overview:wsOverview,map:wsMap,orderpath:wsOrderPath,listings:wsListings,mapping:wsMapping,fields:wsFields,inventory:wsInventory,trust:wsTrust,observ:wsObserv,dev:wsDev};
function switchWs(id){
 curWs=id;closePop();
 document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.ws===id));
 const w=WS.find(x=>x.id===id);
 $('main').innerHTML=`<div class="ws-hd"><h1>${w.label}</h1><span class="sub" id="wsSub">${WS_SUB[id]||''}</span><div class="sp"></div>${wsHdActions(id)}</div><div id="wsBody">${WS_BODY[id]()}</div>`;
 $('main').scrollTop=0;
 renderAll();
 if(learnOn)toggleLearn(),toggleLearn();
}
function wsHdActions(id){
 const m={overview:'',orderpath:'<button class="btn sm primary" onclick="simulate()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Simulate order</button>',listings:'<button class="btn sm" onclick="reconcile()">Reconcile</button>',mapping:'<button class="btn sm" onclick="runNightly()">Run matcher</button>',inventory:'',trust:'',observ:'',dev:''};
 return m[id]||'';
}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCmd();}if(e.key==='Escape'){closeOverlay();closePop();}});
function toggleDock(){$('app').classList.toggle('dock-collapsed');const c=$('dockChev');c.innerHTML=$('app').classList.contains('dock-collapsed')?'<path d="m15 18-6-6 6-6"/>':'<path d="m9 18 6-6-6-6"/>';}

/* poll simulation — content changes underneath without layout jump */
function poll(){
 // pulse poll pip
 const pip=$('pollpip');if(pip){pip.classList.add('on');setTimeout(()=>pip.classList.remove('on'),200);}
 // token countdown already time-based
 // occasionally emit a background call (heartbeat / promo pull)
 if(Math.random()<0.5){const kinds=[['out','GET','/wm/2025-07/partners/promotions','promos'],['out','GET','/wm/2025-07/partners/menus','menu'],['out','POST','/auth/token','auth']];const k=kinds[Math.floor(Math.random()*kinds.length)];const cid=addCall({dir:k[0],method:k[1],path:k[2],kind:k[3],pending:true});setTimeout(()=>resolveCall(cid,200,80+Math.floor(Math.random()*140)),300);}
 // tick reservations TTL visually
 if(curWs==='inventory')renderReservations();
 renderDock();renderTopbar();
}
function boot(){
 buildRail();
 // seed sim cart chips
 switchWs('overview');
 rebuildFeed();renderDockFilters();renderDock();renderTopbar();
 // sim sku chips need render after orderpath built; handled on switch
 setInterval(poll,3000);
 setInterval(appendNewCalls,1200);
 let rz;window.addEventListener('resize',()=>{if(curWs==='map'){clearTimeout(rz);rz=setTimeout(renderMap,120);}});
}
// seed sim sku chips whenever orderpath renders
const _switch=switchWs;
switchWs=function(id){_switch(id);if(id==='orderpath'){const box=$('sim-skus');if(box)box.innerHTML=['BD-F-35G','SD-V-1G','PB-F-14G'].map(s=>`<span class="tag" style="background:var(--ink);color:var(--onInk)">${s} ✕</span>`).join('')+'<button class="tag" style="cursor:pointer">+ add</button>';}};
boot();
</script>
