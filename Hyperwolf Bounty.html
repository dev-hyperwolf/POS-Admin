<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bounty — Hyperwolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(128,128,120,.32); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,120,.5); background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  input::placeholder { color:rgba(128,128,120,.7); }
  button, select, input, textarea { font-family:inherit; }
  a { color:#7A5A00; }
  a:hover { color:#0F0F0C; }
  /* Engage's HTML never declares these even though shared/states.jsx's Skeleton
     depends on `shimmer` -- POS.html does (see its own <style>). Declared here
     rather than left silently broken, same three keyframes, same values. */
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes hwspin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- The stacking scale. MUST be first: every floating layer on this page reads
     it, and the plain-JS chrome mounts before any text/babel module has run. -->
<script src="shared/hw-z.js"></script>
<script src="shared/brands.js"></script>
<script src="shared/app-nav.js"></script>
<!-- shared/hw-live.js, LOADED BEFORE REACT, same as Hyperwolf POS.html — the
     app-nav.js/hw-z.js ordering above is unaffected by that (both are plain
     JS with no React dependency). data-hw-live-lite="1" arms base resolution,
     get()/post(), the write token and the badge, and skips the /api/state
     catalog fetch, the fulfilment-board fetch and the window.HW accessor:
     this app carries no pos/data.jsx and has no catalog for any of those to
     update. See shared/hw-live.README.md's "Lite mode" section — that
     section, and the gate itself, were added for this page. -->
<script src="shared/hw-live.js" data-hw-live-lite="1"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- window.ScreenBoundary (CONTAIN) + window.CriticalBoundary (REFUSE).
     PLAIN JS, after React and BEFORE babel — see the note in
     shared/error-boundary.jsx and the matching note in incentives/app.jsx. -->
<script src="shared/error-boundary.jsx"></script>

<script type="text/babel" src="pos/tokens.jsx"></script>
<script type="text/babel" src="pos/icons.jsx"></script>
<script type="text/babel" src="pos/atoms.jsx"></script>
<script type="text/babel" src="shared/app-rail.jsx"></script>
<script type="text/babel" src="shared/states.jsx"></script>
<script type="text/babel" src="shared/hd-format.jsx"></script>
<script type="text/babel" src="shared/hd-ui.jsx"></script>
<script type="text/babel" src="incentives/inc-client.jsx"></script>
<script type="text/babel" src="incentives/inc-shared.jsx"></script>
<script type="text/babel" src="incentives/app.jsx"></script>

<script src="shared/app-switcher.js"></script>
</body>
</html>
